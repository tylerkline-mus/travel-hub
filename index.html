}
/** A gentle curve between two points, for flights */
function flightArc(a, b) {
  const [y1, x1] = a, [y2, x2] = b;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
  const cx = mx - dy * 0.22, cy = my + dx * 0.22 * (dx >= 0 ? 1 : -1) * (dx >= 0 ? 1 : 1);
  const pts = [];
  for (let k = 0; k <= 32; k++) { const u = k / 32, v = 1 - u; pts.push([v * v * y1 + 2 * v * u * cy + u * u * y2, v * v * x1 + 2 * v * u * cx + u * u * x2]); }
  return pts;
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#b9532c'; }

function drawMap(t, layer) {
  const pts = [];
  const C = { place: cssVar('--place'), idea: cssVar('--idea'), fixed: cssVar('--fixed'), tour: cssVar('--tour'), found: cssVar('--found') };
  const note = $('#map-note');
  const say = msg => { if (note) { note.hidden = !msg; note.textContent = msg || ''; } };
  const addDot = (o, color, kind = 'item') => {
    if (!hasCoords(o)) return;
    const ll = [+o.lat, +o.lng]; pts.push(ll);
    const radius = o.priority === 'must' ? 11 : o.priority === 'maybe' ? 6 : 8;
    L.circleMarker(ll, { radius, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).bindPopup(popup(o, kind)).addTo(layer);
  };
  const addNum = (o, n, color, kind = 'item') => {
    if (!hasCoords(o)) return;
    const ll = [+o.lat, +o.lng]; pts.push(ll);
    L.marker(ll, { icon: pinNum(n, color) }).bindPopup(popup(o, kind)).addTo(layer);
  };
  const addHome = o => {
    if (!o || !hasCoords(o)) return;
    const ll = [+o.lat, +o.lng]; pts.push(ll);
    L.marker(ll, { icon: pinHome(), zIndexOffset: -100 }).bindPopup(popup(o, 'item')).addTo(layer);
  };
  const drawLegs = (seq, color, fixedMode) => {
    const located = seq.filter(hasCoords);
    const legs = [];
    for (let k = 1; k < located.length; k++) {
      const a = located[k - 1], b = located[k];
      legs.push({ from: [+a.lat, +a.lng], to: [+b.lat, +b.lng], mode: fixedMode || b.mode || guessMode(a, b) });
    }
    if (!legs.length) return;
    const straight = legs.map(l => L.polyline([l.from, l.to], { color, weight: 3, opacity: .7, dashArray: '6 8' }).addTo(layer));
    getRoutes(legs).then(res => {
      if (!map || !map.hasLayer(layer)) return;
      res.forEach((pl, k) => {
        if (!pl) return;
        layer.removeLayer(straight[k]);
        L.polyline(decodePolyline(pl), { color, weight: 4, opacity: .85 }).addTo(layer);
      });
      if (res.some(r => !r)) say(ui.noRoutes && !(cfg && cfg.demo) ? 'Dashed lines are straight-line. Turn on the Routes API for real paths.' : '');
    });
  };

  const seenAirports = {};
  const drawFlights = (list, target, day) => {
    list.forEach(f => {
      // On an arrival day, frame only where you land; on a departure day, frame the whole hop
      const arrivalOnly = day && f.day !== day && f.end_day === day;
      let a = num(f.from_lat) !== null ? [+f.from_lat, +f.from_lng] : null;
      let b = num(f.to_lat) !== null ? [+f.to_lat, +f.to_lng] : null;
      if (a && seenAirports[f.from_code]) a = seenAirports[f.from_code];
      // Cross the date line the short way. The end nearer the trip stays put; the far end moves to the same side of the map.
      if (a && b && Math.abs(b[1] - a[1]) > 180) {
        const keepB = Math.abs(b[1] - tripLng) <= Math.abs(a[1] - tripLng);
        if (keepB) a = [a[0], a[1] + (b[1] > a[1] ? 360 : -360)];
        else b = [b[0], b[1] + (a[1] > b[1] ? 360 : -360)];
      }
      [[a, f.from_code, f.from_name], [b, f.to_code, f.to_name]].forEach(([ll, code, name]) => {
        if (!ll || seenAirports[code]) return; seenAirports[code] = ll;
        if (!(arrivalOnly && code === f.from_code)) target.push(ll);
        L.marker(ll, { icon: L.divIcon({ className: 'ap-pin', html: `<span>${esc(code)}</span>`, iconSize: [44, 24], iconAnchor: [22, 12] }) })
          .bindPopup(`<b>${esc(name || code)}</b>`).addTo(layer);
      });
      if (a && b) {
        L.polyline(flightArc(a, b), { color: C.fixed, weight: 2.5, opacity: .8, dashArray: '2 7', lineCap: 'round' }).addTo(layer);
      }
    });
  };
  drawMap._flightPts = [];
  const located = itemsFor(t.id).filter(i => hasCoords(i) && !isFlight(i));
  const tripLng = located.length ? located.reduce((n, i) => n + +i.lng, 0) / located.length : 0;

  const items = itemsFor(t.id);
  const d = ui.mapDay;
  if (d === 'all' || d === 'unplanned') {
    if (d === 'all') drawFlights(items.filter(i => isFlight(i) && !i.parent_id), drawMap._flightPts);
    items.forEach(i => {
      if (d === 'unplanned' && (i.day || i.kind === 'fixed' || i.parent_id)) return;
      if (isSuggestion(i)) return; // not on the map until kept
      if (i.kind === 'fixed' && isStay(i)) return addHome(i);
      if (isFlight(i)) return;
      const parent = i.parent_id && itemById(i.parent_id);
      addDot(i, parent ? C.tour : i.status === 'done' ? C.found : (C[i.kind] || C.place));
    });
    const missing = items.filter(i => !hasCoords(i) && i.kind !== 'idea' && !isFlight(i) && !isSuggestion(i)).length;
    say(missing ? `${missing} saved ${missing === 1 ? 'item has' : 'items have'} no location yet.` : '');
    return pts;
  }

  const home = stayForMorning(t.id, d);
  addHome(home);
  drawFlights(items.filter(i => isFlight(i) && !i.parent_id && (i.day === d || i.end_day === d)), pts, d);
  const nightStay = stayForNight(t.id, d);
  if (nightStay && nightStay !== home) addHome(nightStay);

  if (ui.mapLayer === 'lived') {
    const seq = flatLogs(t.id, d);
    seq.forEach((l, k) => addNum(l, k + 1, l.parent_id ? C.tour : l.origin === 'found' ? C.found : C.place, 'log'));
    drawLegs(home ? [home, ...seq] : seq, C.found);
    say(seq.length ? '' : 'Nothing logged this day yet.');
    return pts;
  }

  // Plan: fixed events, tours, planned stops
  fixedEvents(t.id, d).forEach(e => {
    if (isStay(e.i) || isFlight(e.i)) return;
    if (isTour(e.i) && e.start) {
      const kids = childrenOf(e.i.id);
      addDot(e.i, C.tour);
      kids.forEach((s, k) => addNum(s, k + 1, C.tour));
      drawLegs([e.i, ...kids], C.tour, 'tour');
    } else addDot(e.i, C.fixed);
  });
  const stops = plannedStops(t.id, d);
  stops.forEach((s, k) => addNum(s, k + 1, s.kind === 'idea' ? C.idea : C.place));
  drawLegs(home ? [home, ...stops] : stops, C.place);
  const unlocated = stops.filter(s => !hasCoords(s)).length;
  say(!stops.length && !fixedEvents(t.id, d).length ? 'Nothing planned this day yet.' : unlocated ? `${unlocated} planned ${unlocated === 1 ? 'stop has' : 'stops have'} no location.` : '');
  return pts;
}

function listForKey(key) {
  const r = route(); const tid = r.id;
  const [kind, val] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
  if (kind === 'day') return { sheet: 'Items', list: plannedStops(tid, val) };
  if (kind === 'tour') return { sheet: 'Items', list: childrenOf(val) };
  if (kind === 'log') return { sheet: 'Log', list: topLogs(tid, val) };
  return { sheet: 'Items', list: [] };
}
function moveIn(key, id, dir) {
  const { sheet, list } = listForKey(key);
  const ids = list.map(x => x.id);
  const k = ids.indexOf(id), j = dir === 'up' ? k - 1 : k + 1;
  if (k < 0 || j < 0 || j >= ids.length) return;
  [ids[k], ids[j]] = [ids[j], ids[k]];
  queue('reorder', { sheet, ids, key }, () => {
    const src = sheet === 'Log' ? db.log : db.items;
    ids.forEach((x, n) => { const o = src.find(y => y.id === x); if (o) o.seq = String(n); });
  });
}

async function refreshAll(tripId, btn) {
  if (!navigator.onLine) return toast('Needs a connection');
  btn.disabled = true;
  let total = 0;
  try {
    for (let n = 0; n < 40; n++) {
      btn.textContent = `Updating… ${total} done`;
      const res = await api('refreshAll', { trip: tripId });
      (res.updated || []).forEach(o => { const k = db.items.findIndex(x => x.id === o.id); if (k >= 0) db.items[k] = o; });
      total += (res.updated || []).length;
      saveLocal();
      if (!res.remaining || !(res.updated || []).length) break;
    }
    toast(`Updated ${total} place${total === 1 ? '' : 's'}`);
  } catch (e) { toast('Couldn’t finish: ' + e.message); }
  render();
}

function openSheet(html, onMount) {
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(scrim, sh);
  scrim.onclick = () => closeSheet();
  requestAnimationFrame(() => { scrim.classList.add('open'); sh.classList.add('open'); });
  if (onMount) onMount(sh);
  return sh;
}
function closeSheet(instant) {
  $$('.scrim, .sheet').forEach(el => {
    if (instant) return el.remove();
    el.classList.remove('open'); setTimeout(() => el.remove(), 260);
  });
}

function tripOptions(selected) {
  const today = todayStr();
  const trips = [...db.trips].sort((a, b) => {
    const pa = a.end && a.end < today, pb = b.end && b.end < today;
    return pa - pb || String(a.start || '9999').localeCompare(String(b.start || '9999'));
  });
  return `<option value="">Someday (no trip yet)</option>` +
    trips.map(t => `<option value="${esc(t.id)}" ${t.id === selected ? 'selected' : ''}>${esc(t.name)}${t.start ? ' · ' + esc(fmtRange(t.start, t.end)) : ''}</option>`).join('');
}
function dayOptions(t, selected, blankLabel = 'No day yet') {
  const days = t ? tripDays(t) : [];
  if (selected && !days.includes(selected)) days.push(selected);
  return `<option value="">${blankLabel}</option>` + days.sort().map(d => `<option value="${d}" ${d === selected ? 'selected' : ''}>${esc(fmtDay(d))}</option>`).join('');
}
function linkTitle(text) { return text.split('\n').find(l => l.trim() && !isUrl(l)) || 'Saved place'; }

/* ---------- Item detail ---------- */
function openItem(id) {
  const i = itemById(id);
  if (!i) return;
  const t = tripById(i.trip_id);
  const parent = i.parent_id ? itemById(i.parent_id) : null;
  let hours = null;
  try { hours = i.hours ? JSON.parse(i.hours) : null; } catch (e) {}
  const refDay = i.day ? parseDate(i.day).getDay() : new Date().getDay();
  const hoursHtml = hours && hours.weekday && hours.weekday.length
    ? `<ul class="hours">${hours.weekday.map(w => `<li class="${w.startsWith(DOW_LONG[refDay]) ? 'today' : ''}">${esc(w)}</li>`).join('')}</ul>` : '';
  let kind = i.kind;
  const kids = i.kind === 'fixed' ? childrenOf(i.id) : [];
  const showStops = i.kind === 'fixed' && (isTour(i) || kids.length);
  const st = isStay(i), fl = isFlight(i), tour = /^tour$/i.test(i.category || '');
  const startL = st ? 'Check in' : fl ? 'Departs' : tour ? 'Pickup' : 'Starts';
  const endL = st ? 'Check out' : fl ? 'Arrives' : tour ? 'Return' : 'Ends';
  const sugFor = parent && isSuggestion(i) ? parent : null;   // this is one of Claude's suggestions
  const sugs = i.kind === 'idea' ? suggestionsOf(i.id) : [];
  const restStatus = i.status === 'answered' || sugs.length ? 'answered' : 'open'; // what "off" goes back to
  const reply = ((i.notes || '').match(/(?:^|\n)Claude: ([\s\S]+)$/) || [])[1];  // Claude's answer, appended to the notes
  const askText = s => s === 'ask' ? 'Claude will look into this next time you say “check my asks.”'
    : s === 'answered' ? (reply ? `Claude: ${reply.trim()}` : 'Claude answered — suggestions are below.') + ' Turn on to ask again.'
    : 'Want real options? Turn on, then say “check my asks” to Claude.';

  openSheet(`
    <div class="field"><input id="it-title" value="${esc(i.title)}" style="font-family:var(--serif);font-size:20px;font-weight:600;border:0;background:none;padding:4px 2px"></div>
    ${sugFor ? `<div class="hint" style="margin-top:-10px"><span class="badge sugg">Suggested</span>for <a href="#" id="it-parent">${esc(parent.title)}</a></div>`
      : parent ? `<div class="hint" style="margin-top:-10px">Stop on <a href="#" id="it-parent">${esc(parent.title)}</a></div>` : ''}
    <div class="seg" id="it-kind" ${sugFor ? 'hidden' : ''}>${['place', 'idea', 'fixed'].map(k => `<button data-k="${k}" class="${k === kind ? 'on' : ''}">${KIND[k]}</button>`).join('')}</div>
    ${i.kind === 'idea' ? `<div class="ask-row"><div class="body"><div class="t">Ask Claude</div><div class="s" id="it-ask-s">${esc(askText(i.status))}</div></div>
      <button class="switch ${i.status === 'ask' ? 'on' : ''}" id="it-ask" role="switch" aria-checked="${i.status === 'ask'}" aria-label="Ask Claude"></button></div>` : ''}
    ${sugs.length ? `<h4>Suggestions</h4><div id="it-sugs">${suggestionList(sugs)}</div>` : ''}
    <div id="it-prio-wrap" ${kind === 'fixed' ? 'hidden' : ''}><div class="field" style="margin-bottom:6px"><label>Priority</label></div>
      <div class="seg" id="it-prio"><button data-p="" class="${!i.priority ? 'on' : ''}">—</button>${PRIOS.map(([k, l]) => `<button data-p="${k}" class="${i.priority === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    ${(i.address || hoursHtml || i.maps_url || i.website) ? `<div class="info">
      ${i.address ? `<div>${esc(i.address)}</div>` : ''}
      ${hoursHtml}
      <div class="links">
        ${i.maps_url ? `<a href="${esc(i.maps_url)}" target="_blank" rel="noopener">Open in Maps</a>` : ''}
        ${i.website ? `<a href="${esc(i.website)}" target="_blank" rel="noopener">Website</a>` : ''}
        ${i.maps_url && !(cfg && cfg.demo) ? `<a href="#" id="it-refresh">Refresh details</a>` : ''}
      </div></div>` : ''}
    <div class="two">
      <div class="field"><label>Trip</label><select id="it-trip" ${parent ? 'disabled' : ''}>${tripOptions(i.trip_id)}</select></div>
      <div class="field"><label>Category</label><input id="it-cat" value="${esc(i.category)}" list="cats"><datalist id="cats">${FIXED_CATS.map(c => `<option>${c}</option>`).join('')}</datalist></div>
    </div>
    <div id="it-when-fixed" ${kind === 'fixed' ? '' : 'hidden'}>
      <div class="two" id="it-air" ${fl ? '' : 'hidden'}>
        <div class="field"><label>From (airport code)</label><input id="it-from" value="${esc(i.from_code || '')}" maxlength="4" autocapitalize="characters" autocomplete="off"></div>
        <div class="field"><label>To</label><input id="it-to" value="${esc(i.to_code || '')}" maxlength="4" autocapitalize="characters" autocomplete="off"></div>
      </div>
      <div class="two">
        <div class="field"><label>${startL}</label><input type="date" id="it-day" value="${esc(i.day)}"></div>
        <div class="field"><label>&nbsp;</label><input type="time" id="it-time" value="${esc(i.start_time)}"></div>
      </div>
      <div class="two">
        <div class="field"><label>${endL}</label><input type="date" id="it-end-day" value="${esc(i.end_day || '')}"></div>
        <div class="field"><label>&nbsp;</label><input type="time" id="it-end-time" value="${esc(i.end_time)}"></div>
      </div>
      <div class="field" id="it-loc-wrap" ${fl ? 'hidden' : ''}><label id="it-loc-l">${locLabel(i.category)}${i.address ? ' · ' + esc(i.address.split(',').slice(0, 2).join(',')) : ''}</label>
        <input id="it-loc" placeholder="${i.address ? 'Paste a Google Maps link to change it' : 'Paste a Google Maps link'}" autocomplete="off"></div>
      <div class="field"><label>Confirmation #</label><input id="it-conf" value="${esc(i.confirmation)}" autocomplete="off"></div>
    </div>
    <div id="it-when-plain" ${kind === 'fixed' || parent ? 'hidden' : ''}>
      <div class="field"><label>Day</label><select id="it-pday">${dayOptions(t, i.day)}</select></div>
    </div>
    ${showStops ? `<h4>Stops</h4>
      <div id="it-stops">${kids.map((s, k) => `<div class="stoprow"><span class="num" style="--c:var(--tour)">${k + 1}</span><div class="body"><div class="title">${esc(s.title)}</div><div class="meta">${esc(placeLine(s))}</div></div>
        <div class="moves"><button data-smove="up" data-id="${esc(s.id)}" ${k === 0 ? 'disabled' : ''}>↑</button><button data-smove="down" data-id="${esc(s.id)}" ${k === kids.length - 1 ? 'disabled' : ''}>↓</button><button data-sremove="${esc(s.id)}" title="Remove from tour">✕</button></div></div>`).join('') || '<div class="hint" style="margin:0 2px 8px">No stops yet.</div>'}</div>
      <div class="field" style="margin-top:10px"><textarea id="it-newstops" placeholder="Paste Google Maps links for stops — one per line"></textarea></div>
      <button class="btn ghost" id="it-addstops" style="margin-bottom:14px">Add stops</button>` : ''}
    <div class="field"><label>Notes</label><textarea id="it-notes" placeholder="Why it’s on the list, who recommended it, what to order…">${esc(i.notes)}</textarea></div>
    ${sugFor ? `<div class="btnrow"><button class="btn danger" id="it-dismiss">Dismiss</button><button class="btn" id="it-keep">Keep</button></div>`
      : `<div class="btnrow"><button class="btn danger" id="it-del">Delete</button><button class="btn" id="it-save">Save</button></div>`}
  `, sh => {
    let prio = i.priority || '';
    $$('#it-kind button', sh).forEach(b => b.onclick = () => {
      kind = b.dataset.k;
      $$('#it-kind button', sh).forEach(x => x.classList.toggle('on', x === b));
      $('#it-when-fixed', sh).hidden = kind !== 'fixed';
      $('#it-when-plain', sh).hidden = kind === 'fixed' || !!parent;
      $('#it-prio-wrap', sh).hidden = kind === 'fixed';
    });
    $$('#it-prio button', sh).forEach(b => b.onclick = () => { prio = b.dataset.p; $$('#it-prio button', sh).forEach(x => x.classList.toggle('on', x === b)); });
    $('#it-cat', sh).oninput = () => {
      const c = $('#it-cat', sh).value.trim();
      $('#it-air', sh).hidden = !/^flight$/i.test(c);
      $('#it-loc-wrap', sh).hidden = /^flight$/i.test(c);
      $('#it-loc-l', sh).textContent = locLabel(c);
    };
    const pl = $('#it-parent', sh); if (pl) pl.onclick = e => { e.preventDefault(); openItem(parent.id); };
    $('#it-day', sh).onchange = () => { const e = $('#it-end-day', sh); if (e.value && e.value < $('#it-day', sh).value) e.value = $('#it-day', sh).value; };
    const collect = () => {
      const fixed = kind === 'fixed';
      const patch = {
        title: $('#it-title', sh).value.trim() || i.title, kind,
        trip_id: parent ? i.trip_id : $('#it-trip', sh).value, category: $('#it-cat', sh).value.trim(),
        notes: $('#it-notes', sh).value,
      };
      if (fixed) {
        patch.day = $('#it-day', sh).value; patch.start_time = $('#it-time', sh).value;
        patch.end_day = $('#it-end-day', sh).value === patch.day ? '' : $('#it-end-day', sh).value;
        patch.end_time = $('#it-end-time', sh).value; patch.confirmation = $('#it-conf', sh).value.trim();
        const link = $('#it-loc', sh).value.trim();
        if (link) { patch._link = link; patch._pending = true; }
        if (!$('#it-air', sh).hidden) {
          patch.from_code = $('#it-from', sh).value.trim().toUpperCase(); patch.to_code = $('#it-to', sh).value.trim().toUpperCase();
          if (patch.from_code !== (i.from_code || '')) { patch.from_lat = ''; patch.from_lng = ''; }
          if (patch.to_code !== (i.to_code || '')) { patch.to_lat = ''; patch.to_lng = ''; }
        }
      } else {
        patch.priority = prio;
        if (!parent) {
          const nd = $('#it-pday', sh).value;
          if (nd !== i.day) { patch.day = nd; patch.seq = nd ? String(plannedStops(i.trip_id, nd).length) : ''; }
        }
      }
      if (patch.trip_id !== i.trip_id && !fixed) patch.day = '';
      return patch;
    };
    const save = $('#it-save', sh);
    if (save) save.onclick = () => {
      const patch = collect();
      queue('updateItem', { id: i.id, patch }, () => {
        Object.assign(i, patch);
        // stops follow their tour's day
        if (patch.day !== undefined && i.kind === 'fixed') childrenOf(i.id).forEach(c => { if (c.day !== patch.day) { c.day = patch.day; queue('updateItem', { id: c.id, patch: { day: patch.day } }); } });
        // an idea's suggestions follow it to another trip
        suggestionsOf(i.id).forEach(c => { if ((c.trip_id || '') !== (i.trip_id || '')) { c.trip_id = i.trip_id; queue('updateItem', { id: c.id, patch: { trip_id: i.trip_id } }); } });
      });
      closeSheet();
    };
    const del = $('#it-del', sh);
    if (del) del.onclick = () => {
      closeSheet();
      const gone = suggestionsOf(i.id).filter(isSuggestion).map(s => s.id); // an idea takes its suggestions with it
      undoable('Deleted ' + i.title + (gone.length ? ` and ${gone.length} suggestion${gone.length === 1 ? '' : 's'}` : ''), () => {
        db.items.forEach(c => { if (c.parent_id === i.id) c.parent_id = ''; });
        db.items = db.items.filter(x => x.id !== i.id && !gone.includes(x.id));
      }, () => { gone.forEach(id => queue('deleteItem', { id })); queue('deleteItem', { id: i.id }); });
    };
    // Ask Claude toggle — saved right away
    const askBtn = $('#it-ask', sh);
    if (askBtn) askBtn.onclick = () => {
      const on = !askBtn.classList.contains('on');
      const status = on ? 'ask' : restStatus;
      askBtn.classList.toggle('on', on); askBtn.setAttribute('aria-checked', on);
      $('#it-ask-s', sh).textContent = askText(status);
      queue('updateItem', { id: i.id, patch: { status } }, () => { i.status = status; });
      if (on) toast('Say “check my asks” to Claude when you’re ready');
    };
    // Suggestions inside an idea: keep / dismiss in place
    bindSuggestionButtons(sh, b => {
      const li = b.closest('li'); if (li) li.remove();
      const box = $('#it-sugs', sh);
      if (box && !$('li', box)) box.innerHTML = '<div class="hint" style="margin:0 2px 8px">All sorted.</div>';
    });
    $$('#it-sugs [data-item]', sh).forEach(el => el.onclick = e => { if (e.target.closest('[data-keep], [data-dismiss]')) return; openItem(el.dataset.item); });
    // A suggestion's own sheet
    const keep = $('#it-keep', sh);
    if (keep) keep.onclick = () => {
      const patch = collect();
      delete patch.trip_id; delete patch.kind;
      patch.parent_id = '';
      queue('updateItem', { id: i.id, patch }, () => Object.assign(i, patch));
      closeSheet(); toast('Kept ' + (patch.title || i.title));
    };
    const dis = $('#it-dismiss', sh);
    if (dis) dis.onclick = () => { closeSheet(); dismissSuggestion(i.id); };
    const rf = $('#it-refresh', sh);
    if (rf) rf.onclick = e => { e.preventDefault(); i._pending = true; queue('refreshItem', { id: i.id }); closeSheet(); toast('Refreshing from Google…'); };
    $$('[data-smove]', sh).forEach(b => b.onclick = () => { moveIn('tour:' + i.id, b.dataset.id, b.dataset.smove); openItem(i.id); });
    $$('[data-sremove]', sh).forEach(b => b.onclick = () => {
      const c = itemById(b.dataset.sremove); if (!c) return;
      queue('updateItem', { id: c.id, patch: { parent_id: '' } }, () => { c.parent_id = ''; });
      openItem(i.id);
    });
    const as = $('#it-addstops', sh);
    if (as) as.onclick = () => {
      const lines = $('#it-newstops', sh).value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      // keep any text typed into the main fields
      Object.assign(i, collect());
      let n = childrenOf(i.id).length;
      lines.forEach(line => {
        const payload = { id: uid('it'), text: line, kind: 'place', trip: i.trip_id || 'someday', parent_id: i.id, seq: n, day: i.day || undefined };
        const local = { id: payload.id, trip_id: i.trip_id, kind: 'place', parent_id: i.id, seq: String(n), day: i.day || '', title: isUrl(line) ? linkTitle(line) : line, status: 'open', _pending: isMapsUrl(line) };
        n++;
        queue('add', payload, () => db.items.push(local));
      });
      if (!/^tour$/i.test(i.category || '')) queue('updateItem', { id: i.id, patch: { category: 'Tour' } }, () => { i.category = 'Tour'; });
      openItem(i.id);
      toast(`Adding ${lines.length} stop${lines.length === 1 ? '' : 's'}…`);
    };
  });
}

/* ---------- Add places to a day ---------- */
function openAddToDay(tripId, d) {
  const t = tripById(tripId); if (!t) return;
  const dow = parseDate(d).getDay();
  const base = stayForNight(tripId, d) || stayForMorning(tripId, d);
  const cands = topItemsFor(tripId).filter(i => i.kind !== 'fixed' && !i.day).map(i => ({
    i, open: openOn(i, dow), dist: base && hasCoords(base) && hasCoords(i) ? meters(base, i) : null,
  })).sort((a, b) => (a.open === false) - (b.open === false) || prioRank(a.i) - prioRank(b.i) || (a.dist ?? 1e9) - (b.dist ?? 1e9) || a.i.title.localeCompare(b.i.title));
  openSheet(`
    <h3>Plan ${esc(fmtDay(d))}</h3>
    ${cands.length ? `<p class="hint" style="margin:-6px 2px 10px">${base && hasCoords(base) ? 'Closest to ' + esc(base.title) + ' first.' : 'Your saved places without a day.'}</p>
    <div>${cands.map(c => `<label class="check"><input type="checkbox" value="${esc(c.i.id)}"><span>${prioBadge(c.i)}${esc(c.i.title)}<small>${[esc(placeLine(c.i)), c.dist != null ? fmtDist(c.dist) + ' away' : '', c.open === false ? `<span class="warn">Closed ${DOW[dow]}</span>` : esc(hoursOn(c.i, dow))].filter(Boolean).join(' · ')}</small></span></label>`).join('')}</div>
    <div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="ad-cancel">Cancel</button><button class="btn" id="ad-go">Add to day</button></div>`
    : `<div class="empty">Every saved place already has a day. Tap + to save more.</div>`}
  `, sh => {
    const c = $('#ad-cancel', sh); if (c) c.onclick = () => closeSheet();
    const g = $('#ad-go', sh);
    if (g) g.onclick = () => {
      const ids = $$('input:checked', sh).map(x => x.value);
      let n = plannedStops(tripId, d).length;
      ids.forEach(id => {
        const it = itemById(id), seq = String(n++);
        queue('updateItem', { id, patch: { day: d, seq } }, () => { it.day = d; it.seq = seq; });
      });
      closeSheet();
      if (ids.length) toast(`Added ${ids.length} to ${fmtDay(d, false)}`);
    };
  });
}

/* ---------- Travelogue: I'm here ---------- */
function openHere(tripId, d) {
  const t = tripById(tripId); if (!t) return;
  const now = tzNow(t.timezone);
  const isToday = d === now.day;
  const logged = new Set(db.log.filter(l => l.trip_id === tripId).map(l => l.item_id).filter(Boolean));
  const dayPlan = plannedStops(tripId, d).concat(fixedEvents(tripId, d).filter(e => e.start).map(e => e.i)).filter(i => !logged.has(i.id));
  const others = topItemsFor(tripId).filter(i => i.kind !== 'fixed' && !logged.has(i.id) && i.day !== d);
  const tours = topLogs(tripId, d).filter(l => { const it = l.item_id && itemById(l.item_id); return it && isTour(it); });
  const prev = topLogs(tripId, d).slice(-1)[0];
  let picked = null, pos = null, near = null, nearList = [];

  const pickRow = i => `<div class="pick" data-pick="${esc(i.id)}"><span class="num ${i.kind === 'idea' ? 'hollow' : ''}" style="--c:${i.kind === 'fixed' ? 'var(--fixed)' : 'var(--place)'}">•</span><div class="body"><div class="title">${esc(i.title)}</div><div class="meta" data-dist="${esc(i.id)}">${esc(placeLine(i))}</div></div></div>`;
  openSheet(`
    <h3>${isToday ? 'Where are you?' : 'Add a stop · ' + esc(fmtDay(d, false))}</h3>
    ${dayPlan.length ? `<h4 style="margin-top:0">From the plan</h4><div id="h-plan">${dayPlan.map(pickRow).join('')}</div>` : ''}
    ${others.length ? `<details style="margin:6px 0 12px"><summary style="font-size:14px;color:var(--muted);cursor:pointer;padding:6px 2px">Other saved places (${others.length})</summary><div id="h-others" style="margin-top:8px">${others.map(pickRow).join('')}</div></details>` : ''}
    ${navigator.geolocation && isToday ? `<div class="hint here-status" id="h-where">Finding you…</div><div id="h-around"></div>` : ''}
    <h4>${dayPlan.length || others.length ? 'Or somewhere new' : 'Somewhere'}</h4>
    <div class="field"><textarea id="h-text" placeholder="Paste a Google Maps link, or type a name"></textarea></div>
    <div class="two">
      <div class="field"><label>Time (optional)</label><div class="inline"><input type="time" id="h-time"><button class="btn ghost small" id="h-now">Now</button></div></div>
      <div class="field"><label>Got here by</label><select id="h-mode">${MODES.map(([k, l]) => `<option value="${k}" ${k === (prev && prev.mode) ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    ${tours.length ? `<div class="field"><label>Part of</label><select id="h-parent"><option value="">— (on my own)</option>${tours.map(l => `<option value="${esc(l.id)}">${esc(l.title)}</option>`).join('')}</select></div>` : ''}
    <div class="field"><label>Note</label><input id="h-note" placeholder="What it was like, what you ordered…"></div>
    <button class="btn" id="h-save">Log it</button>
  `, sh => {
    const ta = $('#h-text', sh);
    const bindPicks = () => $$('[data-pick]', sh).forEach(el => el.onclick = () => {
      const on = !el.classList.contains('on');
      $$('[data-pick]', sh).forEach(x => x.classList.remove('on'));
      if (on) { el.classList.add('on'); picked = el.dataset.pick; ta.value = ''; } else picked = null;
    });
    bindPicks();
    ta.oninput = () => { if (ta.value.trim()) { picked = null; $$('[data-pick]', sh).forEach(x => x.classList.remove('on')); } };
    $('#h-now', sh).onclick = () => { $('#h-time', sh).value = tzNow(t.timezone).time; };
    // Where am I? Ask once, then sort the list, preselect what you're standing at, and show what's around you.
    const clearPicks = () => { picked = null; near = null; $$('[data-pick], [data-near]', sh).forEach(x => x.classList.remove('on')); };
    const where = $('#h-where', sh);
    const showAround = list => {
      nearList = (list || []).filter(n => !dayPlan.concat(others).some(i => i.place_id && i.place_id === n.place_id)).slice(0, 5);
      const box = $('#h-around', sh); if (!box || !nearList.length) return;
      box.innerHTML = `<h4 style="margin-top:4px">Around you</h4>` + nearList.map((n, k) => `<div class="pick" data-near="${k}"><span class="num hollow" style="--c:var(--found)">•</span><div class="body"><div class="title">${esc(n.title)}</div><div class="meta">${esc([n.category, n.dist != null ? fmtDist(n.dist) + ' away' : ''].filter(Boolean).join(' · '))}</div></div></div>`).join('');
      $$('[data-near]', box).forEach(el => el.onclick = () => {
        const on = !el.classList.contains('on'); clearPicks();
        if (on) { el.classList.add('on'); near = nearList[+el.dataset.near]; ta.value = ''; }
      });
    };
    if (where) navigator.geolocation.getCurrentPosition(p => {
      pos = { lat: p.coords.latitude, lng: p.coords.longitude };
      let best = null;
      ['#h-plan', '#h-others'].forEach(sel => {
        const box = $(sel, sh); if (!box) return;
        const rows = $$('[data-pick]', box).map(el => ({ el, it: itemById(el.dataset.pick) }));
        rows.forEach(r => { r.d = hasCoords(r.it) ? meters(pos, r.it) : 1e9; const m = $('[data-dist]', r.el); if (m && r.d < 1e9) m.textContent = [placeLine(r.it), fmtDist(r.d) + ' away'].filter(Boolean).join(' · '); });
        rows.sort((a, b) => a.d - b.d).forEach(r => box.appendChild(r.el));
        const limit = sel === '#h-plan' ? 150 : 75;   // a planned stop can be a bit further off than a saved one
        if (rows[0] && rows[0].d < limit && (!best || rows[0].d < best.d)) best = { ...rows[0], sel };
      });
      if (best && !picked && !near && !ta.value.trim()) {
        if (best.sel === '#h-others') { const det = $('details', sh); if (det) det.open = true; }
        best.el.click();
        where.textContent = `You’re at ${best.it.title}, by the look of it.`;
      } else where.textContent = 'Sorted by distance from you.';
      if (navigator.onLine && (db.places || (cfg && cfg.demo))) {
        api('nearby', { lat: pos.lat, lng: pos.lng }).then(list => { if (document.body.contains(sh)) showAround(list); }).catch(() => {});
      }
    }, () => { where.textContent = 'Location is off, so the list isn’t sorted by distance.'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
    $$('[data-pick]', sh).forEach(el => el.addEventListener('click', () => { near = null; $$('[data-near]', sh).forEach(x => x.classList.remove('on')); }));
    ta.addEventListener('input', () => { if (ta.value.trim()) clearPicks(); });
    $('#h-save', sh).onclick = () => {
      const text = ta.value.trim();
      if (!picked && !near && !text) { ta.focus(); return; }
      const parentSel = $('#h-parent', sh);
      const parent_id = parentSel ? parentSel.value : '';
      const it = picked ? itemById(picked) : null;
      const seq = parent_id ? logKids(parent_id).length : topLogs(tripId, d).length;
      const mode = $('#h-mode', sh).value;
      // Logged on the spot? Then the time is real: fill it in unless you typed one.
      let time = $('#h-time', sh).value;
      const spot = it && hasCoords(it) ? it : near ? near : (!it && !isMapsUrl(text) ? pos : null);
      if (!time && isToday && pos && spot && meters(pos, spot) < 300) time = tzNow(t.timezone).time;
      const payload = { id: uid('lg'), trip: tripId, day: d, seq, time, mode: seq || parent_id ? mode : '',
        parent_id, note: $('#h-note', sh).value.trim(), timezone: t.timezone || '', item_id: it ? it.id : undefined, text: it || near ? undefined : text,
        logged_at: new Date().toISOString() };
      const local = { id: payload.id, trip_id: tripId, day: d, seq: String(seq), time: payload.time, mode: payload.mode, parent_id, note: payload.note,
        item_id: it ? it.id : '', title: it ? it.title : near ? near.title : (isUrl(text) ? linkTitle(text) : text), origin: it ? 'planned' : (isMapsUrl(text) ? '' : 'found'),
        lat: it ? it.lat : near ? near.lat : (pos && !isMapsUrl(text) ? pos.lat : ''), lng: it ? it.lng : near ? near.lng : (pos && !isMapsUrl(text) ? pos.lng : ''),
        city: it ? it.city : near ? near.city : '', place_id: near ? near.place_id : '', logged_at: payload.logged_at, _pending: !it && !near && isMapsUrl(text) };
      if (near) { Object.assign(payload, { place_id: near.place_id, title: near.title, lat: near.lat, lng: near.lng, address: near.address, city: near.city, maps_url: near.maps_url, category: near.category || '' }); local.category = near.category || ''; }
      // a typed name (no link) at your current spot keeps your location
      else if (!it && !isMapsUrl(text) && pos) { payload.title = text; payload.lat = pos.lat; payload.lng = pos.lng; }
      queue('addLog', payload, () => { db.log.push(local); if (it) it.status = 'done'; });
      // logging a planned tour also logs its stops (delete any you skipped)
      if (it && isTour(it)) {
        childrenOf(it.id).forEach((c, k) => {
          const p2 = { id: uid('lg'), trip: tripId, day: d, seq: k, parent_id: payload.id, mode: 'tour', item_id: c.id, timezone: t.timezone || '' };
          queue('addLog', p2, () => { db.log.push({ id: p2.id, trip_id: tripId, day: d, seq: String(k), parent_id: payload.id, mode: 'tour', item_id: c.id, title: c.title, origin: 'planned', lat: c.lat, lng: c.lng }); c.status = 'done'; });
        });
      }
      closeSheet();
      toast('Logged ' + local.title);
    };
  });
}

/* ---------- Travelogue: one entry ---------- */
function openLogEntry(id) {
  const l = db.log.find(x => x.id === id); if (!l) return;
  const t = tripById(l.trip_id);
  const item = l.item_id ? itemById(l.item_id) : null;
  openSheet(`
    <div class="field"><input id="lg-title" value="${esc(l.title)}" style="font-family:var(--serif);font-size:20px;font-weight:600;border:0;background:none;padding:4px 2px"></div>
    <div class="hint" style="margin-top:-8px">${l.origin === 'found' ? '<span class="badge found">Found</span>Not in your plan — discovered on the ground.' : l.origin === 'planned' ? `<span class="badge planned">Planned</span>${item ? 'From your plan: ' + esc(item.title) : 'Matched your plan.'}` : 'Matching to your plan…'}</div>
    ${l.address || l.maps_url ? `<div class="info">${esc(l.address || '')}${l.maps_url ? `<div class="links"><a href="${esc(l.maps_url)}" target="_blank" rel="noopener">Open in Maps</a></div>` : ''}</div>` : ''}
    <div class="two">
      <div class="field"><label>Day</label><select id="lg-day">${dayOptions(t, l.day, '—')}</select></div>
      <div class="field"><label>Time</label><input type="time" id="lg-time" value="${esc(l.time)}"></div>
    </div>
    <div class="field"><label>Got here by</label><select id="lg-mode"><option value="">—</option>${MODES.map(([k, n]) => `<option value="${k}" ${k === l.mode ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Note</label><textarea id="lg-note">${esc(l.note)}</textarea></div>
    <div class="field" style="margin-bottom:6px"><label>How was it?</label></div>
    <div class="seg" id="lg-rate">${RATINGS.map(([k, n]) => `<button data-r="${k}" class="${ratingOf(l) === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="btnrow"><button class="btn danger" id="lg-del">Delete</button><button class="btn" id="lg-save">Save</button></div>
  `, sh => {
    let rating = ratingOf(l);
    $$('#lg-rate button', sh).forEach(b => b.onclick = () => {
      rating = rating === b.dataset.r ? '' : b.dataset.r;
      $$('#lg-rate button', sh).forEach(x => x.classList.toggle('on', x.dataset.r === rating));
    });
    $('#lg-save', sh).onclick = () => {
      const patch = { title: $('#lg-title', sh).value.trim() || l.title, day: $('#lg-day', sh).value || l.day, time: $('#lg-time', sh).value,
        mode: $('#lg-mode', sh).value, note: $('#lg-note', sh).value, rating, would_return: '' };
      if (patch.day !== l.day && !l.parent_id) patch.seq = String(topLogs(l.trip_id, patch.day).length);
      queue('updateLog', { id: l.id, patch }, () => {
        Object.assign(l, patch);
        if (patch.day !== undefined) logKids(l.id).forEach(k => { if (k.day !== patch.day) queue('updateLog', { id: k.id, patch: { day: patch.day } }, () => { k.day = patch.day; }); });
      });
      closeSheet();
    };
    $('#lg-del', sh).onclick = () => {
      const kids = logKids(l.id);
      closeSheet();
      undoable('Removed ' + l.title, () => {
        const gone = new Set([l.id, ...kids.map(k => k.id)]);
        db.log = db.log.filter(x => !gone.has(x.id));
        [l, ...kids].forEach(x => { if (x.item_id && !db.log.some(y => y.item_id === x.item_id)) { const it = itemById(x.item_id); if (it) it.status = 'open'; } });
      }, () => { kids.forEach(k => queue('deleteLog', { id: k.id })); queue('deleteLog', { id: l.id }); });
    };
  });
}

function openMode(logId) {
  const l = db.log.find(x => x.id === logId); if (!l) return;
  openSheet(`<h3>How did you get to ${esc(l.title)}?</h3>
    ${MODES.map(([k, n]) => `<button class="btn ${k === l.mode ? '' : 'ghost'}" data-m="${k}" style="margin-bottom:8px">${n}</button>`).join('')}`, sh => {
    $$('[data-m]', sh).forEach(b => b.onclick = () => {
      queue('updateLog', { id: l.id, patch: { mode: b.dataset.m } }, () => { l.mode = b.dataset.m; });
      closeSheet();
    });

}

/* ---------- Travelogue: end-of-day review ---------- */
function openReview(tripId, d) {
  const t = tripById(tripId); if (!t) return;
  const left = plannedStops(tripId, d).filter(s => s.status !== 'done' && s.status !== 'skipped');
  openSheet(`
    <h3>${esc(fmtDay(d))} — how did it go?</h3>
    ${left.length ? `<p class="hint" style="margin:-6px 2px 6px">Went adds it to the log in plan order. Skip sends it back to your saved places.</p>
      <div>${left.map(s => `<div class="review-row" data-row="${esc(s.id)}"><div class="body"><div class="title">${esc(s.title)}</div><div class="meta">${esc(placeLine(s))}</div></div>
        <button class="btn small" data-went="${esc(s.id)}">Went</button><button class="btn ghost small" data-skip="${esc(s.id)}">Skip</button>
        <select data-movetoday="${esc(s.id)}" style="width:86px;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px">${dayOptions(t, '', 'Move…').replace(`<option value="${d}"`, `<option disabled value="${d}"`)}</select></div>`).join('')}</div>`
      : `<div class="empty"><div class="big">All accounted for</div>Everything planned for this day is logged or moved.</div>`}
    <div class="btnrow" style="margin-top:14px"><button class="btn ghost" id="rv-done">Done</button><button class="btn" id="rv-more">Add somewhere I found</button></div>
  `, sh => {
    const gone = id => { const r = $(`[data-row="${CSS.escape(id)}"]`, sh); if (r) r.remove(); };
    $$('[data-went]', sh).forEach(b => b.onclick = () => {
      const it = itemById(b.dataset.went);
      const payload = { id: uid('lg'), trip: tripId, day: d, seq: topLogs(tripId, d).length, item_id: it.id, timezone: t.timezone || '' };
      queue('addLog', payload, () => { db.log.push({ id: payload.id, trip_id: tripId, day: d, seq: String(payload.seq), item_id: it.id, title: it.title, origin: 'planned', lat: it.lat, lng: it.lng, city: it.city }); it.status = 'done'; });
      gone(it.id);
    });
    $$('[data-skip]', sh).forEach(b => b.onclick = () => {
      const it = itemById(b.dataset.skip);
      queue('updateItem', { id: it.id, patch: { day: '', seq: '', status: 'open' } }, () => { it.day = ''; it.seq = ''; });
      gone(it.id);
    });
    $$('[data-movetoday]', sh).forEach(s => s.onchange = () => {
      const it = itemById(s.dataset.movetoday), nd = s.value;
      const seq = nd ? String(plannedStops(tripId, nd).length) : '';
      queue('updateItem', { id: it.id, patch: { day: nd, seq } }, () => { it.day = nd; it.seq = seq; });
      gone(it.id);
    });
    $('#rv-done', sh).onclick = () => closeSheet();
    $('#rv-more', sh).onclick = () => openHere(tripId, d);
  });
}

/* ---------- Trip form ---------- */
function openTripForm(id) {
  const t = id ? tripById(id) : null;
  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch (e) {}
  openSheet(`
    <h3>${t ? 'Edit trip' : 'New trip'}</h3>
    <div class="field"><label>Name</label><input id="tr-name" value="${esc(t ? t.name : '')}" placeholder="Japan, spring"></div>
    <div class="field"><label>Destination</label><input id="tr-dest" value="${esc(t ? t.destination : '')}" placeholder="Tokyo, Kyoto, Japan"></div>
    <div class="two">
      <div class="field"><label>Start</label><input type="date" id="tr-start" value="${esc(t ? t.start : '')}"></div>
      <div class="field"><label>End</label><input type="date" id="tr-end" value="${esc(t ? t.end : '')}"></div>
    </div>
    <div class="field"><label>Local time zone</label><input id="tr-tz" list="zones" value="${esc(t ? t.timezone : '')}" placeholder="Asia/Tokyo" autocomplete="off"><datalist id="zones">${zones.map(z => `<option value="${esc(z)}">`).join('')}</datalist></div>
    <div class="field"><label>Notes</label><textarea id="tr-notes">${esc(t ? t.notes : '')}</textarea></div>

    ${t ? `<p class="hint" style="margin-top:12px">Deleting a trip sends its places back to Someday.</p>` : ''}
  `, sh => {
    $('#tr-save', sh).onclick = () => {
      const data = {
        name: $('#tr-name', sh).value.trim(), destination: $('#tr-dest', sh).value.trim(),
        start: $('#tr-start', sh).value, end: $('#tr-end', sh).value,
        timezone: $('#tr-tz', sh).value.trim(), notes: $('#tr-notes', sh).value,
      };
      if (!data.name) { $('#tr-name', sh).focus(); return; }
      if (data.start && data.end && data.end < data.start) { toast('End date is before the start'); return; }
      if (t) {
        queue('updateTrip', { id: t.id, patch: data }, () => Object.assign(t, data));
        closeSheet();
      } else {
        const trip = { id: uid('tr'), ...data };
        queue('addTrip', { trip }, () => db.trips.push(trip));
        closeSheet();
        location.hash = '#/trip/' + encodeURIComponent(trip.id);
        if (somedayMatches(trip).length) setTimeout(() => openPull(trip.id), 350);
      }
    };
    const del = $('#tr-del', sh);
    if (del) del.onclick = () => {
      const typed = prompt('To delete this trip, type its name: ' + t.name + '\n\nIts places go back to Someday.');
      if (typed === null) return;
      if (typed.trim().toLowerCase() !== t.name.trim().toLowerCase()) { toast('Name didn’t match — trip kept'); return; }
      closeSheet(); location.hash = '#/';
      undoable('Deleted ' + t.name, () => {
        db.items.forEach(i => { if (i.trip_id === t.id) { i.trip_id = ''; i.day = ''; } });
        db.trips = db.trips.filter(x => x.id !== t.id);
      }, () => queue('deleteTrip', { id: t.id }));
    };
  });
}

/* ---------- Pull from Someday ---------- */
function openPull(tripId) {
  const t = tripById(tripId); if (!t) return;
  const m = somedayMatches(t);
  if (!m.length) return;
  openSheet(`
    <h3>Bring these into ${esc(t.name)}?</h3>
    <p class="hint" style="margin:-6px 2px 10px">Saved to Someday in ${esc(t.destination || t.name)}.</p>
    <div>${m.map(i => `<label class="check"><input type="checkbox" value="${esc(i.id)}" checked><span>${esc(i.title)}<small>${esc(placeLine(i))}</small></span></label>`).join('')}</div>
    <div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="pl-skip">Not now</button><button class="btn" id="pl-go">Add selected</button></div>
  `, sh => {
    $('#pl-skip', sh).onclick = () => closeSheet();
    $('#pl-go', sh).onclick = () => {
      const picked = $$('input:checked', sh).map(x => x.value);
      // An idea's suggestions move with it
      const ids = [...picked, ...picked.flatMap(id => suggestionsOf(id).map(s => s.id))];
      if (ids.length) queue('attach', { ids, trip_id: t.id }, () => db.items.forEach(i => { if (ids.includes(i.id)) i.trip_id = t.id; }));
      closeSheet();
      if (picked.length) toast(`Added ${picked.length} to ${t.name}`);
    };
  });
}

function demoApi(action, p) {
  return new Promise(resolve => setTimeout(() => {
    if (action === 'add') {
      const text = p.text || '';
      const it = itemById(p.id) || {};
      let title = p.title || it.title;
      if (isMapsUrl(text)) {
        const m = text.match(/\/maps\/place\/([^\/@?]+)/);
        title = p.title || (m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : linkTitle(text));
      }
      const c = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      resolve({ ...it, title, _pending: false, category: it.category || (isMapsUrl(text) ? 'Place' : ''), maps_url: isMapsUrl(text) ? text.match(/https?:\/\/\S+/)[0] : '', lat: c ? c[1] : it.lat, lng: c ? c[2] : it.lng });
    } else if (action === 'addLog') {
      const l = db.log.find(x => x.id === p.id) || {};
      const item = p.item_id && itemById(p.item_id);
      resolve({ ...l, _pending: false, origin: item ? 'planned' : 'found', title: l.title || (p.text && isMapsUrl(p.text) ? 'Somewhere (sample)' : p.text) });
    } else if (action === 'updateItem') { const it = itemById(p.id); if (it) { delete it._pending; delete it._link; } resolve(it); }
    else if (action === 'updateLog') resolve(db.log.find(x => x.id === p.id));
    else if (action === 'addTrip') resolve(p.trip);
    else if (action === 'updateTrip') resolve(tripById(p.id));
    else if (action === 'attach') resolve(db.items.filter(i => p.ids.includes(i.id)));
    else if (action === 'routes') resolve(p.legs.map(() => null));
    else if (action === 'nearby') resolve([['A tiny jazz kissa', 'Jazz club', 18], ['Corner bakery (sample)', 'Bakery', 41], ['Sentō bathhouse (sample)', 'Public bath', 77]]
      .map(([title, category, dist], k) => ({ place_id: 'demo_near_' + k, title, category, dist, lat: +p.lat + dist / 111320, lng: +p.lng, address: '', city: 'Tokyo', maps_url: '' })));
    else resolve(null);
  }, 250));
}

lastRoute = (r => r.name + (r.id || ''))(route());
