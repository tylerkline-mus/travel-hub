<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Hub</title>
<meta name="theme-color" content="#f4efe5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel Hub">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4efe5;
  --card: #fffdf8;
  --ink: #1f1b16;
  --muted: #7a7064;
  --line: #e4dccd;
  --accent: #b9532c;
  --accent-ink: #ffffff;
  --fixed: #2f4b6e;
  --place: #b9532c;
  --idea: #66773a;
  --found: #8a5a9e;
  --shadow: 0 1px 2px rgba(40,30,15,.06), 0 4px 14px rgba(40,30,15,.06);
  --radius: 14px;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171513; --card: #221f1b; --ink: #f1ebe0; --muted: #a39887; --line: #35302a;
    --accent: #e0774b; --fixed: #8fb0d8; --place: #e0774b; --idea: #a9bd72; --found: #c49ad6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; }
body { min-height: 100vh; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
  display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idea); }
.dot.pending { background: #d8a136; } .dot.offline { background: var(--muted); }

main { padding: 6px 16px 24px; max-width: 720px; margin: 0 auto; }
.section-title { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--muted);
  margin: 22px 2px 10px; display: flex; align-items: baseline; gap: 8px; }
.section-title .count { font-family: var(--sans); font-size: 12px; font-weight: 500; }

/* ---------- trip cards ---------- */
.trip-card { position: relative; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 18px 16px 22px; margin-bottom: 12px; cursor: pointer; overflow: hidden; border: 1px solid var(--line); }
.trip-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--hue); }
.trip-card h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0 0 2px; letter-spacing: -.01em; }
.trip-card .dest { color: var(--muted); font-size: 14px; }
.trip-card .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; flex-wrap: wrap; }
.dates { font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 4px 9px;
  border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); white-space: nowrap; }
.chip.now { background: var(--accent); color: var(--accent-ink); }
.tally { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.tally span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--c); }

/* ---------- trip header ---------- */
.trip-head { padding: 6px 2px 4px; }
.trip-head .dest { color: var(--muted); font-size: 14px; margin-top: 2px; }
.trip-head .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.banner { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius: var(--radius); padding: 12px 14px; margin-top: 14px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
.banner b { font-weight: 600; }
.banner button { margin-left: auto; }

.filters { display: flex; gap: 6px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- item cards ---------- */
.item { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.item .mark { width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-top: 6px; flex: none; }
.item.kind-idea .mark { border-radius: 50%; background: transparent; border: 2px solid var(--c); }
.item .body { flex: 1; min-width: 0; }
.item .title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.item .meta { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .when { font-size: 12px; font-weight: 600; color: var(--c); text-align: right; flex: none; margin-top: 2px; white-space: nowrap; }
.item.done .title { text-decoration: line-through; text-decoration-color: var(--muted); }
.item.pending { opacity: .6; }
.daylabel { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 2px 6px; }

.empty { text-align: center; color: var(--muted); padding: 36px 20px; font-size: 14px; line-height: 1.5; }
.empty .big { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-bottom: 6px; }

/* ---------- bottom nav ---------- */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: space-around; align-items: center;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11px; color: var(--muted); padding: 6px 18px; cursor: pointer; }
nav.tabs button.on { color: var(--ink); }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs .add { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); padding: 0;
  justify-content: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); margin-top: -22px; }
nav.tabs .add svg { width: 26px; height: 26px; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20,15,10,.38); z-index: 20; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--paper); border-radius: 20px 20px 0 0;
  max-height: 92vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 720px; margin: 0 auto; }
.sheet.open { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0 0 14px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 2px 6px; letter-spacing: .02em; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 11px 12px; font-size: 16px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 64px; }
.capture-box { min-height: 96px !important; font-size: 17px !important; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 13px; color: var(--muted); margin: -6px 2px 14px; min-height: 18px; }
.seg { display: flex; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 12px; padding: 13px 16px; font-size: 16px; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { background: none; color: #b33a2e; border: 1px solid color-mix(in srgb, #b33a2e 40%, var(--line)); font-weight: 500; }
.btn.small { width: auto; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btnrow { display: flex; gap: 10px; margin-top: 8px; }
.btnrow .btn { flex: 1; }
.info { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.5; }
.info .links { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.hours { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.hours li.today { color: var(--ink); font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.check small { color: var(--muted); display: block; font-size: 12px; }

/* ---------- setup ---------- */
.setup { max-width: 440px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) 22px 40px; }
.setup .logo { font-family: var(--serif); font-size: 38px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin-bottom: 10px; }
.setup p { color: var(--muted); line-height: 1.5; margin: 0 0 26px; }
.setup .or { text-align: center; color: var(--muted); font-size: 13px; margin: 16px 0; }

.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 40;
  opacity: 0; transition: all .2s; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.demo-tag { font-size: 11px; font-weight: 600; background: #d8a136; color: #2a1c05; padding: 3px 7px; border-radius: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * Travel Hub — step 1: trips, capture, Someday
 * Data lives in your Google Sheet via the Apps Script web app.
 * ============================================================ */

/* ---------- storage (safe) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

let cfg = store.get('th_cfg', null);          // { url, token, sheetUrl, demo }
let db = store.get('th_cache', { trips: [], items: [], plan: [], log: [], places: false });
let outbox = store.get('th_outbox', []);
let syncState = 'ok';                          // ok | pending | offline
let ui = { filter: 'all' };

const KIND = { fixed: 'Fixed', place: 'Place', idea: 'Idea' };
const KIND_COLOR = { fixed: 'var(--fixed)', place: 'var(--place)', idea: 'var(--idea)' };
const FIXED_CATS = ['Flight', 'Stay', 'Tour', 'Tickets', 'Reservation', 'Transit', 'Other'];

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const isUrl = s => /https?:\/\/\S+/.test(s);
const isMapsUrl = s => /(maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google\.)/i.test(s);
const parseDate = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function fmtDay(s, withDow = true) {
  const d = parseDate(s); if (!d) return '';
  return (withDow ? DOW[d.getDay()] + ', ' : '') + MON[d.getMonth()] + ' ' + d.getDate();
}
function fmtRange(a, b) {
  const s = parseDate(a), e = parseDate(b);
  if (!s && !e) return 'No dates yet';
  if (s && !e) return MON[s.getMonth()] + ' ' + s.getDate() + ', ' + s.getFullYear();
  if (!s) return 'Until ' + MON[e.getMonth()] + ' ' + e.getDate();
  if (s.getFullYear() !== e.getFullYear()) return `${MON[s.getMonth()]} ${s.getDate()}, ${s.getFullYear()} – ${MON[e.getMonth()]} ${e.getDate()}, ${e.getFullYear()}`;
  if (s.getMonth() === e.getMonth()) return `${MON[s.getMonth()]} ${s.getDate()} – ${e.getDate()}, ${s.getFullYear()}`;
  return `${MON[s.getMonth()]} ${s.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}, ${s.getFullYear()}`;
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm');
}
function tripStatus(t) {
  const now = parseDate(todayStr()), s = parseDate(t.start), e = parseDate(t.end);
  if (!s) return { label: 'Dreaming', cls: '' };
  const day = 86400000;
  if (now < s) { const n = Math.round((s - now) / day); return { label: n === 1 ? 'Tomorrow' : `In ${n} days`, cls: '' }; }
  if (!e || now <= e) { const n = Math.round((now - s) / day) + 1; const total = e ? Math.round((e - s) / day) + 1 : null;
    return { label: total ? `Day ${n} of ${total}` : `Day ${n}`, cls: 'now' }; }
  return { label: 'Past', cls: '' };
}
function hue(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 45% 48%)`; }
function tripById(id) { return db.trips.find(t => t.id === id); }
function itemsFor(tripId) { return db.items.filter(i => (i.trip_id || '') === (tripId || '')); }
function placeLine(i) { return [i.category, i.city || i.region || i.country].filter(Boolean).join(' · '); }

function somedayMatches(trip) {
  const toks = String(trip.destination || trip.name || '').toLowerCase()
    .split(/,|\/|\band\b|&/).map(s => s.trim()).filter(s => s.length > 1);
  if (!toks.length) return [];
  return db.items.filter(i => !i.trip_id && [i.city, i.region, i.country].some(f => {
    f = String(f || '').toLowerCase();
    return f && toks.some(t => f === t || f.includes(t) || t.includes(f));
  }));
}

function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- icons ---------- */
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trips: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>',
  someday: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
};

/* ============================================================
 * API + offline queue
 * ============================================================ */
async function api(action, payload = {}) {
  if (cfg && cfg.demo) return demoApi(action, payload);
  const res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ action, token: cfg.token, ...payload }) });
  const j = await res.json();
  if (!j.ok) { const err = new Error(j.error || 'Server error'); err.server = true; throw err; }
  return j.data;
}

function saveLocal() { store.set('th_cache', db); store.set('th_outbox', outbox); }

function reconcile(action, data) {
  if (!data) return;
  const swap = (list, obj) => { const i = db[list].findIndex(x => x.id === obj.id); if (i >= 0) db[list][i] = obj; else db[list].push(obj); };
  if (action === 'add' || action === 'updateItem' || action === 'refreshItem') {
    if (data._duplicate) { toast('Already saved: ' + data.title); return; }
    swap('items', data);
  } else if (action === 'attach' && Array.isArray(data)) data.forEach(o => swap('items', o));
  else if (action === 'addTrip' || action === 'updateTrip') swap('trips', data);
}

/** Apply locally right away, then send to the Sheet (queued if offline). */
function queue(action, payload, applyLocal) {
  if (applyLocal) applyLocal();
  outbox.push({ action, payload });
  saveLocal(); render(); flush();
}

let flushing = false;
async function flush() {
  if (flushing || !cfg) return;
  flushing = true;
  while (outbox.length) {
    const op = outbox[0];
    try {
      const data = await api(op.action, op.payload);
      // drop the stand-in for a duplicate add
      if (op.action === 'add' && data && data._duplicate) db.items = db.items.filter(i => i.id !== op.payload.id);
      reconcile(op.action, data);
      outbox.shift(); saveLocal();
    } catch (e) {
      if (e.server) { toast('Couldn’t save: ' + e.message); outbox.shift(); saveLocal(); }
      else { syncState = 'offline'; break; }
    }
  }
  if (!outbox.length) syncState = 'ok';
  flushing = false; render();
}

async function pull() {
  if (!cfg) return;
  await flush();
  if (outbox.length) return;
  try {
    const data = await api('bootstrap');
    db = data; syncState = 'ok'; saveLocal(); render();
  } catch (e) {
    syncState = 'offline'; render();
    if (e.server) toast(e.message);
  }
}

window.addEventListener('online', () => pull());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });

/* ============================================================
 * Routing + rendering
 * ============================================================ */
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'trip' && h[1]) return { name: 'trip', id: decodeURIComponent(h[1]) };
  if (h[0] === 'someday') return { name: 'someday' };
  return { name: 'trips' };
}
window.addEventListener('hashchange', () => { ui.filter = 'all'; render(); window.scrollTo(0, 0); });
window.addEventListener('scroll', () => { const t = $('.top'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

function syncBadge() {
  const pending = outbox.length;
  const state = syncState === 'offline' ? 'offline' : pending ? 'pending' : 'ok';
  const label = cfg && cfg.demo ? '<span class="demo-tag">SAMPLE</span>' :
    state === 'offline' ? `Offline${pending ? ' · ' + pending + ' waiting' : ''}` : pending ? 'Saving…' : 'Synced';
  return `<div class="sync">${cfg && cfg.demo ? '' : `<span class="dot ${state}"></span>`}${label}</div>`;
}

function render() {
  const app = $('#app');
  if (!cfg) { app.innerHTML = setupView(); bindSetup(); return; }
  const r = route();
  let html = '';
  if (r.name === 'trip') html = tripView(r.id);
  else if (r.name === 'someday') html = somedayView();
  else html = tripsView();
  html += navView(r.name);
  app.innerHTML = html;
  bindCommon();
}

function navView(active) {
  return `<nav class="tabs">
    <button class="${active === 'trips' || active === 'trip' ? 'on' : ''}" data-go="#/">${I.trips}Trips</button>
    <button class="add" data-act="capture" aria-label="Add">${I.plus}</button>
    <button class="${active === 'someday' ? 'on' : ''}" data-go="#/someday">${I.someday}Someday</button>
  </nav>`;
}

/* ---------- Trips list ---------- */
function tripsView() {
  const today = todayStr();
  const sorted = [...db.trips].sort((a, b) => String(a.start || '9999').localeCompare(String(b.start || '9999')));
  const upcoming = sorted.filter(t => !t.end || t.end >= today);
  const past = sorted.filter(t => t.end && t.end < today).reverse();
  const card = t => {
    const st = tripStatus(t);
    const its = itemsFor(t.id);
    const n = k => its.filter(i => i.kind === k).length;
    return `<div class="trip-card" style="--hue:${hue(t.id)}" data-go="#/trip/${encodeURIComponent(t.id)}">
      <h2>${esc(t.name)}</h2>
      ${t.destination ? `<div class="dest">${esc(t.destination)}</div>` : ''}
      <div class="row"><span class="dates">${esc(fmtRange(t.start, t.end))}</span><span class="chip ${st.cls}">${st.label}</span></div>
      <div class="tally"><span style="--c:var(--fixed)">${n('fixed')} fixed</span><span style="--c:var(--place)">${n('place')} places</span><span style="--c:var(--idea)">${n('idea')} ideas</span></div>
    </div>`;
  };
  return `<header class="top"><h1>Trips</h1>${syncBadge()}<button class="iconbtn" data-act="settings" aria-label="Settings">${I.gear}</button></header>
  <main>
    ${upcoming.length ? upcoming.map(card).join('') : `<div class="empty"><div class="big">No trips yet</div>Start one, or save places to Someday and pull them in later.</div>`}
    <button class="btn ghost" data-act="newTrip" style="margin-top:6px">+ New trip</button>
    ${past.length ? `<div class="section-title">Past <span class="count">${past.length}</span></div>${past.map(card).join('')}` : ''}
  </main>`;
}

/* ---------- Trip detail ---------- */
function itemCard(i, showDay) {
  const c = KIND_COLOR[i.kind] || 'var(--idea)';
  let when = '';
  if (i.kind === 'fixed') when = [i.start_time && fmtTime(i.start_time)].filter(Boolean).join('');
  else if (i.day && showDay) when = fmtDay(i.day, true);
  const meta = i._pending ? 'Looking up…' : (placeLine(i) || (i.kind === 'idea' ? (i.notes || 'Idea') : i.address || ''));
  return `<div class="item kind-${esc(i.kind)} ${i.status === 'done' ? 'done' : ''} ${i._pending ? 'pending' : ''}" style="--c:${c}" data-item="${esc(i.id)}">
    <span class="mark"></span>
    <div class="body"><div class="title">${esc(i.title)}</div><div class="meta">${esc(meta)}</div></div>
    ${when ? `<div class="when">${esc(when)}</div>` : ''}
  </div>`;
}

function tripView(id) {
  const t = tripById(id);
  if (!t) return `<header class="top"><button class="iconbtn" data-go="#/">${I.back}</button><h1>Not found</h1></header><main><div class="empty">This trip isn’t in your Sheet anymore.</div></main>`;
  const st = tripStatus(t);
  const its = itemsFor(t.id);
  const matches = somedayMatches(t);
  const f = ui.filter;
  const counts = { fixed: 0, place: 0, idea: 0 };
  its.forEach(i => counts[i.kind] = (counts[i.kind] || 0) + 1);

  let body = '';
  const show = k => f === 'all' || f === k;

  if (show('fixed')) {
    const fixed = its.filter(i => i.kind === 'fixed').sort((a, b) => (a.day || '9').localeCompare(b.day || '9') || (a.start_time || '').localeCompare(b.start_time || ''));
    if (fixed.length) {
      body += `<div class="section-title">Fixed <span class="count">${fixed.length}</span></div>`;
      let lastDay = null;
      fixed.forEach(i => {
        if (i.day !== lastDay) { body += `<div class="daylabel">${i.day ? esc(fmtDay(i.day)) : 'No date'}</div>`; lastDay = i.day; }
        body += itemCard(i, false);
      });
    }
  }
  if (show('place')) {
    const places = its.filter(i => i.kind === 'place').sort((a, b) => (a.day ? 0 : 1) - (b.day ? 0 : 1) || (a.day || '').localeCompare(b.day || '') || a.title.localeCompare(b.title));
    if (places.length) body += `<div class="section-title">Places <span class="count">${places.length}</span></div>` + places.map(i => itemCard(i, true)).join('');
  }
  if (show('idea')) {
    const ideas = its.filter(i => i.kind === 'idea');
    if (ideas.length) body += `<div class="section-title">Ideas <span class="count">${ideas.length}</span></div>` + ideas.map(i => itemCard(i, true)).join('');
  }
  if (!body) body = `<div class="empty"><div class="big">Nothing here yet</div>Tap + to paste a Google Maps link, add a booking, or jot down an idea.</div>`;

  return `<header class="top"><button class="iconbtn" data-go="#/" aria-label="Back">${I.back}</button><h1>${esc(t.name)}</h1>${syncBadge()}<button class="iconbtn" data-act="editTrip" data-id="${esc(t.id)}" aria-label="Edit trip">${I.edit}</button></header>
  <main>
    <div class="trip-head">
      ${t.destination ? `<div class="dest">${esc(t.destination)}</div>` : ''}
      <div class="row"><span class="chip">${esc(fmtRange(t.start, t.end))}</span><span class="chip ${st.cls}">${st.label}</span>${t.timezone ? `<span class="chip">${esc(t.timezone.split('/').pop().replace(/_/g, ' '))} time</span>` : ''}</div>
    </div>
    ${matches.length ? `<div class="banner"><div><b>${matches.length} saved in Someday</b> match ${esc(t.destination || t.name)}.</div><button class="btn small" data-act="pullSomeday" data-id="${esc(t.id)}">Review</button></div>` : ''}
    <div class="filters">
      ${['all', 'fixed', 'place', 'idea'].map(k => `<button class="${f === k ? 'on' : ''}" data-filter="${k}">${k === 'all' ? `All ${its.length}` : `${KIND[k]}${k === 'idea' ? 's' : k === 'place' ? 's' : ''} ${counts[k] || 0}`}</button>`).join('')}
    </div>
    ${body}
  </main>`;
}

/* ---------- Someday ---------- */
function somedayView() {
  const its = itemsFor('');
  const groups = {};
  its.forEach(i => {
    const country = i.country || (i.kind === 'idea' ? 'Ideas' : 'Elsewhere');
    const city = i.city || i.region || '';
    (groups[country] ||= {});
    (groups[country][city] ||= []).push(i);
  });
  const countries = Object.keys(groups).sort((a, b) => (a === 'Ideas') - (b === 'Ideas') || a.localeCompare(b));
  let body = countries.map(c => {
    const cities = Object.keys(groups[c]).sort();
    const total = cities.reduce((n, k) => n + groups[c][k].length, 0);
    return `<div class="section-title">${esc(c)} <span class="count">${total}</span></div>` +
      cities.map(city => (city ? `<div class="daylabel">${esc(city)}</div>` : '') + groups[c][city].map(i => itemCard(i, false)).join('')).join('');
  }).join('');
  if (!body) body = `<div class="empty"><div class="big">Someday is empty</div>Places you save without a trip land here, filed by city. When you start a trip there, they’ll be waiting.</div>`;
  return `<header class="top"><h1>Someday</h1>${syncBadge()}<button class="iconbtn" data-act="settings" aria-label="Settings">${I.gear}</button></header><main>${body}</main>`;
}

/* ---------- binding ---------- */
function bindCommon() {
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = () => { location.hash = el.dataset.go; });
  document.querySelectorAll('[data-item]').forEach(el => el.onclick = () => openItem(el.dataset.item));
  document.querySelectorAll('[data-filter]').forEach(el => el.onclick = () => { ui.filter = el.dataset.filter; render(); });
  document.querySelectorAll('[data-act]').forEach(el => el.onclick = () => {
    const a = el.dataset.act;
    if (a === 'capture') openCapture();
    else if (a === 'settings') openSettings();
    else if (a === 'newTrip') openTripForm();
    else if (a === 'editTrip') openTripForm(el.dataset.id);
    else if (a === 'pullSomeday') openPull(el.dataset.id);
  });
}

/* ============================================================
 * Sheets (bottom drawers)
 * ============================================================ */
function openSheet(html, onMount) {
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(scrim, sh);
  scrim.onclick = () => closeSheet();
  requestAnimationFrame(() => { scrim.classList.add('open'); sh.classList.add('open'); });
  if (onMount) onMount(sh);
  return sh;
}
function closeSheet(instant) {
  document.querySelectorAll('.scrim, .sheet').forEach(el => {
    if (instant) return el.remove();
    el.classList.remove('open'); setTimeout(() => el.remove(), 260);
  });
}

function tripOptions(selected) {
  const today = todayStr();
  const trips = [...db.trips].sort((a, b) => {
    const pa = a.end && a.end < today, pb = b.end && b.end < today;
    return pa - pb || String(a.start || '9999').localeCompare(String(b.start || '9999'));
  });
  return `<option value="">Someday (no trip yet)</option>` +
    trips.map(t => `<option value="${esc(t.id)}" ${t.id === selected ? 'selected' : ''}>${esc(t.name)}${t.start ? ' · ' + esc(fmtRange(t.start, t.end)) : ''}</option>`).join('');
}

/* ---------- Capture ---------- */
function openCapture() {
  const r = route();
  const defaultTrip = r.name === 'trip' ? r.id : '';
  let kind = 'idea', manualKind = false;
  const sh = openSheet(`
    <h3>Add to a trip</h3>
    <div class="field"><textarea class="capture-box" id="cap-text" placeholder="Paste a Google Maps link, or jot an idea — “snack bar near the hotel”"></textarea></div>
    <div class="hint" id="cap-hint">&nbsp;</div>
    <div class="seg" id="cap-kind">
      <button data-k="place">Place</button><button data-k="idea" class="on">Idea</button><button data-k="fixed">Fixed</button>
    </div>
    <div id="cap-fixed" hidden>
      <div class="two">
        <div class="field"><label>Type</label><select id="cap-cat">${FIXED_CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Confirmation #</label><input id="cap-conf" autocomplete="off"></div>
      </div>
      <div class="field"><label>Name (if not a Maps link)</label><input id="cap-title" placeholder="e.g. UA 1234 BNA → KEF"></div>
      <div class="two">
        <div class="field"><label>Date</label><input type="date" id="cap-day"></div>
        <div class="field"><label>Time</label><input type="time" id="cap-time"></div>
      </div>
    </div>
    <div class="field"><label>Trip</label><select id="cap-trip">${tripOptions(defaultTrip)}</select></div>
    <div class="btnrow">
      ${navigator.clipboard && navigator.clipboard.readText ? `<button class="btn ghost" id="cap-paste">Paste</button>` : ''}
      <button class="btn" id="cap-save">Save</button>
    </div>`, sh => {
    const ta = $('#cap-text', sh), hint = $('#cap-hint', sh);
    const setKind = k => {
      kind = k;
      sh.querySelectorAll('#cap-kind button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
      $('#cap-fixed', sh).hidden = k !== 'fixed';
    };
    const detect = () => {
      const v = ta.value.trim();
      if (!v) { hint.innerHTML = '&nbsp;'; return; }
      if (isMapsUrl(v)) { hint.textContent = db.places || (cfg && cfg.demo) ? 'Google Maps link — name, address and hours will fill in.' : 'Google Maps link — will save with its name (add a Places key for hours).'; if (!manualKind) setKind('place'); }
      else if (isUrl(v)) { hint.textContent = 'Web link — saved as an idea with the link attached.'; if (!manualKind) setKind('idea'); }
      else { hint.textContent = 'Saved as an idea. I can turn it into real options later.'; if (!manualKind) setKind('idea'); }
    };
    ta.oninput = detect;
    sh.querySelectorAll('#cap-kind button').forEach(b => b.onclick = () => { manualKind = true; setKind(b.dataset.k); });
    const syncDayBounds = () => {
      const t = tripById($('#cap-trip', sh).value), d = $('#cap-day', sh);
      d.min = t && t.start ? t.start : ''; d.max = t && t.end ? t.end : '';
    };
    $('#cap-trip', sh).onchange = syncDayBounds; syncDayBounds();
    const pb = $('#cap-paste', sh);
    if (pb) pb.onclick = async () => { try { ta.value = await navigator.clipboard.readText(); detect(); } catch (e) { toast('Clipboard not available — long-press to paste'); } };
    $('#cap-save', sh).onclick = () => {
      const text = ta.value.trim();
      const title = kind === 'fixed' ? $('#cap-title', sh).value.trim() : '';
      if (!text && !title) { ta.focus(); return; }
      const payload = {
        id: uid('it'), text, kind, trip: $('#cap-trip', sh).value || 'someday',
        title: title || undefined,
        category: kind === 'fixed' ? $('#cap-cat', sh).value : undefined,
        confirmation: kind === 'fixed' ? $('#cap-conf', sh).value.trim() : undefined,
        day: kind === 'fixed' ? $('#cap-day', sh).value : undefined,
        start_time: kind === 'fixed' ? $('#cap-time', sh).value : undefined,
      };
      const local = {
        id: payload.id, trip_id: payload.trip === 'someday' ? '' : payload.trip, kind,
        category: payload.category || '', title: title || (isUrl(text) ? (text.split('\n').find(l => !isUrl(l)) || 'Saved place') : text),
        day: payload.day || '', start_time: payload.start_time || '', confirmation: payload.confirmation || '',
        status: 'open', source: text, _pending: isMapsUrl(text),
      };
      queue('add', payload, () => db.items.push(local));
      closeSheet();
      toast(local.trip_id ? 'Saved to ' + (tripById(local.trip_id) || {}).name : 'Saved to Someday');
    };
    setTimeout(() => ta.focus(), 280);
  });
}

/* ---------- Item detail ---------- */
function openItem(id) {
  const i = db.items.find(x => x.id === id);
  if (!i) return;
  const t = tripById(i.trip_id);
  let hours = null;
  try { hours = i.hours ? JSON.parse(i.hours) : null; } catch (e) {}
  const refDay = i.day ? parseDate(i.day).getDay() : new Date().getDay();
  const hoursHtml = hours && hours.weekday && hours.weekday.length
    ? `<ul class="hours">${hours.weekday.map(w => `<li class="${w.startsWith(DOW_LONG[refDay]) ? 'today' : ''}">${esc(w)}</li>`).join('')}</ul>` : '';
  let kind = i.kind;

  openSheet(`
    <div class="field"><input id="it-title" value="${esc(i.title)}" style="font-family:var(--serif);font-size:20px;font-weight:600;border:0;background:none;padding:4px 2px"></div>
    <div class="seg" id="it-kind">${['place', 'idea', 'fixed'].map(k => `<button data-k="${k}" class="${k === kind ? 'on' : ''}">${KIND[k]}</button>`).join('')}</div>
    ${(i.address || hoursHtml || i.maps_url || i.website) ? `<div class="info">
      ${i.address ? `<div>${esc(i.address)}</div>` : ''}
      ${hoursHtml}
      <div class="links">
        ${i.maps_url ? `<a href="${esc(i.maps_url)}" target="_blank" rel="noopener">Open in Maps</a>` : ''}
        ${i.website ? `<a href="${esc(i.website)}" target="_blank" rel="noopener">Website</a>` : ''}
        ${i.maps_url && !(cfg && cfg.demo) ? `<a href="#" id="it-refresh">Refresh details</a>` : ''}
      </div></div>` : ''}
    <div class="two">
      <div class="field"><label>Trip</label><select id="it-trip">${tripOptions(i.trip_id)}</select></div>
      <div class="field"><label>Category</label><input id="it-cat" value="${esc(i.category)}" list="cats"><datalist id="cats">${FIXED_CATS.map(c => `<option>${c}</option>`).join('')}</datalist></div>
    </div>
    <div class="two">
      <div class="field"><label>Day</label><input type="date" id="it-day" value="${esc(i.day)}" ${t && t.start ? `min="${esc(t.start)}"` : ''} ${t && t.end ? `max="${esc(t.end)}"` : ''}></div>
      <div class="field"><label>Time</label><input type="time" id="it-time" value="${esc(i.start_time)}"></div>
    </div>
    <div class="field" id="it-conf-wrap" ${kind === 'fixed' ? '' : 'hidden'}><label>Confirmation #</label><input id="it-conf" value="${esc(i.confirmation)}" autocomplete="off"></div>
    <div class="field"><label>Notes</label><textarea id="it-notes" placeholder="Why it’s on the list, who recommended it, what to order…">${esc(i.notes)}</textarea></div>
    <div class="btnrow"><button class="btn danger" id="it-del">Delete</button><button class="btn" id="it-save">Save</button></div>
  `, sh => {
    sh.querySelectorAll('#it-kind button').forEach(b => b.onclick = () => {
      kind = b.dataset.k;
      sh.querySelectorAll('#it-kind button').forEach(x => x.classList.toggle('on', x === b));
      $('#it-conf-wrap', sh).hidden = kind !== 'fixed';
    });
    $('#it-save', sh).onclick = () => {
      const patch = {
        title: $('#it-title', sh).value.trim() || i.title, kind,
        trip_id: $('#it-trip', sh).value, category: $('#it-cat', sh).value.trim(),
        day: $('#it-day', sh).value, start_time: $('#it-time', sh).value,
        confirmation: $('#it-conf', sh).value.trim(), notes: $('#it-notes', sh).value,
      };
      if (patch.trip_id !== i.trip_id && patch.day) {
        const nt = tripById(patch.trip_id);
        if (!nt || (nt.start && patch.day < nt.start) || (nt.end && patch.day > nt.end)) patch.day = '';
      }
      queue('updateItem', { id: i.id, patch }, () => Object.assign(i, patch));
      closeSheet();
    };
    $('#it-del', sh).onclick = () => {
      if (!confirm('Delete “' + i.title + '”?')) return;
      queue('deleteItem', { id: i.id }, () => { db.items = db.items.filter(x => x.id !== i.id); });
      closeSheet();
    };
    const rf = $('#it-refresh', sh);
    if (rf) rf.onclick = e => { e.preventDefault(); i._pending = true; queue('refreshItem', { id: i.id }); closeSheet(); toast('Refreshing from Google…'); };
  });
}

/* ---------- Trip form ---------- */
function openTripForm(id) {
  const t = id ? tripById(id) : null;
  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch (e) {}
  openSheet(`
    <h3>${t ? 'Edit trip' : 'New trip'}</h3>
    <div class="field"><label>Name</label><input id="tr-name" value="${esc(t ? t.name : '')}" placeholder="Japan, spring"></div>
    <div class="field"><label>Destination</label><input id="tr-dest" value="${esc(t ? t.destination : '')}" placeholder="Tokyo, Kyoto, Japan"></div>
    <div class="two">
      <div class="field"><label>Start</label><input type="date" id="tr-start" value="${esc(t ? t.start : '')}"></div>
      <div class="field"><label>End</label><input type="date" id="tr-end" value="${esc(t ? t.end : '')}"></div>
    </div>
    <div class="field"><label>Local time zone</label><input id="tr-tz" list="zones" value="${esc(t ? t.timezone : '')}" placeholder="Asia/Tokyo" autocomplete="off"><datalist id="zones">${zones.map(z => `<option value="${esc(z)}">`).join('')}</datalist></div>
    <div class="field"><label>Notes</label><textarea id="tr-notes">${esc(t ? t.notes : '')}</textarea></div>
    <div class="btnrow">${t ? `<button class="btn danger" id="tr-del">Delete</button>` : ''}<button class="btn" id="tr-save">${t ? 'Save' : 'Create trip'}</button></div>
    ${t ? `<p class="hint" style="margin-top:12px">Deleting a trip sends its places back to Someday.</p>` : ''}
  `, sh => {
    $('#tr-save', sh).onclick = () => {
      const data = {
        name: $('#tr-name', sh).value.trim(), destination: $('#tr-dest', sh).value.trim(),
        start: $('#tr-start', sh).value, end: $('#tr-end', sh).value,
        timezone: $('#tr-tz', sh).value.trim(), notes: $('#tr-notes', sh).value,
      };
      if (!data.name) { $('#tr-name', sh).focus(); return; }
      if (data.start && data.end && data.end < data.start) { toast('End date is before the start'); return; }
      if (t) {
        queue('updateTrip', { id: t.id, patch: data }, () => Object.assign(t, data));
        closeSheet();
      } else {
        const trip = { id: uid('tr'), ...data };
        queue('addTrip', { trip }, () => db.trips.push(trip));
        closeSheet();
        location.hash = '#/trip/' + encodeURIComponent(trip.id);
        const m = somedayMatches(trip);
        if (m.length) setTimeout(() => openPull(trip.id), 350);
      }
    };
    const del = $('#tr-del', sh);
    if (del) del.onclick = () => {
      if (!confirm('Delete “' + t.name + '”? Its places go back to Someday.')) return;
      queue('deleteTrip', { id: t.id }, () => {
        db.items.forEach(i => { if (i.trip_id === t.id) { i.trip_id = ''; i.day = ''; } });
        db.trips = db.trips.filter(x => x.id !== t.id);
      });
      closeSheet(); location.hash = '#/';
    };
  });
}

/* ---------- Pull from Someday ---------- */
function openPull(tripId) {
  const t = tripById(tripId); if (!t) return;
  const m = somedayMatches(t);
  if (!m.length) return;
  openSheet(`
    <h3>Bring these into ${esc(t.name)}?</h3>
    <p class="hint" style="margin:-6px 2px 10px">Saved to Someday in ${esc(t.destination || t.name)}.</p>
    <div>${m.map(i => `<label class="check"><input type="checkbox" value="${esc(i.id)}" checked><span>${esc(i.title)}<small>${esc(placeLine(i))}</small></span></label>`).join('')}</div>
    <div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="pl-skip">Not now</button><button class="btn" id="pl-go">Add selected</button></div>
  `, sh => {
    $('#pl-skip', sh).onclick = () => closeSheet();
    $('#pl-go', sh).onclick = () => {
      const ids = [...sh.querySelectorAll('input:checked')].map(x => x.value);
      if (ids.length) queue('attach', { ids, trip_id: t.id }, () => db.items.forEach(i => { if (ids.includes(i.id)) i.trip_id = t.id; }));
      closeSheet();
      if (ids.length) toast(`Added ${ids.length} to ${t.name}`);
    };
  });
}

/* ---------- Settings ---------- */
function openSettings() {
  openSheet(`
    <h3>Settings</h3>
    ${cfg.demo ? `<div class="info">You’re looking at sample data. Nothing here is saved to a Sheet.</div>` : `
    <div class="field"><label>Apps Script web app URL</label><input id="st-url" value="${esc(cfg.url)}" autocomplete="off"></div>
    <div class="field"><label>Passphrase</label><input id="st-token" value="${esc(cfg.token)}" autocomplete="off"></div>
    <div class="field"><label>Google Sheet link (optional, for the shortcut below)</label><input id="st-sheet" value="${esc(cfg.sheetUrl || '')}" placeholder="https://docs.google.com/spreadsheets/…"></div>
    <div class="info">
      Place lookup: <b>${db.places ? 'on' : 'off — add PLACES_KEY in Apps Script'}</b><br>
      Waiting to sync: <b>${outbox.length}</b>
      ${cfg.sheetUrl ? `<div class="links"><a href="${esc(cfg.sheetUrl)}" target="_blank" rel="noopener">Open the Sheet</a></div>` : ''}
    </div>`}
    <div class="btnrow">
      ${cfg.demo ? `<button class="btn" id="st-exit">Connect my Sheet</button>` :
        `<button class="btn ghost" id="st-sync">Sync now</button><button class="btn" id="st-save">Save</button>`}
    </div>
    ${cfg.demo ? '' : `<button class="btn danger" id="st-out" style="margin-top:12px">Disconnect this phone</button>`}
  `, sh => {
    const ex = $('#st-exit', sh);
    if (ex) ex.onclick = () => { cfg = null; store.del('th_cfg'); db = { trips: [], items: [], plan: [], log: [], places: false }; outbox = []; saveLocal(); closeSheet(); location.hash = '#/'; render(); };
    const sv = $('#st-save', sh);
    if (sv) sv.onclick = () => {
      cfg = { url: $('#st-url', sh).value.trim(), token: $('#st-token', sh).value.trim(), sheetUrl: $('#st-sheet', sh).value.trim() };
      store.set('th_cfg', cfg); closeSheet(); pull(); toast('Saved');
    };
    const sy = $('#st-sync', sh);
    if (sy) sy.onclick = () => { closeSheet(); pull().then(() => toast(syncState === 'ok' ? 'Up to date' : 'Still offline')); };
    const out = $('#st-out', sh);
    if (out) out.onclick = () => {
      if (outbox.length && !confirm(outbox.length + ' changes haven’t reached the Sheet yet. Disconnect anyway?')) return;
      cfg = null; store.del('th_cfg'); outbox = []; db = { trips: [], items: [], plan: [], log: [], places: false }; saveLocal(); closeSheet(); render();
    };
  });
}

/* ============================================================
 * First-run setup
 * ============================================================ */
function setupView() {
  return `<div class="setup">
    <div class="logo">Travel<br>Hub</div>
    <p>Plan before you go, log while you’re there. Everything is saved to your own Google Sheet.</p>
    <div class="field"><label>Apps Script web app URL</label><input id="su-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
    <div class="field"><label>Passphrase</label><input id="su-token" autocomplete="off"></div>
    <button class="btn" id="su-go">Connect</button>
    <div class="hint" id="su-msg" style="margin-top:12px;text-align:center"></div>
    <div class="or">or</div>
    <button class="btn ghost" id="su-demo">Look around with sample data</button>
  </div>`;
}
function bindSetup() {
  $('#su-go').onclick = async () => {
    const url = $('#su-url').value.trim(), token = $('#su-token').value.trim();
    const msg = $('#su-msg');
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { msg.textContent = 'That doesn’t look like an Apps Script web app URL.'; return; }
    msg.textContent = 'Connecting…';
    cfg = { url, token };
    try {
      db = await api('bootstrap');
      store.set('th_cfg', cfg); saveLocal(); render();
      toast('Connected');
    } catch (e) {
      cfg = null;
      msg.textContent = e.server ? e.message : 'Couldn’t reach it. Check the URL and that it’s deployed for “Anyone”.';
    }
  };
  $('#su-demo').onclick = () => { cfg = { demo: true }; db = demoData(); outbox = []; store.set('th_cfg', cfg); saveLocal(); render(); };
}

function demoApi(action, p) {
  return new Promise(resolve => setTimeout(() => {
    if (action === 'add') {
      const text = p.text || '';
      const it = db.items.find(i => i.id === p.id) || {};
      let title = p.title || it.title;
      if (isMapsUrl(text)) {
        const m = text.match(/\/maps\/place\/([^\/@?]+)/);
        title = p.title || (m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : (text.split('\n').find(l => !isUrl(l)) || 'Saved place (sample)'));
      }
      resolve({ ...it, title, _pending: false, category: it.category || (isMapsUrl(text) ? 'Place' : ''), maps_url: isMapsUrl(text) ? text.match(/https?:\/\/\S+/)[0] : '' });
    } else if (action === 'updateItem') resolve(db.items.find(i => i.id === p.id));
    else if (action === 'addTrip') resolve(p.trip);
    else if (action === 'updateTrip') resolve(db.trips.find(t => t.id === p.id));
    else if (action === 'attach') resolve(db.items.filter(i => p.ids.includes(i.id)));
    else resolve(null);
  }, 300));
}

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
render();
if (cfg && !cfg.demo) pull();
else if (cfg && cfg.demo) flush();
