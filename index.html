  let tt;
  $('#rc-title').oninput = e => { p.frame = { ...p.frame, name: e.target.value }; clearTimeout(tt); tt = setTimeout(() => { savePosterPrefs(t.id, p); redraw(); }, 250); };
  $('#rc-keep').onclick = () => {
    const name = ($('#rc-title').value || '').trim();
    if (!name) { $('#rc-title').focus(); return toast('Give it a name first'); }
    const { name: _n, sliceId, ...frame } = p.frame;
    const slices = (p.slices || []).slice(), i = slices.findIndex(x => x.id === sliceId);
    const sl = { id: i >= 0 ? sliceId : uid('sl'), name, frame };
    if (i >= 0) slices[i] = sl; else slices.push(sl);
    p.slices = slices; toast(i >= 0 ? 'Updated ' + name : 'Saved ' + name);
    setFrame({ ...frame, name, sliceId: sl.id });
  };
  $$('[data-slice]').forEach(b => b.onclick = () => { const sl = p.slices.find(x => x.id === b.dataset.slice); if (sl) setFrame({ ...sl.frame, name: sl.name, sliceId: sl.id }); });
  $$('[data-unslice]').forEach(b => b.onclick = () => {
    const id = b.dataset.unslice; p.slices = p.slices.filter(x => x.id !== id);
    setFrame(p.frame.sliceId === id ? { ...p.frame, sliceId: undefined } : p.frame);
  });
  let credits = [];
  const redraw = () => { credits = recapCredits(t, data, p, ground); drawPoster(canvas, t, data, p, ground, credits); $('.poster-frame').className = 'poster-frame ' + p.size; };
  // the credits list: each one a switch, with the value it'll print
  const renderCredits = () => {
    const box = $('#rc-credits'); if (!box) return;
    box.innerHTML = credits.length ? credits.map(c => `<label class="check credit"><input type="checkbox" data-credit="${c.key}" ${c.on ? 'checked' : ''}>
      <span>${esc(c.label)}${c.choices && c.choices.length > 1 ? '' : `<small>${esc(c.value)}</small>`}${c.choices && c.choices.length > 1 ? `<select data-fav>${c.choices.map(s => `<option value="${esc(s.key)}" ${s.key === c.chosen ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</select>` : ''}</span></label>`).join('')
      : `<p class="hint" style="margin:0 2px 14px">Credits appear once there’s enough logged to say something true.</p>`;
    $$('[data-credit]', box).forEach(cb => cb.onchange = () => { p.credits = { ...(p.credits || {}), [cb.dataset.credit]: cb.checked }; savePosterPrefs(t.id, p); redraw(); });
    $$('[data-fav]', box).forEach(sel => { sel.onclick = e => e.stopPropagation(); sel.onchange = () => { p.fav = sel.value; savePosterPrefs(t.id, p); redraw(); renderCredits(); }; });
  };
  const rn = $('#rc-notes'); if (rn) rn.onchange = () => { p.notes = rn.checked; savePosterPrefs(t.id, p); redraw(); };
  // "Home away from home": the neighbourhood with the most stops, named once by OpenStreetMap
  if (data.lived) recapHood(data.stops).then(h => { if (h && $('#poster') === canvas) { ground.hood = h; redraw(); renderCredits(); } });
  // Ground: world outlines for the country view and the inset, OSM water for city-sized frames. Fetched once, then cached.
  const wanted = new Set();
  const fetchGround = () => {
    if (p.ground === 'none') return;
    const f = posterFrame(data, p);
    if (!f.framePts.length) return;
    if (!ground.world && !wanted.has('world')) { wanted.add('world'); loadWorld().then(w => { if (w) { ground.world = w; if ($('#poster') === canvas) redraw(); } else wanted.delete('world'); }); }
    const scale = groundScale(f.framePts), roads = p.ground === 'roads';
    const box = groundBox(f.framePts, p.size), key = JSON.stringify([box, scale, roads]);
    if (ground.osmKey !== key && !wanted.has(key)) {
      wanted.add(key);
      loadOSM(box, scale, roads).then(o => { wanted.delete(key); if (o) { ground.osm = o; ground.osmScale = scale; ground.osmKey = key; ground.osmBox = box; if ($('#poster') === canvas) redraw(); } });
    }
  };
  // a light placeholder while the typeface loads, then the real thing
  redraw(); renderCredits();
  loadPosterFonts().then(redraw);
  fetchGround();
  // fetch any real paths we don't have yet (cached in the Sheet, so each leg is paid for once)
  const legs = [];
  data.tracks.forEach(tr => tr.pts.forEach((b, k) => { if (!k) return; const a = tr.pts[k - 1];
    const leg = { from: [a.lat, a.lng], to: [b.lat, b.lng], mode: b.mode || guessMode(a, b) };
    if (!routeCache[routeKey(leg)] && leg.mode !== 'train' && leg.mode !== 'tour' && meters(a, b) < 30000) legs.push(leg); }));
  if (legs.length) getRoutes(legs.slice(0, 120)).then(() => { if ($('#poster') === canvas) { data = recapData(t, p.frame); redraw(); } });

  const sh = $('#rc-shade'); if (sh) sh.onchange = () => { p.shade = sh.checked; savePosterPrefs(t.id, p); redraw(); };
  $$('[data-pref]').forEach(g => $$('button', g).forEach(b => b.onclick = () => {
    p[g.dataset.pref] = b.dataset.v; savePosterPrefs(t.id, p);
    if (g.dataset.pref === 'ground') $('#rc-shade-row').hidden = p.ground === 'none';
    $$('button', g).forEach(x => x.classList.toggle('on', x === b)); redraw(); fetchGround();
  }));
  let tm;
  $('#rc-line').oninput = e => { p.line = e.target.value; clearTimeout(tm); tm = setTimeout(() => { savePosterPrefs(t.id, p); redraw(); }, 250); };
  $('#rc-save').onclick = () => {
    const name = `${(t.name || 'trip').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}-${p.size === 'story' ? '9x16' : '4x5'}.png`;
    canvas.toBlob(async blob => {
      if (!blob) return toast('Couldn’t make the image');
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Saved ' + name);
    }, 'image/png');
  };
}

/* ============================================================
 * Look back — posters for a stretch of time across trips (a year, a season, any dates)

 *   Same paper, looks and typeface as the trip poster. Choices live in localStorage `th_range`.
 * ============================================================ */
const RANGE_STYLES = [['map', 'Map'], ['numbers', 'Numbers'], ['calendar', 'Calendar'], ['sheet', 'Sheet'], ['carousel', 'Carousel']];
const RANGE_CREDITS = [
  ['longest', 'Longest trip', true], ['furthest', 'Furthest from home', true], ['mostloved', 'Loved the most', true],
  ['time', 'Most time in', true], ['back', 'Went back to', true], ['fav', 'Favorite discovery', true],
  ['often', 'Most often', true], ['ends', 'First and last', true], ['fullest', 'Fullest day', false], ['late', 'Latest night', false],

  return Object.assign({ when: 'last12', from: '', to: '', name: '', style: 'map', size: 'post', look: 'fog', ground: 'water', line: '',

  if (k === 'last12') return { from: addDays(today, -364), to: today, title: '' };
  if (k === 'year') return { from: `${yr}-01-01`, to: `${yr}-12-31`, title: String(yr) };
  if (k === 'winter') return { from: `${yr}-10-01`, to: `${yr + 1}-03-31`, title: `Winter ${yr}–${String(yr + 1).slice(2)}` };
  if (k === 'summer') return { from: `${yr}-04-01`, to: `${yr}-09-30`, title: `Summer ${yr}` };

}
function rangeChoices() {
  const y = +todayStr().slice(0, 4);
  const spans = db.trips.map(tripDays).filter(d => d.length).map(d => [d[0], d[d.length - 1]]);
  const has = (a, b) => spans.some(([s, e]) => s <= b && e >= a);
  const years = new Set([y]);
  spans.forEach(([s, e]) => { years.add(+s.slice(0, 4)); years.add(+e.slice(0, 4)); });
  const ys = [...years].sort((a, b) => b - a);
  const seasons = [];
  [...new Set([...ys, ...ys.map(v => v - 1)])].forEach(yr => ['winter', 'summer'].forEach(k => {
    const s = presetSpan(`${k}:${yr}`);
    if (has(s.from, s.to)) seasons.push({ v: `${k}:${yr}`, label: `${s.title} (${k === 'winter' ? 'Oct–Mar' : 'Apr–Sep'})`, from: s.from });

  if (s.getFullYear() === e.getFullYear()) return s.getMonth() === e.getMonth() ? `${MONTH_LONG[s.getMonth()]} ${s.getFullYear()}` : `${MONTH_LONG[s.getMonth()]} to ${MONTH_LONG[e.getMonth()]} ${e.getFullYear()}`;

  if (!from || !to) { const d = presetSpan('last12'); from = d.from; to = d.to; }

  return s.getMonth() === e.getMonth() ? `${MON[s.getMonth()]} ${s.getDate()}–${e.getDate()}` : `${MON[s.getMonth()]} ${s.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}`;

/** Trips with any day inside the stretch, in order. */
function rangeTrips(from, to) {
  return db.trips.map(t => ({ t, d: tripDays(t) })).filter(x => x.d.length && x.d[0] <= to && x.d[x.d.length - 1] >= from)
    .sort((a, b) => a.d[0].localeCompare(b.d[0])).map(x => x.t);

/** Everything the range posters draw. Each trip is cut to the stretch with the trip poster's own date frame.

    const days = (data.lived ? logDays(t) : tripDays(t)).filter(d => d >= from && d <= to);

    const anchor = pts.length ? pts : stays.length ? stays : data.unvisited;
    const flights = itemsFor(t.id).filter(f => isFlight(f) && !f.parent_id && f.day && f.day >= from && f.day <= to && num(f.from_lat) !== null && num(f.to_lat) !== null)

      first, last, upcoming: !data.lived && (t.start || first || '') > today, country: dest.length > 1 ? dest[dest.length - 1] : '' };
  });
  const lived = trips.some(x => x.lived);
  const base = lived ? trips.filter(x => x.lived) : trips;
  const dayList = [];
  for (let d = from; d <= to && dayList.length < 800; d = addDays(d, 1)) dayList.push(d);
  const byDay = {};
  trips.forEach(x => {
    x.data.perDay.forEach(pd => { if (pd.day < from || pd.day > to) return;
      const o = byDay[pd.day] ||= { n: 0, marks: 0, plan: true, trip: x };
      o.n += pd.n; o.marks += pd.marks; if (x.lived) o.plan = false; });

/** Big numerals, two to a row, then the trips as a track list if there's room. */

  shown.forEach((n, i) => {
    const x = rect.x + (i % 2) * colW, y = y0 + Math.floor(i / 2) * cellH;

/** The trips, set like a record's track list: number, name, dates. Trips still to come are in italic. */
function drawTracklist(ctx, R, rect, L, story, big) {
  const size = big ? (story ? 42 : 38) : (story ? 30 : 27), lh = Math.round(size * (big ? 1.7 : 1.6));
  const fit = Math.max(1, Math.floor(rect.h / lh)), list = R.trips;
  const shown = list.length > fit ? list.slice(0, fit - 1) : list;
  const numW = size * 1.9;
  ctx.strokeStyle = L.faint; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(rect.x, rect.y + 0.5); ctx.lineTo(rect.x + rect.w, rect.y + 0.5); ctx.stroke();
  shown.forEach((x, i) => {
    const y = rect.y + (i + 1) * lh - lh * 0.32;
    if ('fontVariantNumeric' in ctx) ctx.fontVariantNumeric = 'tabular-nums';
    ctx.fillStyle = L.ink; ctx.globalAlpha = 0.62; ctx.font = `400 ${size}px ${PF}`; ctx.textAlign = 'left';
    ctx.fillText(String(x.n).padStart(2, '0'), rect.x, y);
    const dates = shortRange(x.first, x.last); ctx.textAlign = 'right'; ctx.fillText(dates, rect.x + rect.w, y);
    const dw = ctx.measureText(dates).width; ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    ctx.font = x.lived || !R.lived ? `500 ${size}px ${PF}` : `italic 400 ${size}px ${PF}`;

  ctx.textAlign = 'left';
}

/** One row per month, one stroke per day (the trip poster's score, laid out like a calendar). */
function drawRangeCalendar(ctx, R, rect, L, story) {
  const months = [];
  let d = parseDate(R.from); d = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = parseDate(R.to);
  while (d <= end && months.length < 24) { months.push({ y: d.getFullYear(), m: d.getMonth() }); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  const rows = months.length, rowH = rect.h / rows, labW = story ? 108 : 98, colW = (rect.w - labW) / 31;
  const multiYear = months[0].y !== months[rows - 1].y;
  const maxN = Math.max(1, ...Object.values(R.byDay).map(o => o.n));
  const sw = Math.max(2, Math.min(9, colW * 0.42)), strokeMax = Math.min(rowH * 0.5, 70);
  const xOf = day => rect.x + labW + (day - 0.5) * colW;
  const labels = [], marks = [];
  months.forEach((mo, r) => {
    const top = rect.y + r * rowH, base = Math.round(top + rowH * 0.7) + 0.5;
    const nDays = new Date(mo.y, mo.m + 1, 0).getDate();
    ctx.fillStyle = L.ink; ctx.font = `500 ${story ? 27 : 25}px ${PF}`; ctx.textAlign = 'left';
    ctx.fillText(MON[mo.m], rect.x, base);
    if (r === 0 || (mo.m === 0 && multiYear)) { ctx.globalAlpha = 0.62; ctx.font = `400 ${story ? 21 : 19}px ${PF}`; ctx.fillText(String(mo.y), rect.x, base + (story ? 25 : 23)); ctx.globalAlpha = 1; }
    const inR = []; for (let day = 1; day <= nDays; day++) { const ds = ymd(new Date(mo.y, mo.m, day)); if (ds >= R.from && ds <= R.to) inR.push([day, ds]); }
    if (!inR.length) return;
    ctx.strokeStyle = L.faint; ctx.lineWidth = 1.2; ctx.beginPath();
    ctx.moveTo(xOf(inR[0][0]) - colW * 0.45, base); ctx.lineTo(xOf(inR[inR.length - 1][0]) + colW * 0.45, base); ctx.stroke();
    let run = null; const runs = [];
    const close = () => { if (run) runs.push(run); run = null; };
    inR.forEach(([day, ds]) => {
      const o = R.byDay[ds];
      if (!o) { close(); return; }
      if (!run || run.x !== o.trip) { close(); run = { x: o.trip, a: day, b: day, plan: o.plan }; } else run.b = day;
      const xc = xOf(day);
      ctx.globalAlpha = o.plan ? 0.38 : 1; ctx.fillStyle = L.ink;
      if (o.n) {
        const h = 5 + (strokeMax - 5) * o.n / maxN, hl = o.marks ? (h - 5) * o.marks / o.n + (o.marks === o.n ? 5 : 0) : 0;
        ctx.fillRect(xc - sw / 2, base - h + hl, sw, h - hl);
        if (o.marks) marks.push({ x: xc - sw / 2, y: base - h, w: sw, h: hl, a: o.plan ? 0.38 : 1 });
      } else { ctx.beginPath(); ctx.arc(xc, base - 4, 2.3, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    });
    close();
    runs.forEach(rn => { ctx.globalAlpha = rn.plan ? 0.38 : 1; ctx.fillStyle = L.ink; ctx.fillRect(xOf(rn.a) - colW * 0.45, base + 5, (rn.b - rn.a + 1) * colW - colW * 0.1, 3); ctx.globalAlpha = 1; });
    runs.forEach((rn, k) => labels.push({ rn, base, top, prev: runs[k - 1], next: runs[k + 1], rowEnd: rect.x + rect.w }));
  });
  inColor(ctx, L, () => { ctx.fillStyle = L.accent; marks.forEach(m => { ctx.globalAlpha = m.a; ctx.fillRect(m.x, m.y, m.w, m.h); }); ctx.globalAlpha = 1; });
  // each trip named once, beside its first run: to the right if the row is free there, else to the left, else under the bar
  const named = new Set(), font = `italic 400 ${story ? 27 : 25}px ${PF}`;
  ctx.font = font;
  labels.forEach(({ rn, base, top, prev, next, rowEnd }) => {
    if (named.has(rn.x.t.id)) return;
    const text = rn.x.t.name || 'Trip', w = ctx.measureText(text).width;
    const rx = xOf(rn.b) + colW * 0.6 + 4, lx = xOf(rn.a) - colW * 0.6 - 4 - w;
    let x = null, y = base - 6;
    if (rx + w <= (next ? xOf(next.a) - colW : rowEnd)) x = rx;
    else if (lx >= (prev ? xOf(prev.b) + colW : rect.x + labW)) x = lx;
    else if (top + rowH - (base + 8) >= 24) { x = Math.min(xOf(rn.a) - colW * 0.45, rowEnd - w); y = base + 30; }
    if (x === null) return;
    named.add(rn.x.t.id);
    ctx.fillStyle = L.ink; ctx.globalAlpha = rn.plan ? 0.6 : 0.92; ctx.fillText(text, x, y); ctx.globalAlpha = 1;
  });
}

/** A contact sheet: each trip's own drawing in a frame, captioned with its number, name and dates. */
function drawRangeSheet(ctx, R, rect, L, story) {
  const list = R.trips, n = list.length;
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3, gap = 26, capH = story ? 76 : 70;
  const maxRows = Math.max(1, Math.floor((rect.h + gap) / ((cols === 3 ? 190 : 240) + gap)));
  const rows = Math.min(maxRows, Math.ceil(n / cols)), cells = rows * cols;
  const shown = n > cells ? list.slice(0, cells - 1) : list;
  const cw = (rect.w - gap * (cols - 1)) / cols, ch = (rect.h - gap * (rows - 1)) / rows;
  shown.forEach((x, i) => {
    const cx = rect.x + (i % cols) * (cw + gap), cy = rect.y + Math.floor(i / cols) * (ch + gap);
    const area = { x: cx, y: cy, w: cw, h: ch - capH };
    ctx.strokeStyle = L.faint; ctx.lineWidth = 1.5; ctx.strokeRect(area.x + 0.5, area.y + 0.5, area.w - 1, area.h - 1);
    drawMiniTrip(ctx, x, { x: area.x + 6, y: area.y + 6, w: area.w - 12, h: area.h - 12 }, L, cols === 3 ? 1.8 : 2.3);
    const fs = cols === 3 ? 25 : 28, y1 = area.y + area.h + fs + 12;
    ctx.fillStyle = L.ink; ctx.globalAlpha = 0.62; ctx.font = `400 ${fs - 3}px ${PF}`; if ('fontVariantNumeric' in ctx) ctx.fontVariantNumeric = 'tabular-nums';
    const num = String(x.n).padStart(2, '0'); ctx.fillText(num, cx, y1);
    const nw = ctx.measureText(num).width + 12; ctx.globalAlpha = 1;
    ctx.font = x.lived || !R.lived ? `600 ${fs}px ${PF}` : `italic 400 ${fs}px ${PF}`;
    let name = x.t.name || 'Trip'; while (name.length > 3 && ctx.measureText(name).width > cw - nw) name = name.slice(0, -2).trim() + '…';
    ctx.fillText(name, cx + nw, y1);
    ctx.globalAlpha = 0.62; ctx.font = `400 ${fs - 4}px ${PF}`; ctx.fillText(shortRange(x.first, x.last) + (x.upcoming ? ' · to come' : ''), cx + nw, y1 + fs + 2); ctx.globalAlpha = 1;
  });

    const i = shown.length, cx = rect.x + (i % cols) * (cw + gap), cy = rect.y + Math.floor(i / cols) * (ch + gap);
    ctx.fillStyle = L.ink; ctx.globalAlpha = 0.62; ctx.font = `italic 400 ${story ? 32 : 30}px ${PF}`; ctx.textAlign = 'center';
    ctx.fillText(`and ${numWord(n - shown.length)} more`, cx + cw / 2, cy + (ch - capH) / 2); ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}
/** A trip's drawing at thumbnail size, framed the way its own poster is (Up close or Whole trip). */
function drawMiniTrip(ctx, x, rect, L, lw) {
  const f = posterFrame(x.data, posterPrefs(x.t.id));
  if (!f.framePts.length) {
    ctx.fillStyle = L.faint; ctx.font = `italic 400 24px ${PF}`; ctx.textAlign = 'center';
    ctx.fillText('Nothing placed yet', rect.x + rect.w / 2, rect.y + rect.h / 2 + 8); ctx.textAlign = 'left'; return;
  }
  const P = projector(geoBounds(f.framePts), rect, 0.12);
  ctx.save(); ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w, rect.h); ctx.clip();
  ctx.globalAlpha = x.lived || !x.upcoming ? 1 : 0.85;
  ctx.fillStyle = L.faint; x.data.unvisited.forEach(p => { const q = P(p); ctx.beginPath(); ctx.arc(q.x, q.y, 2, 0, Math.PI * 2); ctx.fill(); });
  drawTracks(ctx, x.data.tracks, P, L, lw, true);
  x.homes.forEach(h => { const q = P(h); ctx.fillStyle = L.paper; ctx.strokeStyle = L.ink; ctx.lineWidth = 1.8; ctx.fillRect(q.x - 5, q.y - 5, 10, 10); ctx.strokeRect(q.x - 5, q.y - 5, 10, 10); });
  x.stops.forEach(s => { if (s.mark) return; const q = P(s); ctx.beginPath();
    if (s.found) { ctx.arc(q.x, q.y, 4.6, 0, Math.PI * 2); ctx.fillStyle = L.paper; ctx.fill(); ctx.lineWidth = 1.8; ctx.strokeStyle = L.ink; ctx.stroke(); }
    else { ctx.arc(q.x, q.y, 3.5, 0, Math.PI * 2); ctx.fillStyle = L.ink; ctx.fill(); } });
  ctx.restore();
  inColor(ctx, L, () => { ctx.fillStyle = L.accent; x.stops.filter(s => s.mark).forEach(s => { const q = P(s);
    if (q.x < rect.x || q.x > rect.x + rect.w || q.y < rect.y || q.y > rect.y + rect.h) return;
    ctx.beginPath(); ctx.arc(q.x, q.y, 6.5, 0, Math.PI * 2); ctx.fill(); }); });
}

/** The day strip under the title for a whole stretch: one stroke per day, plans faint. */
function drawRangeStrip(ctx, R, L, M, CW, top, base, W) {
  const N = R.dayList.length; if (!N) return;
  const step = CW / N, sw = Math.max(1, Math.min(7, step * 0.5)), maxN = Math.max(1, ...Object.values(R.byDay).map(o => o.n));
  ctx.strokeStyle = L.faint; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(M, base + 0.5); ctx.lineTo(M + CW, base + 0.5); ctx.stroke();
  const hOf = n => 6 + (base - top - 6) * (n / maxN);
  ctx.fillStyle = L.ink;
  R.dayList.forEach((d, i) => { const o = R.byDay[d]; if (!o) return; const x = M + step * i + step / 2;
    ctx.globalAlpha = o.plan ? 0.35 : 1;
    if (o.n) { const h = hOf(o.n), hl = o.marks ? (h - 6) * o.marks / o.n + (o.marks === o.n ? 6 : 0) : 0; ctx.fillRect(x - sw / 2, base - h + hl, sw, h - hl); }
    else { ctx.beginPath(); ctx.arc(x, base - 3, Math.min(1.8, sw), 0, Math.PI * 2); ctx.fill(); } });
  ctx.globalAlpha = 1;
  inColor(ctx, L, () => { ctx.fillStyle = L.accent;
    R.dayList.forEach((d, i) => { const o = R.byDay[d]; if (!o || !o.marks) return; const x = M + step * i + step / 2, h = hOf(o.n);
      ctx.globalAlpha = o.plan ? 0.35 : 1; ctx.fillRect(x - sw / 2, base - h, sw, (h - 6) * o.marks / o.n + (o.marks === o.n ? 6 : 0)); }); });

  R.dayList.forEach((d, i) => { const dt = parseDate(d), x = M + step * i;
    if (dt.getMonth() !== lastM) {
      const label = N > 62 ? MON[dt.getMonth()] + (multiYear && dt.getMonth() === 0 ? ' ' + dt.getFullYear() : '') : MON[dt.getMonth()] + ' ' + dt.getDate();
      const w = ctx.measureText(label).width;

}

/** The whole range poster: top line, the style's drawing, title, day strip, own line, credits, grain. */
function drawRangePoster(canvas, R, p, ground, credits, style, opts = {}) {
  style = style || p.style;
  const [W, H] = POSTER_SIZES[p.size] || POSTER_SIZES.post;
  const L = POSTER_LOOKS[p.look] || POSTER_LOOKS.fog, story = p.size === 'story';
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const M = 76, CW = W - 2 * M;
  ctx.fillStyle = L.paper; ctx.fillRect(0, 0, W, H); ctx.textBaseline = 'alphabetic';
  const titleSize = story ? 104 : 92;
  ctx.font = `600 ${titleSize}px ${PF}`; setSpacing(ctx, -titleSize * 0.03);
  const titleLines = wrapText(ctx, R.title, CW).slice(0, 3); setSpacing(ctx, 0);
  const noteSize = story ? 30 : 27, noteLH = Math.round(noteSize * 1.42);
  ctx.font = `400 ${noteSize}px ${PF}`;
  const shown = opts.noCredits ? [] : (credits || []).filter(c => c.on).slice(0, story ? 8 : 6);
  const labelW = Math.min(360, Math.max(0, ...shown.map(c => ctx.measureText(c.label).width)) + 34);
  ctx.font = `500 ${noteSize}px ${PF}`;
  const rows = shown.map(c => ({ label: c.label, lines: wrapText(ctx, c.value, CW - labelW).slice(0, 2) }));
  const creditsH = rows.reduce((h, r) => h + r.lines.length * noteLH + 6, 0);
  const lineSize = noteSize + 4;
  ctx.font = `italic 400 ${lineSize}px ${PF}`;
  const ownLines = p.line && !opts.noCredits ? wrapText(ctx, p.line, Math.min(CW, 900)).slice(0, 3) : [];
  const strip = style !== 'calendar', stripH = 84;
  const bottomH = titleLines.length * titleSize + 26 + (strip ? stripH + 58 : 30) +
    (ownLines.length ? ownLines.length * Math.round(lineSize * 1.35) + (rows.length ? 22 : 0) : 0) + creditsH;
  const topY = M + 4;
  const body = { x: M, y: topY + 64, w: CW, h: H - M - bottomH - (topY + 64) - 44 };

  // top line: the dates left, how many trips right
  ctx.fillStyle = L.ink; ctx.font = `500 ${story ? 34 : 31}px ${PF}`; ctx.textAlign = 'left';
  const dates = longRange(R.from, R.to); ctx.fillText(dates, M, topY + 26);
  const dw = ctx.measureText(dates).width;
  ctx.font = `400 ${story ? 34 : 31}px ${PF}`; ctx.textAlign = 'right';
  let cl = R.countLine; if (ctx.measureText(cl).width + dw + 40 > CW) cl = cl.split(',')[0];
  if (ctx.measureText(cl).width + dw + 40 <= CW) ctx.fillText(cl, W - M, topY + 26);
  ctx.textAlign = 'left';

  if (!R.trips.length) {
    ctx.fillStyle = L.faint; ctx.font = `italic 400 30px ${PF}`; ctx.textAlign = 'center';
    ctx.fillText('No trips in these dates.', W / 2, body.y + body.h / 2); ctx.textAlign = 'left';
  } else if (style === 'map') {
    if (!drawRangeMap(ctx, R, p, ground, { x: M - 10, y: body.y, w: CW + 20, h: body.h }, L, story, W)) {
      ctx.fillStyle = L.faint; ctx.font = `italic 400 30px ${PF}`; ctx.textAlign = 'center';
      ctx.fillText('Nothing with a location yet.', W / 2, body.y + body.h / 2); ctx.textAlign = 'left';
    }
  } else if (style === 'numbers') drawRangeNumbers(ctx, R, body, L, story);
  else if (style === 'calendar') drawRangeCalendar(ctx, R, body, L, story);
  else if (style === 'sheet') drawRangeSheet(ctx, R, body, L, story);
  else if (style === 'tracks') drawTracklist(ctx, R, body, L, story, true);

  // title
  let y = H - M - bottomH + titleSize * 0.82;
  ctx.fillStyle = L.ink; ctx.font = `600 ${titleSize}px ${PF}`; setSpacing(ctx, -titleSize * 0.03);
  titleLines.forEach((ln, i) => ctx.fillText(ln, M - 4, y + i * titleSize));
  setSpacing(ctx, 0);
  y += (titleLines.length - 1) * titleSize + 26;
  if (strip) { drawRangeStrip(ctx, R, L, M, CW, y + 6, y + stripH - 26, W); y += stripH + 58; } else y += 30;
  ctx.fillStyle = L.ink;
  if (ownLines.length) {
    ctx.font = `italic 400 ${lineSize}px ${PF}`;
    ownLines.forEach((ln, i) => ctx.fillText(ln, M, y + i * Math.round(lineSize * 1.35)));
    y += ownLines.length * Math.round(lineSize * 1.35) + 22;
  }
  rows.forEach(r => {
    ctx.globalAlpha = 0.62; ctx.font = `400 ${noteSize}px ${PF}`; ctx.fillText(r.label, M, y);
    ctx.globalAlpha = 1; ctx.font = `500 ${noteSize}px ${PF}`;
    r.lines.forEach((ln, i) => ctx.fillText(ln, M + labelW, y + i * noteLH));
    y += r.lines.length * noteLH + 6;
  });

}

/* ---- ground fetching shared by the range screen ---- */
function fetchGroundInto(ground, framePts, pref, onDone, skipCountryNames, size) {
  if (pref === 'none' || !framePts.length) return;
  const want = ground._want ||= new Set();
  if (!ground.world && !want.has('world')) { want.add('world'); loadWorld().then(w => { if (w) { ground.world = w; onDone(); } else want.delete('world'); }); }
  const scale = groundScale(framePts);
  if (scale === 'country' && skipCountryNames) return;
  const roads = pref === 'roads', box = groundBox(framePts, size), key = JSON.stringify([box, scale, roads]);
  if (ground.osmKey !== key && !want.has(key)) {
    want.add(key);
    loadOSM(box, scale, roads).then(o => { want.delete(key); if (o) { Object.assign(ground, { osm: o, osmScale: scale, osmKey: key, osmBox: box }); onDone(); } });
  }
}
const slugName = s => String(s || 'poster').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'poster';
async function shareFiles(files) {
  if (!files.length) return toast('Couldn’t make the images');
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  files.forEach((f, i) => setTimeout(() => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, i * 400));
  toast(files.length === 1 ? 'Saved ' + files[0].name : `Saved ${files.length} images`);
}

function somedayView() {
  const its = itemsFor('').filter(i => !i.parent_id);
  const groups = {};
  its.forEach(i => {
    const country = i.country || (i.kind === 'idea' ? 'Ideas' : 'Elsewhere');
    const city = i.city || i.region || '';
    (groups[country] ||= {});
    (groups[country][city] ||= []).push(i);
  });
  const countries = Object.keys(groups).sort((a, b) => (a === 'Ideas') - (b === 'Ideas') || a.localeCompare(b));
  let body = countries.map(c => {
    const cities = Object.keys(groups[c]).sort();
    const total = cities.reduce((n, k) => n + groups[c][k].length, 0);
    return `<div class="section-title">${esc(c)} <span class="count">${total}</span></div>` +
      cities.map(city => (city ? `<div class="daylabel">${esc(city)}</div>` : '') + groups[c][city].map(i => itemCard(i, false)).join('')).join('');
  }).join('');
  if (!body) body = `<div class="empty"><div class="big">Someday is empty</div>Places you save without a trip land here, filed by city. When you start a trip there, they’ll be waiting.</div>`;
  return `<header class="top"><h1>Someday</h1>${syncBadge()}<button class="iconbtn" data-act="settings" aria-label="Settings">${I.gear}</button></header><main>${body}</main>`;

/** A gentle curve between two points, for flights */
function flightArc(a, b) {
  const [y1, x1] = a, [y2, x2] = b;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
  const cx = mx - dy * 0.22, cy = my + dx * 0.22 * (dx >= 0 ? 1 : -1) * (dx >= 0 ? 1 : 1);
  const pts = [];
  for (let k = 0; k <= 32; k++) { const u = k / 32, v = 1 - u; pts.push([v * v * y1 + 2 * v * u * cy + u * u * y2, v * v * x1 + 2 * v * u * cx + u * u * x2]); }
  return pts;
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#b9532c'; }

function drawMap(t, layer) {
  const pts = [];

  const note = $('#map-note');

  const addDot = (o, color, kind = 'item') => {
    if (!hasCoords(o)) return;
    const ll = [+o.lat, +o.lng]; pts.push(ll);
    const radius = o.priority === 'must' ? 11 : o.priority === 'maybe' ? 6 : 8;
    L.circleMarker(ll, { radius, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).bindPopup(popup(o, kind)).addTo(layer);
  };
  const addNum = (o, n, color, kind = 'item') => {
    if (!hasCoords(o)) return;
    const ll = [+o.lat, +o.lng]; pts.push(ll);
    L.marker(ll, { icon: pinNum(n, color) }).bindPopup(popup(o, kind)).addTo(layer);
  };
  const addHome = o => {
    if (!o || !hasCoords(o)) return;
    const ll = [+o.lat, +o.lng]; pts.push(ll);
    L.marker(ll, { icon: pinHome(), zIndexOffset: -100 }).bindPopup(popup(o, 'item')).addTo(layer);
  };
  const drawLegs = (seq, color, fixedMode) => {
    const located = seq.filter(hasCoords);
    const legs = [];
    for (let k = 1; k < located.length; k++) {
      const a = located[k - 1], b = located[k];
      legs.push({ from: [+a.lat, +a.lng], to: [+b.lat, +b.lng], mode: fixedMode || b.mode || guessMode(a, b) });
    }
    if (!legs.length) return;
    const straight = legs.map(l => L.polyline([l.from, l.to], { color, weight: 3, opacity: .7, dashArray: '6 8' }).addTo(layer));
    getRoutes(legs).then(res => {
      if (!map || !map.hasLayer(layer)) return;
      res.forEach((pl, k) => {
        if (!pl) return;
        layer.removeLayer(straight[k]);
        L.polyline(decodePolyline(pl), { color, weight: 4, opacity: .85 }).addTo(layer);
      });
      if (res.some(r => !r)) say(ui.noRoutes && !(cfg && cfg.demo) ? 'Dashed lines are straight-line. Turn on the Routes API for real paths.' : '');
    });
  };

  const seenAirports = {};
  const drawFlights = (list, target, day) => {
    list.forEach(f => {
      // On an arrival day, frame only where you land; on a departure day, frame the whole hop
      const arrivalOnly = day && f.day !== day && f.end_day === day;
      let a = num(f.from_lat) !== null ? [+f.from_lat, +f.from_lng] : null;
      let b = num(f.to_lat) !== null ? [+f.to_lat, +f.to_lng] : null;
      if (a && seenAirports[f.from_code]) a = seenAirports[f.from_code];
      // Cross the date line the short way. The end nearer the trip stays put; the far end moves to the same side of the map.
      if (a && b && Math.abs(b[1] - a[1]) > 180) {
        const keepB = Math.abs(b[1] - tripLng) <= Math.abs(a[1] - tripLng);
        if (keepB) a = [a[0], a[1] + (b[1] > a[1] ? 360 : -360)];
        else b = [b[0], b[1] + (a[1] > b[1] ? 360 : -360)];
      }
      [[a, f.from_code, f.from_name], [b, f.to_code, f.to_name]].forEach(([ll, code, name]) => {
        if (!ll || seenAirports[code]) return; seenAirports[code] = ll;
        if (!(arrivalOnly && code === f.from_code)) target.push(ll);
        L.marker(ll, { icon: L.divIcon({ className: 'ap-pin', html: `<span>${esc(code)}</span>`, iconSize: [44, 24], iconAnchor: [22, 12] }) })
          .bindPopup(`<b>${esc(name || code)}</b>`).addTo(layer);
      });
      if (a && b) {
        L.polyline(flightArc(a, b), { color: C.fixed, weight: 2.5, opacity: .8, dashArray: '2 7', lineCap: 'round' }).addTo(layer);
      }
    });
  };
  drawMap._flightPts = [];
  const located = itemsFor(t.id).filter(i => hasCoords(i) && !isFlight(i));
  const tripLng = located.length ? located.reduce((n, i) => n + +i.lng, 0) / located.length : 0;

  const chOn = activeChapter(t), chStays = chOn ? chapterStays(chOn) : null;
  const items = chOn ? itemsFor(t.id).filter(i => inChapter(i, chOn, chStays)) : itemsFor(t.id);
  const d = ui.mapDay;
  if (d === 'all' || d === 'unplanned') {
    if (d === 'all') drawFlights(items.filter(i => isFlight(i) && !i.parent_id), drawMap._flightPts);
    items.forEach(i => {
      if (d === 'unplanned' && (i.day || i.kind === 'fixed' || i.parent_id)) return;
      if (isSuggestion(i)) return; // not on the map until kept
      if (i.kind === 'fixed' && isStay(i)) return addHome(i);
      if (isFlight(i)) return;
      const parent = i.parent_id && itemById(i.parent_id);
      addDot(i, parent ? C.tour : i.status === 'done' ? C.found : (C[i.kind] || C.place));
    });
    const missing = items.filter(i => !hasCoords(i) && i.kind !== 'idea' && !isFlight(i) && !isSuggestion(i)).length;
    say(missing ? `${missing} saved ${missing === 1 ? 'item has' : 'items have'} no location yet.` : '');
    return pts;
  }

  const home = stayForMorning(t.id, d);
  addHome(home);
  drawFlights(items.filter(i => isFlight(i) && !i.parent_id && (i.day === d || i.end_day === d)), pts, d);
  const nightStay = stayForNight(t.id, d);
  if (nightStay && nightStay !== home) addHome(nightStay);

  if (ui.mapLayer === 'lived') {
    const seq = flatLogs(t.id, d);
    seq.forEach((l, k) => addNum(l, k + 1, l.parent_id ? C.tour : l.origin === 'found' ? C.found : C.place, 'log'));
    drawLegs(home ? [home, ...seq] : seq, C.found);
    say(seq.length ? '' : 'Nothing logged this day yet.');
    return pts;
  }

  // Plan: fixed events, tours, planned stops
  fixedEvents(t.id, d).forEach(e => {
    if (isStay(e.i) || isFlight(e.i)) return;
    if (isTour(e.i) && e.start) {
      const kids = childrenOf(e.i.id);
      addDot(e.i, C.tour);
      kids.forEach((s, k) => addNum(s, k + 1, C.tour));
      drawLegs([e.i, ...kids], C.tour, 'tour');
    } else addDot(e.i, C.fixed);
  });
  const stops = plannedStops(t.id, d);
  stops.forEach((s, k) => addNum(s, k + 1, s.kind === 'idea' ? C.idea : C.place));
  drawLegs(home ? [home, ...stops] : stops, C.place);
  const unlocated = stops.filter(s => !hasCoords(s)).length;
  say(!stops.length && !fixedEvents(t.id, d).length ? 'Nothing planned this day yet.' : unlocated ? `${unlocated} planned ${unlocated === 1 ? 'stop has' : 'stops have'} no location.` : '');
  return pts;
}

function listForKey(key) {
  const r = route(); const tid = r.id;
  const [kind, val] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
  if (kind === 'day') return { sheet: 'Items', list: plannedStops(tid, val) };
  if (kind === 'tour') return { sheet: 'Items', list: childrenOf(val) };
  if (kind === 'log') return { sheet: 'Log', list: topLogs(tid, val) };
  return { sheet: 'Items', list: [] };
}
function moveIn(key, id, dir) {
  const { sheet, list } = listForKey(key);
  const ids = list.map(x => x.id);
  const k = ids.indexOf(id), j = dir === 'up' ? k - 1 : k + 1;
  if (k < 0 || j < 0 || j >= ids.length) return;
  [ids[k], ids[j]] = [ids[j], ids[k]];
  queue('reorder', { sheet, ids, key }, () => {
    const src = sheet === 'Log' ? db.log : db.items;
    ids.forEach((x, n) => { const o = src.find(y => y.id === x); if (o) o.seq = String(n); });
  });
}

async function refreshAll(tripId, btn) {
  if (!navigator.onLine) return toast('Needs a connection');
  btn.disabled = true;
  let total = 0;
  try {
    for (let n = 0; n < 40; n++) {
      btn.textContent = `Updating… ${total} done`;
      const res = await api('refreshAll', { trip: tripId });
      (res.updated || []).forEach(o => { const k = db.items.findIndex(x => x.id === o.id); if (k >= 0) db.items[k] = o; });
      total += (res.updated || []).length;
      saveLocal();
      if (!res.remaining || !(res.updated || []).length) break;
    }
    toast(`Updated ${total} place${total === 1 ? '' : 's'}`);
  } catch (e) { toast('Couldn’t finish: ' + e.message); }
  render();
}

function tripOptions(selected) {
  const today = todayStr();
  const trips = [...db.trips].sort((a, b) => {
    const pa = a.end && a.end < today, pb = b.end && b.end < today;
    return pa - pb || String(a.start || '9999').localeCompare(String(b.start || '9999'));
  });
  return `<option value="">Someday (no trip yet)</option>` +
    trips.map(t => `<option value="${esc(t.id)}" ${t.id === selected ? 'selected' : ''}>${esc(t.name)}${t.start ? ' · ' + esc(fmtRange(t.start, t.end)) : ''}</option>`).join('');
}
function dayOptions(t, selected, blankLabel = 'No day yet') {
  const days = t ? tripDays(t) : [];
  if (selected && !days.includes(selected)) days.push(selected);
  return `<option value="">${blankLabel}</option>` + days.sort().map(d => `<option value="${d}" ${d === selected ? 'selected' : ''}>${esc(fmtDay(d))}</option>`).join('');
}
function linkTitle(text) { return text.split('\n').find(l => l.trim() && !isUrl(l)) || 'Saved place'; }

  let hours = null;
  try { hours = i.hours ? JSON.parse(i.hours) : null; } catch (e) {}
  const refDay = i.day ? parseDate(i.day).getDay() : new Date().getDay();
  const hoursHtml = hours && hours.weekday && hours.weekday.length
    ? `<ul class="hours">${hours.weekday.map(w => `<li class="${w.startsWith(DOW_LONG[refDay]) ? 'today' : ''}">${esc(w)}</li>`).join('')}</ul>` : '';

  const restStatus = i.status === 'answered' || sugs.length ? 'answered' : 'open'; // what "off" goes back to
  const reply = ((i.notes || '').match(/(?:^|\n)Claude: ([\s\S]+)$/) || [])[1];  // Claude's answer, appended to the notes
  const askText = s => s === 'ask' ? 'Claude will look into this next time you say “check my asks.”'
    : s === 'answered' ? (reply ? `Claude: ${reply.trim()}` : 'Claude answered — suggestions are below.') + ' Turn on to ask again.'
    : 'Want real options? Turn on, then say “check my asks” to Claude.';

}

/* ---------- Add places to a day ---------- */
function openAddToDay(tripId, d) {
  const t = tripById(tripId); if (!t) return;
  const dow = parseDate(d).getDay();
  const base = stayForNight(tripId, d) || stayForMorning(tripId, d);
  const cands = topItemsFor(tripId).filter(i => i.kind !== 'fixed' && !i.day).map(i => ({
    i, open: openOn(i, dow), dist: base && hasCoords(base) && hasCoords(i) ? meters(base, i) : null,
  })).sort((a, b) => (a.open === false) - (b.open === false) || prioRank(a.i) - prioRank(b.i) || (a.dist ?? 1e9) - (b.dist ?? 1e9) || a.i.title.localeCompare(b.i.title));
  openSheet(`
    <h3>Plan ${esc(fmtDay(d))}</h3>
    ${cands.length ? `<p class="hint" style="margin:-6px 2px 10px">${base && hasCoords(base) ? 'Closest to ' + esc(base.title) + ' first.' : 'Your saved places without a day.'}</p>
    <div>${cands.map(c => `<label class="check"><input type="checkbox" value="${esc(c.i.id)}"><span>${prioBadge(c.i)}${esc(c.i.title)}<small>${[esc(placeLine(c.i)), c.dist != null ? fmtDist(c.dist) + ' away' : '', c.open === false ? `<span class="warn">Closed ${DOW[dow]}</span>` : esc(hoursOn(c.i, dow))].filter(Boolean).join(' · ')}</small></span></label>`).join('')}</div>
    <div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="ad-cancel">Cancel</button><button class="btn" id="ad-go">Add to day</button></div>`
    : `<div class="empty">Every saved place already has a day. Tap + to save more.</div>`}
  `, sh => {
    const c = $('#ad-cancel', sh); if (c) c.onclick = () => closeSheet();
    const g = $('#ad-go', sh);
    if (g) g.onclick = () => {
      const ids = $$('input:checked', sh).map(x => x.value);
      let n = plannedStops(tripId, d).length;
      ids.forEach(id => {
        const it = itemById(id), seq = String(n++);
        queue('updateItem', { id, patch: { day: d, seq } }, () => { it.day = d; it.seq = seq; });
      });
      closeSheet();
      if (ids.length) toast(`Added ${ids.length} to ${fmtDay(d, false)}`);
    };
  });
}

/* ---------- Travelogue: I'm here ---------- */
/* ---------- Kept with a stop: photos, sounds, souvenirs ----------
 * Files wait on the phone (IndexedDB) until they're sent, and stay there as a cache.
 * In the Sheet they're rows in Artifacts; the files themselves live privately in Drive (Travel Hub / <trip>). */
const ARTIFACT_OPS = ['upload', 'updateArtifact', 'deleteArtifact'];
const MAX_PHOTOS = 4, MAX_SOUND_S = 60;
const blobs = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('travelhub-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(d => new Promise((res, rej) => {
    const tx = d.transaction('files', mode), q = fn(tx.objectStore('files'));
    tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error);
  })).catch(() => null);
  return { get: k => run('readonly', s => s.get(k)), put: (k, v) => run('readwrite', s => s.put(v, k)), del: k => run('readwrite', s => s.delete(k)) };
})();
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(b); });
const b64ToBlob = (b64, mime) => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime || '' }); };
const artifactRow = p => ({ id: p.id, log_id: p.log_id, trip_id: p.trip || '', kind: p.kind, title: p.title || '', note: p.note || '',
  file_id: p.hasFile ? 'pending' : '', mime: p.mime || '', duration: p.duration || '', seq: p.seq != null ? String(p.seq) : '', _pending: true });
const artifactsOf = (logId, kind) => db.artifacts.filter(a => a.log_id === logId && (!kind || a.kind === kind))
  .sort((a, b) => (+a.seq || 0) - (+b.seq || 0));

/** An object URL for a kept file: from the phone if it's there, else fetched privately through the script. */
const artURLs = new Map();
function artURL(a) {
  if (artURLs.has(a.id)) return artURLs.get(a.id);
  const pr = (async () => {
    let b = await blobs.get(a.id);
    if (!b && a.file_id && a.file_id !== 'pending' && navigator.onLine) {
      try { const r = await api('file', { id: a.id }); if (r && r.b64) { b = b64ToBlob(r.b64, r.mime || a.mime); blobs.put(a.id, b); } } catch (e) {}
    }
    if (!b) { artURLs.delete(a.id); return null; }
    return URL.createObjectURL(b);
  })();
  artURLs.set(a.id, pr);
  return pr;
}
/* Any <img data-art> or <audio data-art> that appears gets its file. */
function hydrateArt(root) {
  $$('[data-art]:not([data-art-done])', root).forEach(el => {
    el.setAttribute('data-art-done', '1');
    const a = db.artifacts.find(x => x.id === el.dataset.art) || (el._art);
    if (!a) return;
    artURL(a).then(u => { if (u) el.src = u; else el.classList.add('art-missing'); });
  });
}
new MutationObserver(() => hydrateArt(document)).observe(document.documentElement, { childList: true, subtree: true });

/** Phone photo → JPEG no wider than 1600 px (a few hundred KB). */
async function shrinkImage(file, max = 1600) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.82));
  } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
}

/** Keep something with a logged stop (the stop may still be on its way to the Sheet — it goes first). */
async function keepArtifact(log, kind, { blob, mime, title = '', note = '', duration = '' } = {}) {
  const id = uid('ar');
  const seq = artifactsOf(log.id, kind).length;
  if (blob) await blobs.put(id, blob);
  const payload = { id, log_id: log.id, trip: log.trip_id || log.trip || '', kind, title, note, mime: blob ? (mime || blob.type) : '', duration, seq, hasFile: !!blob };
  queue('upload', payload, () => { db.artifacts.push(artifactRow(payload)); });
  return id;
}
function dropArtifact(a) {
  queue('deleteArtifact', { id: a.id }, () => { db.artifacts = db.artifacts.filter(x => x.id !== a.id); });
  // a save still waiting to go out never needs to go
  outbox = outbox.filter(o => !(o !== inFlight && o.action === 'upload' && o.payload.id === a.id));
  parked = parked.filter(o => !(o.action === 'upload' && o.payload.id === a.id));
  blobs.del(a.id); artURLs.delete(a.id); saveLocal();
}

/** Pick photos (camera or library on iPhone). Resolves to shrunk blobs. */
function pickPhotos(limit) {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = limit > 1;
    inp.onchange = async () => { const fs = [...(inp.files || [])].slice(0, limit); res(await Promise.all(fs.map(f => shrinkImage(f)))); };
    inp.click();
  });
}

/** A record button: tap to start, tap to stop (stops by itself at a minute). onDone(blob, seconds). */
function soundButton(btn, onDone) {
  let rec = null, chunks = [], t0 = 0, tick = null, stream = null;
  const label = btn.innerHTML;
  const stop = () => { if (rec && rec.state !== 'inactive') rec.stop(); };
  btn.onclick = async () => {
    if (rec) return stop();
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('This phone can’t record here'); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { toast('Microphone is off — allow it in Settings to record'); return; }
    const type = ['audio/mp4', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined); chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      clearInterval(tick); stream.getTracks().forEach(t => t.stop());
      const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
      const blob = new Blob(chunks, { type: rec.mimeType || type || 'audio/mp4' });
      rec = null; btn.classList.remove('rec'); btn.innerHTML = label;
      if (blob.size) onDone(blob, secs);
    };
    rec.start(); t0 = Date.now(); btn.classList.add('rec');
    const show = () => { const s = Math.round((Date.now() - t0) / 1000); btn.innerHTML = `● Stop · 0:${String(s).padStart(2, '0')}`; if (s >= MAX_SOUND_S) stop(); };
    show(); tick = setInterval(show, 500);
  };
  return { stop };
}
const fmtSecs = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '';

/** Full-screen look at a photo, with Remove. */
function viewPhoto(a, onRemove) {
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img data-art="${esc(a.id)}" alt=""><div class="viewer-bar"><button class="btn ghost small" data-x>Close</button>${onRemove ? `<button class="btn danger small" data-rm>Remove</button>` : ''}</div>`;
  document.body.append(v);
  v.onclick = e => { if (e.target === v || e.target.closest('[data-x]')) v.remove(); };
  const rm = $('[data-rm]', v); if (rm) rm.onclick = () => { v.remove(); onRemove(); };
}

/** The "Kept" block inside a log entry: photos, sounds, brought home. Saves as you go. */
function keptBlock(l) {
  const photos = artifactsOf(l.id, 'photo'), sounds = artifactsOf(l.id, 'sound'), souvs = artifactsOf(l.id, 'souvenir');
  return `

}
function bindKept(box, l, rerender) {
  const find = id => db.artifacts.find(a => a.id === id);
  $$('[data-ph]', box).forEach(b => b.onclick = () => { const a = find(b.dataset.ph); if (a) viewPhoto(a, () => { dropArtifact(a); rerender(); }); });
  const add = $('[data-addph]', box);
  if (add) add.onclick = async () => {
    const left = MAX_PHOTOS - artifactsOf(l.id, 'photo').length;
    const shots = await pickPhotos(left);
    for (const b of shots) await keepArtifact(l, 'photo', { blob: b, mime: 'image/jpeg' });
    if (shots.length) { toast(shots.length === 1 ? 'Photo kept' : shots.length + ' photos kept'); rerender(); }
  };
  $$('[data-rmart]', box).forEach(b => b.onclick = () => { const a = find(b.dataset.rmart); if (!a) return; dropArtifact(a); rerender(); });
  soundButton($('[data-rec]', box), async (blob, secs) => { await keepArtifact(l, 'sound', { blob, duration: secs }); toast('Sound kept'); rerender(); });
  const form = $('.souv-form', box); let souvBlob = null;
  $('[data-addsouv]', box).onclick = () => { form.hidden = !form.hidden; if (!form.hidden) $('[data-souvname]', form).focus(); };
  $('[data-souvph]', form).onclick = async () => { const [b] = await pickPhotos(1); if (b) { souvBlob = b; $('[data-souvphn]', form).textContent = 'Photo added'; } };
  $('[data-souvsave]', form).onclick = async () => {

    toast('Kept: ' + name); rerender();
  };
}

/** Name a spot by its street, else its neighbourhood, else the town (OpenStreetMap). Null when offline. */
async function hereName(p) {
  if (cfg && cfg.demo) return { title: 'Nakamise-dōri', city: 'Tokyo' };
  if (!navigator.onLine) return null;
  try {
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 6000);
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=en&lat=${p.lat.toFixed(5)}&lon=${p.lng.toFixed(5)}`, { signal: ac.signal });
    clearTimeout(tm);
    if (!res.ok) return null;
    const a = (await res.json()).address || {};
    const city = a.city || a.town || a.village || a.municipality || '';
    const title = a.road || a.pedestrian || a.footway || a.path || a.square || a.neighbourhood || a.quarter || a.suburb || city;
    return title ? { title, city } : null;
  } catch (e) { return null; }
}

/* ---------- Travelogue: I'm here ---------- */
function openHere(tripId, d) {
  const t = tripById(tripId); if (!t) return;
  const now = tzNow(t.timezone);
  const isToday = d === now.day;
  const logged = new Set(db.log.filter(l => l.trip_id === tripId).map(l => l.item_id).filter(Boolean));
  const dayPlan = plannedStops(tripId, d).concat(fixedEvents(tripId, d).filter(e => e.start).map(e => e.i)).filter(i => !logged.has(i.id));
  const others = topItemsFor(tripId).filter(i => i.kind !== 'fixed' && !logged.has(i.id) && i.day !== d);
  const tours = topLogs(tripId, d).filter(l => { const it = l.item_id && itemById(l.item_id); return it && isTour(it); });
  const prev = topLogs(tripId, d).slice(-1)[0];

    ${navigator.geolocation && isToday ? `<div class="hint here-status" id="h-where">Finding you…</div><div id="h-around"></div><div id="h-pin"></div>` : ''}

      <div class="field"><label>Got here by</label><select id="h-mode">${MODES.map(([k, l]) => `<option value="${k}" ${k === (prev && prev.mode) ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

    <div class="field"><label>Note</label><input id="h-note" placeholder="What it was like, what you ordered…"></div>

    <button class="btn" id="h-save">Log it</button>

      $$('[data-k]', box).forEach(b => b.onclick = () => { keep.splice(+b.dataset.k, 1); drawKeep(); toast('Removed'); });

    };
    soundButton($('#h-rec', sh), (blob, secs) => { keep.push({ kind: 'sound', blob, duration: secs }); drawKeep(); });
    const bindPicks = () => $$('[data-pick]', sh).forEach(el => el.onclick = () => {

    ta.oninput = () => { if (ta.value.trim()) { picked = null; $$('[data-pick]', sh).forEach(x => x.classList.remove('on')); } };
    $('#h-now', sh).onclick = () => { $('#h-time', sh).value = tzNow(t.timezone).time; };
    // Where am I? Ask once, then sort the list, preselect what you're standing at, and show what's around you.
    const clearPicks = () => { picked = null; near = null; pin = null; $$('[data-pick], [data-near], [data-pin]', sh).forEach(x => x.classList.remove('on')); };
    // "Just this spot": a pin where you're standing, named by its street (or neighbourhood). Rename it later from the Log.
    let pinPlace = null;
    const showPin = () => {
      const box = $('#h-pin', sh); if (!box || !pos) return;
      pinPlace = { title: 'Dropped pin', lat: pos.lat, lng: pos.lng, city: '' };
      box.innerHTML = `<div class="pick" data-pin="1"><span class="num hollow" style="--c:var(--found)">•</span><div class="body"><div class="title">Just this spot</div><div class="meta" id="h-pin-name">Finding the street…</div></div></div>`;
      const el = $('[data-pin]', box);
      el.onclick = () => { const on = !el.classList.contains('on'); clearPicks(); if (on) { el.classList.add('on'); pin = pinPlace; ta.value = ''; } };

      });
    };
    const where = $('#h-where', sh);
    const showAround = list => {
      const seen = [];   // same name within 50 m = the same place listed twice
      nearList = (list || []).filter(n => !dayPlan.concat(others).some(i => i.place_id && i.place_id === n.place_id))
        .filter(n => { const k = String(n.title || '').trim().toLowerCase(); if (seen.some(o => o.k === k && meters(o.n, n) < 50)) return false; seen.push({ k, n }); return true; })
        .slice(0, 5);
      const box = $('#h-around', sh); if (!box || !nearList.length) return;
      box.innerHTML = `<h4 style="margin-top:4px">Around you</h4>` + nearList.map((n, k) => `<div class="pick" data-near="${k}"><span class="num hollow" style="--c:var(--found)">•</span><div class="body"><div class="title">${esc(n.title)}</div><div class="meta">${esc([n.category, n.dist != null ? fmtDist(n.dist) + ' away' : ''].filter(Boolean).join(' · '))}</div></div></div>`).join('');

      });
    };
    if (where) navigator.geolocation.getCurrentPosition(p => {
      pos = { lat: p.coords.latitude, lng: p.coords.longitude };
      let best = null;
      ['#h-plan', '#h-others'].forEach(sel => {
        const box = $(sel, sh); if (!box) return;
        const rows = $$('[data-pick]', box).map(el => ({ el, it: itemById(el.dataset.pick) }));
        rows.forEach(r => { r.d = hasCoords(r.it) ? meters(pos, r.it) : 1e9; const m = $('[data-dist]', r.el); if (m && r.d < 1e9) m.textContent = [placeLine(r.it), fmtDist(r.d) + ' away'].filter(Boolean).join(' · '); });
        rows.sort((a, b) => a.d - b.d).forEach(r => box.appendChild(r.el));
        const limit = sel === '#h-plan' ? 150 : 75;   // a planned stop can be a bit further off than a saved one
        if (rows[0] && rows[0].d < limit && (!best || rows[0].d < best.d)) best = { ...rows[0], sel };
      });
      if (best && !picked && !near && !ta.value.trim()) {
        if (best.sel === '#h-others') { const det = $('details', sh); if (det) det.open = true; }
        best.el.click();
        where.textContent = `You’re at ${best.it.title}, by the look of it.`;
      } else where.textContent = 'Sorted by distance from you.';
      showPin();
      if (navigator.onLine && (db.places || (cfg && cfg.demo))) {
        // Start tight (you're probably inside the place), widen until something turns up.
        (async () => {
          let list = [];
          for (const radius of [80, 300, 1500]) {
            try { list = await api('nearby', { lat: pos.lat, lng: pos.lng, radius }); }
            catch (e) { if (document.body.contains(sh)) where.textContent = 'Couldn’t look up places around you: ' + (e.message || e); return; }
            if (!document.body.contains(sh)) return;
            if ((list || []).length >= 3) break;
          }
          if (list && list.length) showAround(list);
          else where.textContent = 'Sorted by distance from you. Google has nothing listed close by.';
        })();
      } else if (navigator.onLine) where.textContent = 'Sorted by distance from you. Place lookup is off (Settings shows why).';

    }, () => { where.textContent = 'Location is off, so the list isn’t sorted by distance.'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
    $$('[data-pick]', sh).forEach(el => el.addEventListener('click', () => { near = null; pin = null; $$('[data-near], [data-pin]', sh).forEach(x => x.classList.remove('on')); }));
    ta.addEventListener('input', () => { if (ta.value.trim()) clearPicks(); });
    const hp = $('#h-paste', sh);
    if (hp) hp.onclick = async () => { try { ta.value = (await navigator.clipboard.readText()).trim(); if (ta.value) clearPicks(); } catch (e) { toast('Long-press the box to paste'); } };
    $('#h-save', sh).onclick = () => {
      const text = ta.value.trim();
      if (!picked && !near && !pin && !text) { ta.focus(); return; }
      const parentSel = $('#h-parent', sh);
      const parent_id = parentSel ? parentSel.value : '';
      const it = picked ? itemById(picked) : null;
      const seq = parent_id ? logKids(parent_id).length : topLogs(tripId, d).length;
      const mode = $('#h-mode', sh).value;
      // Logged on the spot? Then the time is real: fill it in unless you typed one.
      let time = $('#h-time', sh).value;
      const spot = it && hasCoords(it) ? it : near ? near : pin ? pin : (!it && !isMapsUrl(text) ? pos : null);
      if (!time && isToday && pos && spot && meters(pos, spot) < 300) time = tzNow(t.timezone).time;
      const payload = { id: uid('lg'), trip: tripId, day: d, seq, time, mode: seq || parent_id ? mode : '',
        parent_id, note: $('#h-note', sh).value.trim(), timezone: t.timezone || '', item_id: it ? it.id : undefined, text: it || near || pin ? undefined : text,
        logged_at: new Date().toISOString() };
      if (pos && isToday) { payload.here_lat = pos.lat; payload.here_lng = pos.lng; }
      const local = { id: payload.id, trip_id: tripId, day: d, seq: String(seq), time: payload.time, mode: payload.mode, parent_id, note: payload.note,
        item_id: it ? it.id : '', title: it ? it.title : near ? near.title : pin ? pin.title : (isUrl(text) ? linkTitle(text) : text), origin: it ? 'planned' : (isMapsUrl(text) ? '' : 'found'),
        lat: it ? it.lat : near ? near.lat : pin ? pin.lat : (pos && !isMapsUrl(text) ? pos.lat : ''), lng: it ? it.lng : near ? near.lng : pin ? pin.lng : (pos && !isMapsUrl(text) ? pos.lng : ''),
        here_lat: payload.here_lat || '', here_lng: payload.here_lng || '',
        city: it ? it.city : near ? near.city : pin ? pin.city : '', place_id: near ? near.place_id : '', logged_at: payload.logged_at, _pending: !it && !near && isMapsUrl(text) };
      if (near) { Object.assign(payload, { place_id: near.place_id, title: near.title, lat: near.lat, lng: near.lng, address: near.address, city: near.city, maps_url: near.maps_url, category: near.category || '' }); local.category = near.category || ''; }
      else if (pin) Object.assign(payload, { title: pin.title, lat: pin.lat, lng: pin.lng, city: pin.city });
      // a typed name (no link) at your current spot keeps your location
      else if (!it && !isMapsUrl(text) && pos) { payload.title = text; payload.lat = pos.lat; payload.lng = pos.lng; }
      queue('addLog', payload, () => { db.log.push(local); if (it) it.status = 'done'; });
      keep.forEach(k => keepArtifact(local, k.kind, { blob: k.blob, mime: k.kind === 'photo' ? 'image/jpeg' : k.blob.type, duration: k.duration || '' }));
      // logging a planned tour also logs its stops (delete any you skipped)
      if (it && isTour(it)) {
        childrenOf(it.id).forEach((c, k) => {
          const p2 = { id: uid('lg'), trip: tripId, day: d, seq: k, parent_id: payload.id, mode: 'tour', item_id: c.id, timezone: t.timezone || '' };
          queue('addLog', p2, () => { db.log.push({ id: p2.id, trip_id: tripId, day: d, seq: String(k), parent_id: payload.id, mode: 'tour', item_id: c.id, title: c.title, origin: 'planned', lat: c.lat, lng: c.lng }); c.status = 'done'; });
        });
      }
      closeSheet();
      toast('Logged ' + local.title);
    };
  });
}

/* ---------- Travelogue: one entry ---------- */
/* ---------- "Not here?": swap a logged stop for the right place nearby ---------- */
/** Where to look around: where the phone was when it was logged, else the stop's own position. */
function notHereCenter(l) {
  if (num(l.here_lat) !== null && num(l.here_lng) !== null) return { lat: +l.here_lat, lng: +l.here_lng };
  return hasCoords(l) ? { lat: +l.lat, lng: +l.lng } : null;
}
async function pickRightPlace(l, box) {
  const c = notHereCenter(l); if (!c || !box) return;
  // your own saved places close by come first
  const saved = topItemsFor(l.trip_id).filter(i => i.kind !== 'fixed' && hasCoords(i) && i.id !== l.item_id)
    .map(i => ({ i, d: meters(c, i) })).filter(x => x.d < 150).sort((a, b) => a.d - b.d).slice(0, 4);
  const row = (key, title, meta, color, hollow) => `<div class="pick" data-swap="${esc(key)}"><span class="num ${hollow ? 'hollow' : ''}" style="--c:${color}">•</span><div class="body"><div class="title">${esc(title)}</div><div class="meta">${esc(meta)}</div></div></div>`;
  let near = [];
  const draw = status => {
    box.innerHTML = (saved.length ? `<h4 style="margin-top:4px">Saved places close by</h4>` + saved.map((x, k) => row('s' + k, x.i.title, [x.i.category, Math.round(x.d) + ' m'].filter(Boolean).join(' · '), 'var(--place)')).join('') : '')
      + (near.length ? `<h4 style="margin-top:4px">Around where you were</h4>` + near.map((n, k) => row('n' + k, n.title, [n.category, n.dist != null ? n.dist + ' m' : ''].filter(Boolean).join(' · '), 'var(--found)', true)).join('') : '')
      + (status ? `<div class="hint here-status">${esc(status)}</div>` : '');
    $$('[data-swap]', box).forEach(el => el.onclick = () => {
      const k = el.dataset.swap, pick = k[0] === 's' ? { item: saved[+k.slice(1)].i } : { place: near[+k.slice(1)] };
      swapLogPlace(l, pick);
    });
  };
  if (!navigator.onLine || !(db.places || (cfg && cfg.demo))) {
    draw(navigator.onLine ? 'Place lookup is off, so only your saved places are listed.' : 'You’re offline, so only your saved places are listed.');
    return;
  }
  draw('Looking around where you were…');
  try {
    for (const radius of [60, 150, 400]) {
      near = await api('nearby', { lat: c.lat, lng: c.lng, radius }) || [];
      if (near.length >= 5) break;
    }
  } catch (e) { draw('Couldn’t look up places: ' + (e.message || e)); return; }
  const seen = [];
  near = near.filter(n => n.place_id !== l.place_id && !saved.some(x => x.i.place_id && x.i.place_id === n.place_id))
    .filter(n => { const k = String(n.title || '').trim().toLowerCase(); if (seen.some(o => o.k === k && meters(o.n, n) < 50)) return false; seen.push({ k, n }); return true; })
    .slice(0, 8);
  draw(near.length || saved.length ? '' : 'Nothing else is listed close by.');
}
function swapLogPlace(l, { item, place }) {
  const patch = item
    ? { item_id: item.id, title: item.title, place_id: item.place_id || '', lat: item.lat, lng: item.lng, address: item.address || '',
        city: item.city || '', maps_url: item.maps_url || '', category: item.category || '', origin: 'planned' }
    : { item_id: '', title: place.title, place_id: place.place_id || '', lat: place.lat, lng: place.lng, address: place.address || '',
        city: place.city || '', maps_url: place.maps_url || '', category: place.category || '', origin: 'found' };
  const was = l.item_id ? itemById(l.item_id) : null;
  queue('updateLog', { id: l.id, patch }, () => { Object.assign(l, patch); });
  if (item && item.status !== 'done') queue('updateItem', { id: item.id, patch: { status: 'done' } }, () => { item.status = 'done'; });
  // the old planned place goes back on the list if nothing else logs it
  if (was && was !== item && !db.log.some(x => x.item_id === was.id)) queue('updateItem', { id: was.id, patch: { status: 'open' } }, () => { was.status = 'open'; });
  closeSheet(); toast('Changed to ' + patch.title);
}

function openLogEntry(id) {
  const l = db.log.find(x => x.id === id); if (!l) return;
  const t = tripById(l.trip_id);
  const item = l.item_id ? itemById(l.item_id) : null;
  openSheet(`
    <div class="field"><input id="lg-title" value="${esc(l.title)}" style="font-family:var(--serif);font-size:20px;font-weight:600;border:0;background:none;padding:4px 2px"></div>
    <div class="hint" style="margin-top:-8px">${l.origin === 'found' ? '<span class="badge found">Found</span>Not in your plan — discovered on the ground.' : l.origin === 'planned' ? `<span class="badge planned">Planned</span>${item ? 'From your plan: ' + esc(item.title) : 'Matched your plan.'}` : 'Matching to your plan…'}</div>
    ${l.address || l.maps_url ? `<div class="info">${esc(l.address || '')}${l.maps_url ? `<div class="links"><a href="${esc(l.maps_url)}" target="_blank" rel="noopener">Open in Maps</a></div>` : ''}</div>` : ''}
    ${!l.parent_id && notHereCenter(l) ? `<button class="linkbtn" id="lg-nothere" style="margin:-4px 0 6px">Not here? Pick the right place</button><div id="lg-near"></div>` : ''}
    <div class="two">
      <div class="field"><label>Day</label><select id="lg-day">${dayOptions(t, l.day, '—')}</select></div>
      <div class="field"><label>Time</label><input type="time" id="lg-time" value="${esc(l.time)}"></div>
    </div>
    <div class="field"><label>Got here by</label><select id="lg-mode"><option value="">—</option>${MODES.map(([k, n]) => `<option value="${k}" ${k === l.mode ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Note</label><textarea id="lg-note">${esc(l.note)}</textarea></div>
    <div class="field" style="margin-bottom:6px"><label>How was it?</label></div>
    <div class="seg" id="lg-rate">${RATINGS.map(([k, n]) => `<button data-r="${k}" class="${ratingOf(l) === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    <h4>Kept</h4>
    <div id="lg-kept"></div>
    <div class="btnrow"><button class="btn danger" id="lg-del">Delete</button><button class="btn" id="lg-save">Save</button></div>
  `, sh => {
    const nh = $('#lg-nothere', sh);
    if (nh) nh.onclick = () => { nh.remove(); pickRightPlace(l, $('#lg-near', sh)); };
    const kb = $('#lg-kept', sh);
    const drawKept = () => { kb.innerHTML = keptBlock(l); bindKept(kb, l, drawKept); };
    drawKept();
    let rating = ratingOf(l);
    $$('#lg-rate button', sh).forEach(b => b.onclick = () => {
      rating = rating === b.dataset.r ? '' : b.dataset.r;
      $$('#lg-rate button', sh).forEach(x => x.classList.toggle('on', x.dataset.r === rating));
    });
    $('#lg-save', sh).onclick = () => {
      const patch = { title: $('#lg-title', sh).value.trim() || l.title, day: $('#lg-day', sh).value || l.day, time: $('#lg-time', sh).value,
        mode: $('#lg-mode', sh).value, note: $('#lg-note', sh).value, rating, would_return: '' };
      if (patch.day !== l.day && !l.parent_id) patch.seq = String(topLogs(l.trip_id, patch.day).length);
      queue('updateLog', { id: l.id, patch }, () => {
        Object.assign(l, patch);
        if (patch.day !== undefined) logKids(l.id).forEach(k => { if (k.day !== patch.day) queue('updateLog', { id: k.id, patch: { day: patch.day } }, () => { k.day = patch.day; }); });
      });
      closeSheet();
    };
    $('#lg-del', sh).onclick = () => {
      const kids = logKids(l.id);
      closeSheet();
      undoable('Removed ' + l.title, () => {
        const gone = new Set([l.id, ...kids.map(k => k.id)]);
        db.log = db.log.filter(x => !gone.has(x.id));
        db.artifacts.filter(a => gone.has(a.log_id)).forEach(a => blobs.del(a.id));
        db.artifacts = db.artifacts.filter(a => !gone.has(a.log_id));
        [l, ...kids].forEach(x => { if (x.item_id && !db.log.some(y => y.item_id === x.item_id)) { const it = itemById(x.item_id); if (it) it.status = 'open'; } });
      }, () => { kids.forEach(k => queue('deleteLog', { id: k.id })); queue('deleteLog', { id: l.id }); });
    };
  });
}

/* ---------- Travelogue: end-of-day review ---------- */
function openReview(tripId, d) {
  const t = tripById(tripId); if (!t) return;
  const left = plannedStops(tripId, d).filter(s => s.status !== 'done' && s.status !== 'skipped');
  openSheet(`
    <h3>${esc(fmtDay(d))} — how did it go?</h3>
    ${left.length ? `<p class="hint" style="margin:-6px 2px 6px">Went adds it to the log in plan order. Skip sends it back to your saved places.</p>
      <div>${left.map(s => `<div class="review-row" data-row="${esc(s.id)}"><div class="body"><div class="title">${esc(s.title)}</div><div class="meta">${esc(placeLine(s))}</div></div>
        <button class="btn small" data-went="${esc(s.id)}">Went</button><button class="btn ghost small" data-skip="${esc(s.id)}">Skip</button>
        <select data-movetoday="${esc(s.id)}" style="width:86px;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px">${dayOptions(t, '', 'Move…').replace(`<option value="${d}"`, `<option disabled value="${d}"`)}</select></div>`).join('')}</div>`
      : `<div class="empty"><div class="big">All accounted for</div>Everything planned for this day is logged or moved.</div>`}
    <div class="btnrow" style="margin-top:14px"><button class="btn ghost" id="rv-done">Done</button><button class="btn" id="rv-more">Add somewhere I found</button></div>
  `, sh => {
    const gone = id => { const r = $(`[data-row="${CSS.escape(id)}"]`, sh); if (r) r.remove(); };
    $$('[data-went]', sh).forEach(b => b.onclick = () => {
      const it = itemById(b.dataset.went);
      const payload = { id: uid('lg'), trip: tripId, day: d, seq: topLogs(tripId, d).length, item_id: it.id, timezone: t.timezone || '' };
      queue('addLog', payload, () => { db.log.push({ id: payload.id, trip_id: tripId, day: d, seq: String(payload.seq), item_id: it.id, title: it.title, origin: 'planned', lat: it.lat, lng: it.lng, city: it.city }); it.status = 'done'; });
      gone(it.id);
    });
    $$('[data-skip]', sh).forEach(b => b.onclick = () => {
      const it = itemById(b.dataset.skip);
      queue('updateItem', { id: it.id, patch: { day: '', seq: '', status: 'open' } }, () => { it.day = ''; it.seq = ''; });
      gone(it.id);
    });
    $$('[data-movetoday]', sh).forEach(s => s.onchange = () => {
      const it = itemById(s.dataset.movetoday), nd = s.value;
      const seq = nd ? String(plannedStops(tripId, nd).length) : '';
      queue('updateItem', { id: it.id, patch: { day: nd, seq } }, () => { it.day = nd; it.seq = seq; });
      gone(it.id);
    });
    $('#rv-done', sh).onclick = () => closeSheet();
    $('#rv-more', sh).onclick = () => openHere(tripId, d);
  });
}

/* ---------- Chapters + review links ---------- */
function openChapter(tripId, id) {
  const t = tripById(tripId), ch = id ? db.chapters.find(c => c.id === id) : null;
  const shares = ch ? db.shares.filter(x => x.chapter_id === ch.id && !x.revoked) : [];
  const counts = c => {
    if (!c) return '';
    const stays = chapterStays(c), its = topItemsFor(tripId).filter(i => inChapter(i, c, stays));
    const n = k => its.filter(i => i.kind === k).length;
    return `${n('place')} places, ${n('idea')} ideas and ${n('fixed')} bookings`;
  };
  openSheet(`
    <h3>${ch ? esc(ch.name) : 'New chapter'}</h3>
    <p class="hint" style="margin-top:-4px">A stretch of ${esc(t.name)}. It shows bookings on these dates, and saved places near where you’re staying then. Nothing moves; it’s a view.</p>
    <div class="field"><label>Name</label><input id="ch-name" value="${esc(ch ? ch.name : '')}" placeholder="Reykjavík together"></div>
    <div class="two">
      <div class="field"><label>From</label><input type="date" id="ch-start" value="${esc(ch ? ch.start : t.start || '')}"></div>
      <div class="field"><label>To</label><input type="date" id="ch-end" value="${esc(ch ? ch.end : '')}"></div>
    </div>
    <div class="field"><label>Places within (km of where you stay)</label><input type="number" inputmode="numeric" min="1" max="500" id="ch-r" value="${esc(ch && ch.radius_km || 25)}"></div>
    ${ch ? `<p class="hint" id="ch-count">${counts(ch)}</p>` : ''}
    <div class="btnrow">${ch ? `<button class="btn danger" id="ch-del">Delete</button>` : ''}<button class="btn" id="ch-save">${ch ? 'Save' : 'Create chapter'}</button></div>
    ${ch ? `<div class="section-title" style="margin-top:22px">Review link</div>
      <p class="hint" style="margin-top:-2px">Someone with the link sees this chapter in a simple review view: they say what they’d like, send links, and ask Claude for ideas. They can’t change your plans; what they send waits for you here.</p>
      ${shares.map(x => `<div class="share-row"><div class="who">${esc(x.who || 'Review link')}</div>
        <button class="btn small" data-sh-share="${esc(x.id)}">Send link</button>
        <button class="btn small ghost" data-sh-open="${esc(x.id)}">Preview</button>
        <button class="linkbtn danger" data-sh-off="${esc(x.id)}">Turn off</button></div>`).join('')}
      <div class="share-new"><input id="sh-who" placeholder="Who’s it for? (their name)"><button class="btn small" id="sh-make">Make a link</button></div>` : ''}
  `, sh => {
    $('#ch-save', sh).onclick = () => {
      const data = { name: $('#ch-name', sh).value.trim(), start: $('#ch-start', sh).value, end: $('#ch-end', sh).value, radius_km: String(Math.max(1, Number($('#ch-r', sh).value) || 25)) };
      if (!data.name) { $('#ch-name', sh).focus(); return; }
      if (!data.start || !data.end) { toast('Pick both dates'); return; }
      if (data.end < data.start) { toast('The end is before the start'); return; }
      if (ch) { queue('updateChapter', { id: ch.id, patch: data }, () => Object.assign(ch, data)); closeSheet(); }
      else {
        const c = { id: uid('ch'), trip_id: tripId, ...data };
        queue('addChapter', { chapter: c }, () => db.chapters.push(c));
        setActiveChapter(t, c.id); closeSheet(); render();
        setTimeout(() => openChapter(tripId, c.id), 300);
      }
    };
    const del = $('#ch-del', sh);
    if (del) del.onclick = () => {
      if (!confirm('Delete “' + ch.name + '”? Your places and bookings stay as they are' + (shares.length ? ', and its review link stops working.' : '.'))) return;
      const now = new Date().toISOString();
      queue('deleteChapter', { id: ch.id }, () => {
        db.chapters = db.chapters.filter(c => c.id !== ch.id);
        db.shares.forEach(x => { if (x.chapter_id === ch.id && !x.revoked) x.revoked = now; });
      });
      setActiveChapter(t, ''); closeSheet(); render();
    };
    const make = $('#sh-make', sh);
    if (make) make.onclick = () => {
      const who = $('#sh-who', sh).value.trim();
      if (!who) { $('#sh-who', sh).focus(); return; }
      const x = { id: uid('sh'), token: newToken(), trip_id: tripId, chapter_id: ch.id, who, revoked: '' };
      queue('addShare', { share: x }, () => db.shares.push(x));
      closeSheet(); setTimeout(() => openChapter(tripId, ch.id), 280);
    };
    $$('[data-sh-share]', sh).forEach(b => b.onclick = async () => {
      const x = shareById(b.dataset.shShare), url = reviewLink(x);
      const text = `Here’s ${ch.name}. Have a look and tell me what sounds good.`;
      try { if (navigator.share) { await navigator.share({ title: ch.name, text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (e) { prompt('Copy this link:', url); }
    });
    $$('[data-sh-open]', sh).forEach(b => b.onclick = () => window.open(reviewLink(shareById(b.dataset.shOpen)), '_blank'));
    $$('[data-sh-off]', sh).forEach(b => b.onclick = () => {
      const x = shareById(b.dataset.shOff);
      if (!confirm('Turn off ' + (x.who ? x.who + '’s' : 'this') + ' link? It will stop working right away.')) return;
      queue('revokeShare', { id: x.id }, () => { x.revoked = new Date().toISOString(); });
      closeSheet(); setTimeout(() => openChapter(tripId, ch.id), 280);
    });
  });
}

/* ---------- Pull from Someday ---------- */
function openPull(tripId) {
  const t = tripById(tripId); if (!t) return;
  const m = somedayMatches(t);
  if (!m.length) return;
  openSheet(`
    <h3>Bring these into ${esc(t.name)}?</h3>
    <p class="hint" style="margin:-6px 2px 10px">Saved to Someday in ${esc(t.destination || t.name)}.</p>
    <div>${m.map(i => `<label class="check"><input type="checkbox" value="${esc(i.id)}" checked><span>${esc(i.title)}<small>${esc(placeLine(i))}</small></span></label>`).join('')}</div>
    <div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="pl-skip">Not now</button><button class="btn" id="pl-go">Add selected</button></div>
  `, sh => {
    $('#pl-skip', sh).onclick = () => closeSheet();
    $('#pl-go', sh).onclick = () => {
      const picked = $$('input:checked', sh).map(x => x.value);
      // An idea's suggestions move with it
      const ids = [...picked, ...picked.flatMap(id => suggestionsOf(id).map(s => s.id))];
      if (ids.length) queue('attach', { ids, trip_id: t.id }, () => db.items.forEach(i => { if (ids.includes(i.id)) i.trip_id = t.id; }));
      closeSheet();
      if (picked.length) toast(`Added ${picked.length} to ${t.name}`);
    };
  });
}

function demoApi(action, p) {
  return new Promise(resolve => setTimeout(() => {
    if (action === 'add') {
      const text = p.text || '';
      const it = itemById(p.id) || {};
      let title = p.title || it.title;
      if (isMapsUrl(text)) {
        const m = text.match(/\/maps\/place\/([^\/@?]+)/);
        title = p.title || (m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : linkTitle(text));
      }
      const c = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      resolve({ ...it, title, _pending: false, category: it.category || (isMapsUrl(text) ? 'Place' : ''), maps_url: isMapsUrl(text) ? text.match(/https?:\/\/\S+/)[0] : '', lat: c ? c[1] : it.lat, lng: c ? c[2] : it.lng });
    } else if (action === 'addLog') {
      const l = db.log.find(x => x.id === p.id) || {};
      const item = p.item_id && itemById(p.item_id);
      resolve({ ...l, _pending: false, origin: item ? 'planned' : 'found', title: l.title || (p.text && isMapsUrl(p.text) ? 'Somewhere (sample)' : p.text) });
    } else if (action === 'updateItem') { const it = itemById(p.id); if (it) { delete it._pending; delete it._link; } resolve(it); }
    else if (action === 'updateLog') resolve(db.log.find(x => x.id === p.id));
    else if (action === 'addTrip') resolve(p.trip);
    else if (action === 'addChapter') resolve(p.chapter);
    else if (action === 'updateChapter') resolve(db.chapters.find(c => c.id === p.id));
    else if (action === 'addShare') resolve(p.share);
    else if (action === 'revokeShare') resolve(shareById(p.id));
    else if (action === 'keepInbox') resolve({ item: itemById(p.item_id), inbox: db.inbox.find(b => b.id === p.id) });
    else if (action === 'dismissInbox') resolve(db.inbox.find(b => b.id === p.id));
    else if (action === 'updateTrip') resolve(tripById(p.id));
    else if (action === 'attach') resolve(db.items.filter(i => p.ids.includes(i.id)));
    else if (action === 'routes') resolve(p.legs.map(() => null));
    else if (action === 'upload') resolve({ ...artifactRow(p), file_id: p.hasFile ? 'demo' : '', _pending: false });
    else if (action === 'updateArtifact') resolve(Object.assign(db.artifacts.find(a => a.id === p.id) || {}, p.patch || {}));
    else if (action === 'deleteArtifact') resolve({ id: p.id });
    else if (action === 'file') {   // a made-up photo: dusk over the water
      const c = document.createElement('canvas'); c.width = 640; c.height = 480; const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 480); gr.addColorStop(0, '#2b3a55'); gr.addColorStop(.55, '#d9895b'); gr.addColorStop(.56, '#1f2b3a'); gr.addColorStop(1, '#101820');
      g.fillStyle = gr; g.fillRect(0, 0, 640, 480);
      resolve({ mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', .8).split(',')[1] });
    }
    else if (action === 'nearby') resolve([['A tiny jazz kissa', 'Jazz club', 18], ['Corner bakery (sample)', 'Bakery', 41], ['Sentō bathhouse (sample)', 'Public bath', 77]]
      .map(([title, category, dist], k) => ({ place_id: 'demo_near_' + k, title, category, dist, lat: +p.lat + dist / 111320, lng: +p.lng, address: '', city: 'Tokyo', maps_url: '' })));
    else resolve(null);
  }, 250));
}
