<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Hub</title>
<meta name="theme-color" content="#f4efe5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel Hub">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
:root {
  --paper: #f4efe5;
  --card: #fffdf8;
  --ink: #1f1b16;
  --muted: #7a7064;
  --line: #e4dccd;
  --accent: #b9532c;
  --accent-ink: #ffffff;
  --fixed: #2f4b6e;
  --place: #b9532c;
  --idea: #66773a;
  --found: #8a4fa8;
  --tour: #1f7a6d;
  --her: #6a58a8;
  --warn: #b0661c;
  --shadow: 0 1px 2px rgba(40,30,15,.06), 0 4px 14px rgba(40,30,15,.06);
  --radius: 14px;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171513; --card: #221f1b; --ink: #f1ebe0; --muted: #a39887; --line: #35302a;
    --her: #b9a8ec; --accent: #e0774b; --fixed: #8fb0d8; --place: #e0774b; --idea: #a9bd72; --found: #c49ad6; --tour: #5cc2b1; --warn: #e3a35a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; }
body { min-height: 100vh; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
body.mapmode { padding-bottom: 0; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
  display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
.iconbtn svg { width: 18px; height: 18px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idea); }
.dot.pending { background: #d8a136; } .dot.offline { background: var(--muted); }

main { padding: 6px 16px 24px; max-width: 720px; margin: 0 auto; }
.section-title { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--muted);
  margin: 22px 2px 10px; display: flex; align-items: baseline; gap: 8px; }
.section-title .count { font-family: var(--sans); font-size: 12px; font-weight: 500; }

/* ---------- trip cards ---------- */
.trip-card { position: relative; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 18px 16px 22px; margin-bottom: 12px; cursor: pointer; overflow: hidden; border: 1px solid var(--line); }
.trip-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--hue); }
.trip-card h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0 0 2px; letter-spacing: -.01em; }
.trip-card .dest { color: var(--muted); font-size: 14px; }
.trip-card .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; flex-wrap: wrap; }
.dates { font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 4px 9px;
  border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); white-space: nowrap; }
.chip.now { background: var(--accent); color: var(--accent-ink); }
.tally { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.tally span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--c); }

/* ---------- trip header + tabs ---------- */
.trip-head { padding: 2px 2px 0; }
.trip-head .row { display: flex; gap: 6px; flex-wrap: wrap; }
.subtabs { display: flex; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 12px; padding: 3px; margin: 12px 0 4px; }
.subtabs button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 9px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); }
.subtabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.banner { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
.banner b { font-weight: 600; }
.banner button { margin-left: auto; }

.filters { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; white-space: nowrap; position: relative; }
.filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters button.has::after { content: ""; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ---------- item cards ---------- */
.item { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.item .mark { width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-top: 6px; flex: none; }
.item.kind-idea .mark { border-radius: 50%; background: transparent; border: 2px solid var(--c); }
.item .body { flex: 1; min-width: 0; }
.title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.meta { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .when { font-size: 12px; font-weight: 600; color: var(--c); text-align: right; flex: none; margin-top: 2px; white-space: nowrap; }
.item.done .title, .stop.done .title { text-decoration: line-through; text-decoration-color: var(--muted); }
.pending { opacity: .6; }
.daylabel { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 2px 6px; }
.warn { color: var(--warn); font-weight: 600; }

.empty { text-align: center; color: var(--muted); padding: 36px 20px; font-size: 14px; line-height: 1.5; }
.empty .big { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-bottom: 6px; }

/* ---------- days ---------- */
.day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 14px; overflow: hidden; }
.day.today { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.day-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.day-h .d { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.day-h .n { font-size: 12px; color: var(--muted); font-weight: 500; }
.day-h .sp { flex: 1; }
.linkbtn { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 6px 4px; cursor: pointer; }
.ev { display: flex; gap: 12px; padding: 8px 14px; cursor: pointer; }
.ev-time { width: 54px; flex: none; font-size: 12px; font-weight: 600; color: var(--c); padding-top: 2px; text-align: right; }
.ev-body { flex: 1; min-width: 0; border-left: 2px solid var(--c); padding-left: 12px; }
.ev-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--c); margin-right: 4px; }
.stops { list-style: none; margin: 8px 0 2px; padding: 0; }
.stop { display: flex; gap: 10px; align-items: center; padding: 7px 0; cursor: pointer; }
.num { width: 22px; height: 22px; border-radius: 50%; background: var(--c, var(--place)); color: #fff; font-size: 12px; font-weight: 700;
  display: grid; place-items: center; flex: none; }
.num.hollow { background: transparent; border: 2px solid var(--c); color: var(--c); }
.stop .body { flex: 1; min-width: 0; }
.stop .title { font-size: 14px; }
.stop .meta { font-size: 12px; margin-top: 1px; }
.plan-h { display: flex; align-items: center; gap: 6px; padding: 10px 14px 2px; border-top: 1px dashed var(--line); margin-top: 6px; }
.plan-h span { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.plan-h .sp { flex: 1; }
.plan-list { padding: 0 14px 4px; }
.plan-empty { font-size: 13px; color: var(--muted); padding: 4px 14px 10px; }
.night { font-size: 13px; color: var(--muted); padding: 9px 14px 11px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--fixed) 6%, transparent); display: flex; gap: 8px; align-items: center; }
.night svg { width: 15px; height: 15px; flex: none; }
.sun { font-size: 12.5px; color: var(--muted); padding: 0 14px 10px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.sun svg { width: 14px; height: 14px; flex: none; color: color-mix(in srgb, var(--accent) 70%, var(--muted)); }
.sun b { color: var(--ink, inherit); font-weight: 600; }
.sun .len { opacity: .85; }
.moves { display: flex; gap: 4px; flex: none; }
.moves button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; padding: 0; font-size: 14px; }
.moves button:disabled { opacity: .3; }

/* ---------- travelogue ---------- */
.log-head { display: flex; align-items: baseline; gap: 10px; margin: 16px 2px 4px; }
.log-head .d { font-family: var(--serif); font-size: 22px; font-weight: 600; }
.log-head .s { font-size: 13px; color: var(--muted); }
.log-actions { display: flex; gap: 10px; margin: 12px 0 6px; }
.log-actions .btn { flex: 1; }
.entry { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; cursor: pointer; }
.entry .body { flex: 1; min-width: 0; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 1px; }
.badge.planned { background: color-mix(in srgb, var(--place) 16%, transparent); color: var(--place); }
.badge.found { background: color-mix(in srgb, var(--found) 18%, transparent); color: var(--found); }
.leg { display: flex; align-items: center; gap: 8px; padding: 2px 0 2px 22px; }
.leg::before { content: ""; width: 2px; height: 26px; background: var(--line); margin-left: -1px; }
.leg button { border: 1px dashed var(--line); background: none; border-radius: 999px; font-size: 12px; color: var(--muted); padding: 3px 10px; cursor: pointer; }
.kids { margin: 8px 0 0; padding: 0; list-style: none; }
.kids li { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }
.kids .num { width: 18px; height: 18px; font-size: 10px; }

/* ---------- map ---------- */
#mapwrap { position: relative; }
#map { width: 100%; background: var(--line); }
.map-chips { position: absolute; top: 10px; left: 0; right: 0; z-index: 500; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px; scrollbar-width: none; }
.map-chips::-webkit-scrollbar { display: none; }
.map-chips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); }
.map-chips button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.map-layer { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.map-layer button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.map-layer button.on { background: var(--ink); color: var(--paper); }
.map-note { position: absolute; bottom: 64px; left: 12px; right: 12px; z-index: 500; background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--muted); box-shadow: var(--shadow); text-align: center; }
.num-pin span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font: 700 12px var(--sans); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.home-pin span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--fixed); color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.home-pin svg { width: 16px; height: 16px; }
.leaflet-popup-content { font-family: var(--sans); margin: 10px 14px; }
.leaflet-popup-content b { font-size: 14px; }
.pop-btn { display: inline-block; margin-top: 6px; border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.leaflet-container { font-family: var(--sans); }
.ap-pin span { display: inline-block; padding: 3px 6px; border-radius: 6px; background: var(--fixed); color: #fff; font: 700 11px var(--sans); letter-spacing: .04em; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); white-space: nowrap; }
.pri { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 2px; }
.pri.must { background: var(--accent); color: var(--accent-ink); }
.pri.maybe { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--muted); }
.rate { font-weight: 600; margin-right: 6px; }
.rate.loved { color: #c2405a; } .rate.liked { color: var(--idea); } .rate.meh { color: var(--muted); }
.route-codes { font-weight: 700; letter-spacing: .03em; }
.search { margin-top: 12px; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none; -webkit-appearance: none; }
.search input:focus { border-color: var(--accent); }
.toggles { display: flex; gap: 8px; margin-top: 8px; }
.toggles button { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 10px; font-size: 14px; font-weight: 500; cursor: pointer; }
.toggles button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
details.group { margin-bottom: 4px; }
details.group summary { list-style: none; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 10px 2px 8px; }
details.group summary::-webkit-details-marker { display: none; }
details.group summary::before { content: '▸'; display: inline-block; width: 14px; transition: transform .15s; }
details.group[open] summary::before { transform: rotate(90deg); }
details.group .count { font-weight: 500; letter-spacing: 0; }
.leaflet-tile-pane { filter: saturate(.75) sepia(.12); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.5); }
}

/* ---------- bottom nav ---------- */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 600; display: flex; justify-content: space-around; align-items: center;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11px; color: var(--muted); padding: 6px 18px; cursor: pointer; }
nav.tabs button.on { color: var(--ink); }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs .add { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); padding: 0;
  justify-content: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); margin-top: -22px; }
nav.tabs .add svg { width: 26px; height: 26px; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20,15,10,.38); z-index: 1000; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001; background: var(--paper); border-radius: 20px 20px 0 0;
  max-height: 92vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 720px; margin: 0 auto; }
.sheet.open { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0 0 14px; }
.sheet h4 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 8px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 2px 6px; letter-spacing: .02em; }
.field input, .field select, .field textarea, .share-new input { width: 100%; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 11px 12px; font-size: 16px; outline: none; min-height: 46px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 64px; }
.capture-box { min-height: 88px !important; font-size: 17px !important; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; }
.inline .btn { width: auto; }
.hint { font-size: 13px; color: var(--muted); margin: -6px 2px 14px; min-height: 18px; }
.seg { display: flex; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 10px; padding: 3px; margin-bottom: 14px; flex-wrap: wrap; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 12px; padding: 13px 16px; font-size: 16px; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { background: none; color: #b33a2e; border: 1px solid color-mix(in srgb, #b33a2e 40%, var(--line)); font-weight: 500; }
.btn.small { width: auto; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btnrow { display: flex; gap: 10px; margin-top: 8px; }
.btnrow .btn { flex: 1; }
.info { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.5; }
.info .links { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.hours { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.hours li.today { color: var(--ink); font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.check span { flex: 1; min-width: 0; }
.check small { color: var(--muted); display: block; font-size: 12px; }
.pick { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
.pick.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.pick .body { flex: 1; min-width: 0; }
.review-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.review-row .body { flex: 1; min-width: 0; }
.review-row .btn { padding: 7px 10px; font-size: 13px; }

<script>
/* ============================================================
 * Travel Hub

const MODE_LABEL = Object.fromEntries(MODES);
const PRIOS = [['must', 'Must'], ['want', 'Want'], ['maybe', 'Maybe']];
const PRIO_RANK = { must: 0, want: 1, '': 2, maybe: 3 };
const prioRank = i => PRIO_RANK[i.priority || ''] ?? 2;
const RATINGS = [['loved', '♥ Loved'], ['liked', '✓ Liked'], ['meh', '– Meh']];
const ratingOf = l => l.rating || (l.would_return ? 'loved' : '');
function prioBadge(i) { return i.priority === 'must' ? '<span class="pri must">Must</span>' : i.priority === 'maybe' ? '<span class="pri maybe">Maybe</span>' : ''; }
function rateBadge(l) { const r = ratingOf(l); const lab = RATINGS.find(x => x[0] === r); return lab ? `<span class="rate ${r}">${lab[1]}</span>` : ''; }
function flightCodes(i) { return [i.from_code, i.to_code].filter(Boolean).join(' → '); }
// codes to show under a flight's title, unless the title already says them
function flightCodesExtra(i) { const c = flightCodes(i); return c && !String(i.title || '').includes(c) ? c : ''; }

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const isUrl = s => /https?:\/\/\S+/.test(s);
const isMapsUrl = s => /(maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google\.)/i.test(s);
const parseDate = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const hasCoords = o => num(o.lat) !== null && num(o.lng) !== null;
const seqOf = o => (o.seq === '' || o.seq == null) ? 9999 : +o.seq;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function fmtDay(s, withDow = true) {
  const d = parseDate(s); if (!d) return '';
  return (withDow ? DOW[d.getDay()] + ', ' : '') + MON[d.getMonth()] + ' ' + d.getDate();
}
function fmtShortDay(s) { const d = parseDate(s); return d ? DOW[d.getDay()] + ' ' + d.getDate() : ''; }
function fmtRange(a, b) {

  if (s && !e) return MON[s.getMonth()] + ' ' + s.getDate() + ', ' + s.getFullYear();
  if (!s) return 'Until ' + MON[e.getMonth()] + ' ' + e.getDate();
  if (s.getFullYear() !== e.getFullYear()) return `${MON[s.getMonth()]} ${s.getDate()}, ${s.getFullYear()} – ${MON[e.getMonth()]} ${e.getDate()}, ${e.getFullYear()}`;
  if (s.getMonth() === e.getMonth()) return `${MON[s.getMonth()]} ${s.getDate()} – ${e.getDate()}, ${s.getFullYear()}`;
  return `${MON[s.getMonth()]} ${s.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}, ${s.getFullYear()}`;
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm');
}
function tzNow(tz) {
  try {
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz || undefined, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
    const p = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
    return { day: `${p.year}-${p.month}-${p.day}`, time: `${p.hour === '24' ? '00' : p.hour}:${p.minute}` };
  } catch (e) { const n = new Date(); return { day: todayStr(), time: String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0') }; }
}
function tripStatus(t) {
  const now = parseDate(tzNow(t.timezone).day), s = parseDate(t.start), e = parseDate(t.end);
  if (!s) return { label: 'Dreaming', cls: '' };
  const day = 86400000;
  if (now < s) { const n = Math.round((s - now) / day); return { label: n === 1 ? 'Tomorrow' : `In ${n} days`, cls: '' }; }
  if (!e || now <= e) { const n = Math.round((now - s) / day) + 1; const total = e ? Math.round((e - s) / day) + 1 : null;
    return { label: total ? `Day ${n} of ${total}` : `Day ${n}`, cls: 'now' }; }
  return { label: 'Past', cls: '' };
}
function tripDays(t) {
  // Trip dates, stretched to cover bookings that fall outside them (e.g. a travel day)
  let first = t.start || '', last = t.end && t.end >= (t.start || '') ? t.end : t.start || '';
  db.items.filter(i => i.trip_id === t.id && i.kind === 'fixed' && !i.parent_id).forEach(i => {
    [i.day, i.end_day].filter(Boolean).forEach(x => { if (!first || x < first) first = x; if (!last || x > last) last = x; });
  });
  if (!first) return [];
  const out = []; let d = first;
  while (d <= last && out.length < 120) { out.push(d); d = addDays(d, 1); }
  return out;
}
/* ----- chapters: a stretch of a trip (dates + places near where you stay then). Only a lens; items stay on the trip. ----- */
const chaptersOf = tripId => db.chapters.filter(c => c.trip_id === tripId).sort((a, b) => String(a.start).localeCompare(String(b.start)));
const fold = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
function activeChapter(t) { const id = ui.chapter[t.id]; return id ? db.chapters.find(c => c.id === id && c.trip_id === t.id) || null : null; }
function setActiveChapter(t, id) { if (id) ui.chapter[t.id] = id; else delete ui.chapter[t.id]; store.set('th_chapter', ui.chapter); }
/** Stays with a night inside the chapter (checking in on its last day is the next leg). Same rule as the script. */
function chapterStays(ch) {
  return db.items.filter(i => i.trip_id === ch.trip_id && i.kind === 'fixed' && isStay(i) && !i.parent_id && i.day && (() => {
    const out = i.end_day || i.day;
    if (ch.start && ch.end && ch.start === ch.end) return i.day <= ch.end && out >= ch.start;
    return (!ch.end || i.day < ch.end) && (!ch.start || out > ch.start);
  })());
}
function inChapter(i, ch, stays = chapterStays(ch)) {
  if (i.parent_id) { const par = itemById(i.parent_id); if (par) return inChapter(par, ch, stays); }
  if (i.day) return (!ch.end || i.day <= ch.end) && (!ch.start || (i.end_day || i.day) >= ch.start);
  const r = (Number(ch.radius_km) || 25) * 1000;
  const anchors = stays.filter(hasCoords);
  if (hasCoords(i) && anchors.length) return anchors.some(st => meters(st, i) <= r);
  if (i.city) { const cs = stays.map(st => fold(st.city)).filter(Boolean); return !cs.length || cs.includes(fold(i.city)); }
  return true;
}
/** The trip's top-level items, narrowed to the chapter you're looking at (if any). */
function scopedTop(t) {
  const ch = activeChapter(t), its = topItemsFor(t.id);
  if (!ch) return its;
  const stays = chapterStays(ch);
  return its.filter(i => inChapter(i, ch, stays));
}
function scopedDays(t) {
  const ch = activeChapter(t), days = tripDays(t);
  return ch ? days.filter(d => (!ch.start || d >= ch.start) && (!ch.end || d <= ch.end)) : days;
}
/* ----- what people you shared a chapter with said ----- */
const shareById = id => db.shares.find(x => x.id === id);
const ANSWER_LABEL = { plan: 'plan it', nearby: 'if nearby', pass: 'pass' };
function theirTake(i) {
  const bits = [];
  db.reactions.filter(r => r.item_id === i.id && ANSWER_LABEL[r.answer]).forEach(r => {
    const sh = shareById(r.share_id); if (sh) bits.push(`<span class="badge her ${r.answer}">${esc(sh.who || 'Them')}: ${ANSWER_LABEL[r.answer]}</span>`);
  });
  const boosts = {};
  db.inbox.filter(b => b.status === 'boost' && b.item_id === i.id).forEach(b => { const sh = shareById(b.share_id); if (sh) boosts[sh.who] = (boosts[sh.who] || 0) + 1; });
  Object.keys(boosts).forEach(w => bits.push(`<span class="badge her plan">+1 ${esc(w)}</span>`));
  if (/^from:/.test(i.source || '')) bits.push(`<span class="badge her">From ${esc(i.source.slice(5))}</span>`);
  return bits.join('');
}
const newInbox = tripId => db.inbox.filter(b => b.trip_id === tripId && b.status === 'new');
function inboxBlock(t) {
  const rows = newInbox(t.id);
  if (!rows.length) return '';
  const who = [...new Set(rows.map(b => (shareById(b.share_id) || {}).who).filter(Boolean))].join(' and ') || 'your review link';
  return `<div class="section-title">From ${esc(who)} <span class="count">${rows.length}</span></div>` + rows.map(b => {
    const host = b.website && !b.place_id ? (b.website.match(/^https?:\/\/(?:www\.)?([^\/?#]+)/) || [])[1] : '';
    const meta = [b.kind === 'place' ? placeLine(b) : host, b.note].filter(Boolean).join(' · ');
    return `<div class="item inbox" style="--c:var(--her)">
      <span class="mark"></span>
      <div class="body"><div class="title">${esc(b.title || b.text)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}

      <button class="mini keep" data-inkeep="${esc(b.id)}">Keep</button><button class="mini x" data-indrop="${esc(b.id)}" aria-label="Dismiss ${esc(b.title)}">✕</button>

function meters(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(+b.lat - +a.lat), dLng = r(+b.lng - +a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(+a.lat)) * Math.cos(r(+b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

/** true = open that weekday, false = closed, null = unknown */
function openOn(i, dow) {
  let h; try { h = i.hours ? JSON.parse(i.hours) : null; } catch (e) { return null; }
  if (!h) return null;
  const p = h.periods;
  if (Array.isArray(p) && p.length) {
    if (p.length === 1 && p[0].open && !p[0].close) return true;
    return p.some(x => x.open && x.open.day === dow);
  }
  const line = (h.weekday || []).find(l => l.startsWith(DOW_LONG[dow]));
  return line ? !/closed/i.test(line) : null;
}
function hoursOn(i, dow) {
  let h; try { h = i.hours ? JSON.parse(i.hours) : null; } catch (e) { return ''; }
  const line = h && (h.weekday || []).find(l => l.startsWith(DOW_LONG[dow]));
  return line ? line.slice(line.indexOf(':') + 1).trim().replace(/ /g, ' ') : '';

function somedayMatches(trip) {

/* ----- day model ----- */
function stayForNight(tripId, d) {
  return topItemsFor(tripId).find(i => i.kind === 'fixed' && isStay(i) && i.day && i.day <= d && (i.end_day ? d < i.end_day : d === i.day));
}
function stayForMorning(tripId, d) {
  return stayForNight(tripId, addDays(d, -1)) || stayForNight(tripId, d);
}
function fixedEvents(tripId, d) {
  const out = [];
  topItemsFor(tripId).filter(i => i.kind === 'fixed').forEach(i => {
    const multi = i.end_day && i.end_day !== i.day;
    if (i.day === d) out.push({ i, label: isStay(i) ? 'Check in' : isFlight(i) ? (multi ? 'Depart' : '') : '', time: i.start_time, end: multi ? '' : i.end_time, start: true });
    if (multi && i.end_day === d) out.push({ i, label: isStay(i) ? 'Check out' : isFlight(i) ? 'Arrive' : 'Ends', time: i.end_time, end: '', start: false });
  });
  return out.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
}
/* ---------- Daylight ---------- */
/** Sunrise and sunset (UTC Dates) for a day at a place; {polar:'night'|'day'} when the sun doesn't rise or set. */
function sunTimes(day, lat, lng) {
  const rad = Math.PI / 180, [y, m, d] = day.split('-').map(Number);
  const n = Math.round(Date.UTC(y, m - 1, d, 12) / 86400000 + 2440587.5 - 2451545);
  const J = n - lng / 360;
  const M = (357.5291 + 0.98560028 * J) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const transit = 2451545 + J + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
  if (cosW > 1) return { polar: 'night' };
  if (cosW < -1) return { polar: 'day' };
  const w = Math.acos(cosW) / rad / 360;
  const toDate = j => new Date((j - 2440587.5) * 86400000);
  return { rise: toDate(transit - w), set: toDate(transit + w) };
}
/** Where you'll spend a day's daylight: where you wake up, else where you sleep, else the day's first planned stop. */
function dayPlace(t, d) {
  const c = [stayForMorning(t.id, d), stayForNight(t.id, d), ...plannedStops(t.id, d)].find(x => x && hasCoords(x));
  return c ? { lat: +c.lat, lng: +c.lng } : null;
}
function clockIn(date, tz) {
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: tz || undefined, hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(date).map(x => [x.type, x.value]));
    return fmtTime(`${p.hour === '24' ? '00' : p.hour}:${p.minute}`);
  } catch (e) { return fmtTime(String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0')); }
}

  const m = Math.round(ms / 60000), h = Math.floor(m / 60);
  return h ? `${h} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : `${m} min`;
}
/** "☀ 10:48am – 3:29pm · 4 h 41 min of daylight, 6 min less than yesterday" */
function daylightRow(t, d) {
  const at = dayPlace(t, d);
  if (!at) return '';
  const s = sunTimes(d, at.lat, at.lng);
  if (s.polar) return `<div class="sun">${I.sun}<span>${s.polar === 'night' ? 'The sun doesn’t rise today' : 'The sun doesn’t set today'}</span></div>`;
  const len = s.set - s.rise;
  let change = '';
  const prev = sunTimes(addDays(d, -1), at.lat, at.lng);
  if (!prev.polar) {
    const diff = Math.round((len - (prev.set - prev.rise)) / 60000);
    if (Math.abs(diff) >= 1) change = `, ${Math.abs(diff)} min ${diff < 0 ? 'less' : 'more'} than yesterday`;
  }
  return `<div class="sun">${I.sun}<span>Sunrise <b>${clockIn(s.rise, t.timezone)}</b> · Sunset <b>${clockIn(s.set, t.timezone)}</b></span><span class="len">${hoursMins(len)} of daylight${change}</span></div>`;
}

/* Deletes wait a few seconds so they can be undone. If the app is closed in that
   window, the delete is sent immediately rather than lost. */
const pendingDeletes = [];
function undoable(msg, removeLocal, commit) {
  // Remember only what this delete removes or changes, so Undo puts back just that
  // (restoring a whole snapshot could bring back other things deleted or synced in the meantime)
  const LISTS = ['trips', 'items', 'log', 'artifacts'];
  const before = {};
  LISTS.forEach(k => { before[k] = new Map((db[k] || []).map(x => [x.id, JSON.stringify(x)])); });
  removeLocal();
  const touched = {};
  LISTS.forEach(k => {
    const now = new Map((db[k] || []).map(x => [x.id, JSON.stringify(x)]));
    touched[k] = [...before[k]].filter(([id, js]) => now.get(id) !== js).map(([, js]) => JSON.parse(js));
  });
  saveLocal(); render();
  const job = { done: false, run() { if (this.done) return; this.done = true; commit(); } };
  pendingDeletes.push(job);
  const timer = setTimeout(() => job.run(), 6000);
  toast(msg, { action: 'Undo', ms: 6000, onAction: () => {
    if (job.done) return toast('Too late — already saved');
    job.done = true; clearTimeout(timer);
    LISTS.forEach(k => touched[k].forEach(old => {
      const i = db[k].findIndex(x => x.id === old.id);
      if (i >= 0) db[k][i] = old; else db[k].push(old);
    }));
    saveLocal(); render(); toast('Restored');
  } });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pendingDeletes.forEach(j => j.run()); });

/* ============================================================
 * API + offline queue
 * ============================================================ */
async function api(action, payload = {}) {
  if (cfg && cfg.demo) return demoApi(action, payload);
  let res;
  try { res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ action, token: cfg.token, ...payload }) }); }
  catch (e) { const err = new Error('no connection'); err.detail = 'No connection (' + (e && e.message || e) + ')'; throw err; }
  const txt = await res.text();
  let j;
  try { j = JSON.parse(txt); }
  catch (e) {
    // Google sent a page instead of an answer (a hiccup on their side, or the script needs attention)
    const err = new Error('unexpected reply');
    err.detail = 'Google replied ' + res.status + ': ' + txt.replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
    throw err;
  }
  if (!j.ok) { const err = new Error(j.error || 'Server error'); err.server = true; throw err; }
  return j.data;
}

function saveLocal() { store.set('th_cache', db); store.set('th_outbox', outbox); store.set('th_parked', parked); }

function reconcile(action, data) {
  if (!data) return;
  const swap = (list, obj) => { const i = db[list].findIndex(x => x.id === obj.id); if (i >= 0) db[list][i] = obj; else db[list].push(obj); };
  if (action === 'add' || action === 'updateItem' || action === 'refreshItem') {
    if (data._duplicate) { toast('Already saved: ' + data.title); return; }
    swap('items', data);
  } else if (action === 'attach' && Array.isArray(data)) data.forEach(o => swap('items', o));
  else if (action === 'addTrip' || action === 'updateTrip') swap('trips', data);
  else if (action === 'addChapter' || action === 'updateChapter') swap('chapters', data);
  else if (action === 'addShare' || action === 'revokeShare') swap('shares', data);
  else if (action === 'dismissInbox') swap('inbox', data);
  else if (action === 'keepInbox') { if (data.item) swap('items', data.item); if (data.inbox) swap('inbox', data.inbox); }
  else if (action === 'upload' || action === 'updateArtifact') swap('artifacts', data);
  else if (action === 'addLog' || action === 'updateLog') {
    swap('log', data);
    if (data.item_id) { const it = itemById(data.item_id); if (it) it.status = 'done'; }
  }
}

/** Apply locally right away, then send to the Sheet (queued if offline). */
let inFlight = null;
function queue(action, payload, applyLocal) {
  if (applyLocal) applyLocal();
  if (action === 'reorder' && payload.key) outbox = outbox.filter(o => o === inFlight || !(o.action === 'reorder' && o.payload.key === payload.key));
  outbox.push({ action, payload });
  saveLocal(); render(); flush();
}

let flushing = false;
async function flush() {
  if (flushing || !cfg) return;
  flushing = true;
  while (outbox.length) {
    const op = outbox[0]; inFlight = op;
    try {
      let payload = op.payload;
      if (op.action === 'upload' && payload.hasFile) {
        const blob = await blobs.get(payload.id);
        if (!blob) { outbox.shift(); saveLocal(); continue; }   // the file is gone from the phone; nothing to send
        payload = { ...payload, b64: await blobToB64(blob) };
      }
      const data = await api(op.action, payload);
      if (op.action === 'add' && data && data._duplicate) db.items = db.items.filter(i => i.id !== op.payload.id);
      reconcile(op.action, data);
      outbox.shift(); saveLocal();
    } catch (e) {
      if (e.server && /Unknown action/.test(e.message) && ARTIFACT_OPS.includes(op.action)) {
        // the script hasn't been updated yet: keep these until it is
        parked.push(op); outbox.shift(); saveLocal();
        toast('Photos and sounds are kept on your phone until the script is updated');
      }
      else if (e.server) { toast('Couldn’t save: ' + e.message); outbox.shift(); saveLocal(); }
      else { syncState = 'offline'; lastSyncError = e.detail || e.message; scheduleRetry(); break; }
    }
  }
  inFlight = null;
  if (!outbox.length) { syncState = 'ok'; lastSyncError = ''; retryDelay = 5000; }
  flushing = false; render();
}

/* If the Sheet can't be reached, keep trying by itself: 5 s, 10 s, 20 s… up to every 2 minutes. */
let retryTimer = null, retryDelay = 5000, lastSyncError = '';
function scheduleRetry() {
  if (retryTimer) return;
  retryTimer = setTimeout(() => { retryTimer = null; pull(); }, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 120000);
}
function syncNow() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  retryDelay = 5000; ui.noRoutes = false;
  return pull().then(() => toast(syncState === 'ok' ? 'Up to date'
    : 'Still can’t reach your Sheet' + (lastSyncError ? ' — ' + lastSyncError : '')));
}
document.addEventListener('click', e => { if (cfg && !cfg.demo && e.target.closest && e.target.closest('.top .sync')) syncNow(); });

async function pull() {
  if (!cfg) return;
  await flush();
  if (outbox.length) return;
  try {
    const data = await api('bootstrap');
    const scriptKnowsArtifacts = Array.isArray(data.artifacts);
    db = Object.assign(EMPTY_DB(), data);
    if (parked.length && scriptKnowsArtifacts) { outbox.push(...parked); parked = []; }
    // anything not yet in the Sheet stays visible
    outbox.concat(parked).filter(o => o.action === 'upload').forEach(o => { if (!db.artifacts.some(a => a.id === o.payload.id)) db.artifacts.push(artifactRow(o.payload)); });
    syncState = 'ok'; saveLocal(); render();
    if (outbox.length) flush();
    lookUpSuggestions();
  } catch (e) {
    syncState = 'offline'; render();
    if (e.server) toast(e.message);
    else { lastSyncError = e.detail || e.message; scheduleRetry(); }
  }
}

window.addEventListener('online', () => pull());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });

/* ---------- routes (cached on phone and in the Sheet) ---------- */
function routeKey(leg) {
  const f = n => Number(n).toFixed(5);
  return `${f(leg.from[0])},${f(leg.from[1])}>${f(leg.to[0])},${f(leg.to[1])}|${leg.mode || 'walk'}`;
}
async function getRoutes(legs) {
  const out = legs.map(l => routeCache[routeKey(l)] || null);
  const missIdx = out.map((r, i) => r ? -1 : i).filter(i => i >= 0);
  if (!missIdx.length || (cfg && cfg.demo) || ui.noRoutes || !navigator.onLine) return out;
  try {
    const res = await api('routes', { legs: missIdx.map(i => legs[i]) });
    let anyOk = false;
    missIdx.forEach((li, k) => {
      const r = res && res[k];
      if (r && r.polyline) { routeCache[routeKey(legs[li])] = r.polyline; out[li] = r.polyline; anyOk = true; }
    });
    if (!anyOk && res && res.some(r => r && r.error)) ui.noRoutes = true;
    store.set('th_routes', routeCache);
  } catch (e) { ui.noRoutes = true; }
  return out;
}
function decodePolyline(str) {
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length) {
    let b, shift = 0, res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (res & 1) ? ~(res >> 1) : (res >> 1);
    shift = 0; res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (res & 1) ? ~(res >> 1) : (res >> 1);
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
const guessMode = (a, b) => meters(a, b) < 1800 ? 'walk' : 'transit';

/* ============================================================
 * Routing + rendering
 * ============================================================ */
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'trip' && h[1]) return { name: 'trip', id: decodeURIComponent(h[1]), sub: h[2] || 'days' };
  if (h[0] === 'someday') return { name: 'someday' };
  if (h[0] === 'range') return { name: 'range' };
  return { name: 'trips' };
}
let lastRoute = '';
window.addEventListener('hashchange', () => {
  const r = route();
  const key = r.name + (r.id || '');
  if (key !== lastRoute) { ui.filter = 'all'; ui.reorder = null; }
  lastRoute = key;
  render(); window.scrollTo(0, 0);
});
window.addEventListener('scroll', () => { const t = $('.top'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

function syncBadge() {
  const pending = outbox.length;
  const state = syncState === 'offline' ? 'offline' : pending ? 'pending' : 'ok';
  const label = cfg && cfg.demo ? '<span class="demo-tag">SAMPLE</span>' :
    state === 'offline' ? `${navigator.onLine ? 'Retrying' : 'Offline'}${pending ? ' · ' + pending + ' waiting' : ''}` : pending ? 'Saving…' : 'Synced';
  return `<div class="sync">${cfg && cfg.demo ? '' : `<span class="dot ${state}"></span>`}${label}</div>`;
}

let map = null;
function render() {
  const app = $('#app');
  // Don't rebuild the map just because a background save finished
  const r = route();
  if (map && r.name === 'trip' && r.sub === 'map' && render._mapSig === mapSignature(r.id) && $('#map')) {
    const sb = $('.top .sync'); if (sb) sb.outerHTML = syncBadge();
    return;
  }
  if (map) { try { map.remove(); } catch (e) {} map = null; }
  document.body.classList.remove('mapmode');
  if (!cfg) { app.innerHTML = setupView(); bindSetup(); return; }
  let html = '';
  if (r.name === 'trip') html = tripView(r.id, r.sub);
  else if (r.name === 'someday') html = somedayView();
  else if (r.name === 'range') html = rangeView();
  else html = tripsView();
  html += navView(r.name === 'range' ? 'trips' : r.name);
  app.innerHTML = html;
  bindCommon();
  if (r.name === 'trip' && r.sub === 'map') initMap(r.id);
  if (r.name === 'trip' && r.sub === 'recap') initRecap(r.id);
  if (r.name === 'range') initRange();
  if (r.name === 'trip' && r.sub === 'days' && !render._scrolled) {
    const td = $('.day.today'); if (td) { render._scrolled = true; setTimeout(() => td.scrollIntoView({ block: 'start', behavior: 'instant' }), 0); }
  }
}

function navView(active) {
  return `<nav class="tabs">
    <button class="${active === 'trips' || active === 'trip' ? 'on' : ''}" data-go="#/">${I.trips}Trips</button>
    <button class="add" data-act="capture" aria-label="Add">${I.plus}</button>
    <button class="${active === 'someday' ? 'on' : ''}" data-go="#/someday">${I.someday}Someday</button>
  </nav>`;
}

/* ---------- Trips list ---------- */
function tripsView() {
  const today = todayStr();
  const sorted = [...db.trips].sort((a, b) => String(a.start || '9999').localeCompare(String(b.start || '9999')));
  const upcoming = sorted.filter(t => !t.end || t.end >= today);
  const past = sorted.filter(t => t.end && t.end < today).reverse();
  const card = t => {
    const st = tripStatus(t);
    const its = topItemsFor(t.id);
    const n = k => its.filter(i => i.kind === k).length;
    const logged = db.log.filter(l => l.trip_id === t.id).length;
    return `<div class="trip-card" style="--hue:${hue(t.id)}" data-go="#/trip/${encodeURIComponent(t.id)}">
      <h2>${esc(t.name)}</h2>
      ${t.destination ? `<div class="dest">${esc(t.destination)}</div>` : ''}
      <div class="row"><span class="dates">${esc(fmtRange(t.start, t.end))}</span><span class="chip ${st.cls}">${st.label}</span></div>
      <div class="tally"><span style="--c:var(--fixed)">${n('fixed')} fixed</span><span style="--c:var(--place)">${n('place')} places</span><span style="--c:var(--idea)">${n('idea')} ideas</span>${logged ? `<span style="--c:var(--found)">${logged} logged</span>` : ''}${newInbox(t.id).length ? `<span style="--c:var(--her)">${newInbox(t.id).length} new from your review link</span>` : ''}</div>
    </div>`;
  };
  return `<header class="top"><h1>Trips</h1>${syncBadge()}<button class="iconbtn" data-act="settings" aria-label="Settings">${I.gear}</button></header>
  <main>
    ${upcoming.length ? upcoming.map(card).join('') : `<div class="empty"><div class="big">No trips yet</div>Start one, or save places to Someday and pull them in later.</div>`}
    <button class="btn ghost" data-act="newTrip" style="margin-top:6px">+ New trip</button>
    ${db.trips.some(t => tripDays(t).length) ? `<button class="btn ghost" data-go="#/range" style="margin-top:8px">Make a poster of a year or a season</button>` : ''}
    ${past.length ? `<div class="section-title">Past <span class="count">${past.length}</span></div>${past.map(card).join('')}` : ''}
  </main>`;
}

/* ---------- Trip shell ---------- */
function tripView(id, sub) {
  const t = tripById(id);
  if (!t) return `<header class="top"><button class="iconbtn" data-go="#/">${I.back}</button><h1>Not found</h1></header><main><div class="empty">This trip isn’t in your Sheet anymore.</div></main>`;
  const st = tripStatus(t);
  const base = '#/trip/' + encodeURIComponent(t.id);
  const tabs = [['days', 'Days'], ['map', 'Map'], ['saved', 'Saved'], ['log', 'Log']];
  const head = `<header class="top"><button class="iconbtn" data-go="#/" aria-label="Back">${I.back}</button><h1>${esc(t.name)}</h1>${syncBadge()}<button class="iconbtn" data-act="editTrip" data-id="${esc(t.id)}" aria-label="Edit trip">${I.edit}</button></header>`;
  const tabbar = `<div class="subtabs">${tabs.map(([k, l]) => `<button class="${sub === k ? 'on' : ''}" data-go="${base}/${k}">${l}</button>`).join('')}</div>`;
  if (sub === 'recap') return recapView(t);
  if (sub === 'map') {
    return head + `<div style="padding:0 16px">${chaptersOf(t.id).length ? chapterRow(t) : ''}${tabbar}</div><div id="mapwrap">${mapChips(t)}<div id="map"></div>${mapLayerToggle(t)}<div class="map-note" id="map-note" hidden></div></div>`;
  }
  const meta = `<div class="trip-head"><div class="row">
      <span class="chip">${esc(fmtRange(t.start, t.end))}</span><span class="chip ${st.cls}">${st.label}</span>
      ${t.timezone ? `<span class="chip">${esc(t.timezone.split('/').pop().replace(/_/g, ' '))} time</span>` : ''}
    </div>${chapterRow(t)}</div>`;
  let body = '';
  if (sub === 'saved') body = savedContent(t);
  else if (sub === 'log') body = logContent(t);
  else body = daysContent(t);
  return head + `<main>${meta}${tabbar}${body}</main>`;
}

function chapterRow(t) {
  const chs = chaptersOf(t.id), on = activeChapter(t);
  return `<div class="row chapters">
    ${chs.length ? `<button class="chap ${on ? '' : 'on'}" data-chapter-pick="">Whole trip</button>` : ''}
    ${chs.map(c => {
      const shared = db.shares.some(x => x.chapter_id === c.id && !x.revoked);
      return `<button class="chap ${on && on.id === c.id ? 'on' : ''}" data-chapter-pick="${esc(c.id)}">${esc(c.name)}${shared ? ' <span class="shared-dot" title="Shared"></span>' : ''}</button>`;
    }).join('')}
    ${on ? `<button class="chap ghost" data-chapter-edit="${esc(on.id)}">Edit · Share</button>` : `<button class="chap ghost" data-chapter-new="${esc(t.id)}">+ Chapter</button>`}
  </div>${on ? `<div class="chap-note">${esc(fmtRange(on.start, on.end))} · places within ${esc(on.radius_km || 25)} km of where you stay</div>` : ''}`;
}

function matchesBanner(t) {
  const m = somedayMatches(t);
  return m.length ? `<div class="banner"><div><b>${m.length} saved in Someday</b> match ${esc(t.destination || t.name)}.</div><button class="btn small" data-act="pullSomeday" data-id="${esc(t.id)}">Review</button></div>` : '';
}

/* ---------- Days ---------- */
function daysContent(t) {
  const days = scopedDays(t);
  if (!days.length) return matchesBanner(t) + `<div class="empty"><div class="big">Add dates to see your days</div>Then stays, bookings and planned stops line up day by day.<br><br><button class="btn small" data-act="editTrip" data-id="${esc(t.id)}">Add dates</button></div>`;
  const today = tzNow(t.timezone).day;
  const unscheduled = scopedTop(t).filter(i => i.kind !== 'fixed' && !i.day).length;
  const fresh = newInbox(t.id).length;
  return matchesBanner(t) + (fresh ? `<div class="banner her"><div><b>${fresh} new</b> from your review link.</div><button class="btn small" data-go="#/trip/${encodeURIComponent(t.id)}/saved">See them</button></div>` : '') + days.map((d, k) => dayCard(t, d, k, today)).join('') +
    (unscheduled ? `<div class="empty" style="padding:24px 10px">${unscheduled} saved ${unscheduled === 1 ? 'place has' : 'places have'} no day yet.<br><button class="linkbtn" data-go="#/trip/${encodeURIComponent(t.id)}/saved">See them in Saved</button></div>` : '<div style="height:12px"></div>');
}

function evRow(e) {
  const i = e.i, c = isTour(i) ? 'var(--tour)' : 'var(--fixed)';
  const kids = e.start && isTour(i) ? childrenOf(i.id) : [];
  const reorder = ui.reorder === 'tour:' + i.id;
  const fl = isFlight(i);
  const where = !fl && !isStay(i) ? (i.address && /^(tour)$/i.test(i.category || '') ? 'from ' + i.address.split(',')[0] : i.city || '') : '';
  const metaBits = [fl ? '' : (i.category && !e.label ? i.category : ''), where, e.end ? (fl ? 'lands ' : 'until ') + fmtTime(e.end) : '', i.confirmation ? '#' + i.confirmation : ''].filter(Boolean);
  const codes = fl && flightCodesExtra(i) ? `<span class="route-codes">${esc(flightCodesExtra(i))}</span>` : '';
  return `<div class="ev" data-item="${esc(i.id)}" style="--c:${c}">
    <div class="ev-time">${esc(fmtTime(e.time))}</div>
    <div class="ev-body">
      <div class="title">${e.label ? `<span class="ev-label">${esc(e.label)}</span>` : ''}${esc(i.title)}</div>
      ${metaBits.length || codes ? `<div class="meta">${[codes, esc(metaBits.join(' · '))].filter(Boolean).join(' · ')}</div>` : ''}
      ${kids.length ? `<ol class="stops">${kids.map((s, k) => stopRow(s, k, 'tour:' + i.id, kids.length, reorder, null, 'var(--tour)')).join('')}</ol>
        ${kids.length > 1 ? `<button class="linkbtn" data-reorder="tour:${esc(i.id)}">${reorder ? 'Done' : 'Reorder stops'}</button>` : ''}` : ''}
    </div>
  </div>`;
}

function stopRow(s, k, listKey, n, reorder, dow, color) {
  let hint = '';
  if (dow != null) {
    const o = openOn(s, dow);
    if (o === false) hint = `<span class="warn">Closed ${DOW[dow]}</span>`;
    else { const h = hoursOn(s, dow); if (h) hint = esc(h); }
  }
  const meta = [esc(placeLine(s)), hint].filter(Boolean).join(' · ');
  return `<li class="stop ${s.status === 'done' ? 'done' : ''} ${s._pending ? 'pending' : ''}" data-item="${esc(s.id)}" style="--c:${color || (s.kind === 'idea' ? 'var(--idea)' : 'var(--place)')}">
    <span class="num ${s.kind === 'idea' ? 'hollow' : ''}">${k + 1}</span>
    <div class="body"><div class="title">${prioBadge(s)}${esc(s.title)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>
    ${reorder ? `<div class="moves"><button data-move="up" data-list="${esc(listKey)}" data-id="${esc(s.id)}" ${k === 0 ? 'disabled' : ''}>↑</button><button data-move="down" data-list="${esc(listKey)}" data-id="${esc(s.id)}" ${k === n - 1 ? 'disabled' : ''}>↓</button></div>` : ''}
  </li>`;
}

function dayCard(t, d, idx, today) {
  const dow = parseDate(d).getDay();
  const events = fixedEvents(t.id, d);
  const stops = plannedStops(t.id, d);
  const night = stayForNight(t.id, d);
  const key = 'day:' + d;
  const reorder = ui.reorder === key;
  const logged = logsFor(t.id, d).length;
  return `<section class="day ${d === today ? 'today' : ''}" id="day-${d}">
    <div class="day-h"><div><div class="d">${esc(fmtDay(d))}</div><div class="n">${dayLabel(t, d)}${d === today ? ' · Today' : ''}${logged ? ` · ${logged} logged` : ''}</div></div><span class="sp"></span>
      <button class="linkbtn" data-mapday="${d}">Map</button>${logged || d <= today ? `<button class="linkbtn" data-logday="${d}">Log</button>` : ''}</div>
    ${daylightRow(t, d)}
    ${events.map(evRow).join('')}
    <div class="plan-h"><span>Plan</span><span class="sp"></span>
      ${stops.length > 1 ? `<button class="linkbtn" data-reorder="${key}">${reorder ? 'Done' : 'Reorder'}</button>` : ''}
      <button class="linkbtn" data-addday="${d}">+ Add</button></div>
    ${stops.length ? `<ol class="stops plan-list">${stops.map((s, k) => stopRow(s, k, key, stops.length, reorder, dow)).join('')}</ol>` : `<div class="plan-empty">Nothing planned yet.</div>`}
    ${night ? `<div class="night">${I.moon}<span>Night at <b>${esc(night.title)}</b></span></div>` : ''}
  </section>`;
}

/* ---------- Ask Claude suggestions ---------- */
function suggestionList(sugs) {
  return `<ul class="sugs">${sugs.map(s => `<li data-item="${esc(s.id)}">
    <div class="body"><div class="t">${esc(s.title)}</div>
      <div class="meta"><span class="badge sugg">Suggested</span>${esc(s._pending ? 'Looking up…' : [placeLine(s), s.notes].filter(Boolean).join(' · '))}</div></div>
    <button class="mini keep" data-keep="${esc(s.id)}">Keep</button><button class="mini x" data-dismiss="${esc(s.id)}" aria-label="Dismiss ${esc(s.title)}">✕</button>
  </li>`).join('')}</ul>`;
}
function keepSuggestion(id) {
  const s = itemById(id); if (!s) return;
  queue('updateItem', { id, patch: { parent_id: '' } }, () => { s.parent_id = ''; });
  toast('Kept ' + s.title + ' — it’s with your places now');
}
function dismissSuggestion(id) {
  const s = itemById(id); if (!s) return;
  undoable('Dismissed ' + s.title, () => { db.items = db.items.filter(x => x.id !== id); }, () => queue('deleteItem', { id }));
}
function bindSuggestionButtons(root, after) {
  $$('[data-keep]', root).forEach(b => b.onclick = e => { e.stopPropagation(); keepSuggestion(b.dataset.keep); if (after) after(b); });
  $$('[data-dismiss]', root).forEach(b => b.onclick = e => { e.stopPropagation(); dismissSuggestion(b.dataset.dismiss); if (after) after(b); });
}
/* Claude saves suggestions with a Maps search link only; look each one up with Google once so it gets coords, hours and types */
function lookUpSuggestions() {
  if (!cfg || cfg.demo || !db.places) return;
  const done = new Set(store.get('th_sug_looked', []));
  const todo = db.items.filter(i => isSuggestion(i) && i.maps_url && !i.types && !i.place_id && !done.has(i.id)).slice(0, 12);
  if (!todo.length) return;
  todo.forEach(i => { done.add(i.id); i._pending = true; outbox.push({ action: 'refreshItem', payload: { id: i.id } }); });
  store.set('th_sug_looked', [...done].slice(-300));
  saveLocal(); render(); flush();
}

/* ---------- Saved (list) ---------- */
function itemCard(i, showDay, extraHtml) {
  const c = isTour(i) ? 'var(--tour)' : KIND_COLOR[i.kind] || 'var(--idea)';
  let when = '';
  if (i.kind === 'fixed') when = [i.day ? fmtDay(i.day, false) : '', i.start_time ? fmtTime(i.start_time) : ''].filter(Boolean).join(' ');
  else if (i.day && showDay) when = fmtDay(i.day, true);
  const kids = isTour(i) ? childrenOf(i.id).length : 0;
  const meta = i._pending ? 'Looking up…' : [placeLine(i) || (i.kind === 'idea' ? (i.notes || 'Idea') : i.address || ''), kids ? kids + ' stops' : ''].filter(Boolean).join(' · ');
  const sugs = i.kind === 'idea' ? suggestionsOf(i.id) : [];
  const ask = (i.kind !== 'idea' ? '' : i.status === 'ask' ? '<span class="badge ask">Asked Claude</span>' : i.status === 'answered' ? '<span class="badge answered">Answered</span>' : '') + theirTake(i);
  return `<div class="item kind-${esc(i.kind)} ${i.status === 'done' ? 'done' : ''} ${i._pending ? 'pending' : ''}" style="--c:${c}" data-item="${esc(i.id)}">
    <span class="mark"></span>
    <div class="body"><div class="title">${prioBadge(i)}${esc(i.title)}</div><div class="meta">${ask}${isFlight(i) && flightCodesExtra(i) ? `<span class="route-codes">${esc(flightCodesExtra(i))}</span>${meta ? ' · ' : ''}` : ''}${esc(meta)}${extraHtml ? (meta ? ' · ' : '') + extraHtml : ''}</div>${sugs.length ? suggestionList(sugs) : ''}</div>
    ${when ? `<div class="when">${esc(when)}</div>` : ''}
  </div>`;
}

const SYNONYMS = {
  food: ['restaurant', 'cafe', 'café', 'bakery', 'food', 'diner', 'bistro', 'eatery', 'deli', 'market', 'meal', 'ramen', 'sushi', 'pizza', 'noodle', 'brunch', 'breakfast', 'lunch', 'dinner'],
  eat: ['restaurant', 'cafe', 'café', 'bakery', 'food', 'diner', 'bistro', 'eatery', 'deli'],
  drinks: ['bar', 'pub', 'wine', 'brewery', 'cocktail', 'beer', 'izakaya', 'night_club', 'nightclub', 'liquor'],
  drink: ['bar', 'pub', 'wine', 'brewery', 'cocktail', 'beer', 'izakaya'],
  coffee: ['cafe', 'café', 'coffee', 'kissa'],
  shop: ['store', 'shop', 'market', 'boutique', 'shopping'],
  shopping: ['store', 'shop', 'market', 'boutique', 'shopping'],
  art: ['museum', 'gallery', 'art'],
  nature: ['park', 'garden', 'waterfall', 'lake', 'beach', 'hiking', 'natural_feature', 'mountain'],
  music: ['concert', 'music', 'record', 'venue', 'hall', 'jazz'],
  swim: ['pool', 'spa', 'onsen', 'bath', 'lagoon', 'hot_spring'],
};
function itemHaystack(i) {
  return [i.title, i.category, String(i.types || '').replace(/_/g, ' ').replace(/,/g, ' '), i.city, i.region, i.address, i.notes]
    .join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function matchesQuery(i, q) {
  const hay = itemHaystack(i);
  const toks = q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/\s+/).filter(Boolean);
  return toks.every(tok => hay.includes(tok) || (SYNONYMS[tok] || []).some(w => hay.includes(w.replace(/_/g, ' '))));
}
/** Open right now in the trip's local time: true / false / null (unknown) */
function openNow(i, tz) {
  let h; try { h = i.hours ? JSON.parse(i.hours) : null; } catch (e) { return null; }
  const P = h && h.periods;
  if (!Array.isArray(P) || !P.length) return null;
  if (P.length === 1 && P[0].open && !P[0].close) return true;
  if (!P.some(p => p.open && p.open.hour != null)) return null;
  const now = tzNow(tz), dow = parseDate(now.day).getDay();
  const [hh, mm] = now.time.split(':').map(Number);
  const t = dow * 1440 + hh * 60 + mm, WEEK = 10080;
  return P.some(p => {
    if (!p.open || p.open.hour == null) return false;
    const a = p.open.day * 1440 + p.open.hour * 60 + (p.open.minute || 0);
    let b = p.close ? p.close.day * 1440 + p.close.hour * 60 + (p.close.minute || 0) : a + 1440;
    if (b <= a) b += WEEK;
    return (t >= a && t < b) || (t + WEEK >= a && t + WEEK < b);
  });
}

function savedContent(t) {
  const its = scopedTop(t);
  const f = ui.filter;
  const counts = { fixed: 0, place: 0, idea: 0 };
  its.forEach(i => counts[i.kind] = (counts[i.kind] || 0) + 1);
  const stale = its.filter(i => i.kind !== 'fixed' && i.maps_url && !i.types).length;
  return matchesBanner(t) + `
    <div class="search">
      <input id="sv-q" type="search" placeholder="Search saved — “food”, “coffee”, a name…" value="${esc(ui.q || '')}" autocomplete="off">
      <div class="toggles">
        <button class="${ui.openNow ? 'on' : ''}" data-toggle="openNow">Open now</button>
        <button class="${ui.nearMe ? 'on' : ''}" data-toggle="nearMe">${ui.nearMe && !ui.pos ? 'Finding you…' : 'Near me'}</button>
      </div>
    </div>
    <div class="filters" id="sv-kinds" ${ui.q || ui.openNow || ui.nearMe ? 'hidden' : ''}>
      ${['all', 'fixed', 'place', 'idea'].map(k => `<button class="${f === k ? 'on' : ''}" data-filter="${k}">${k === 'all' ? `All ${its.length}` : `${KIND[k]}${k === 'fixed' ? '' : 's'} ${counts[k] || 0}`}</button>`).join('')}
    </div>
    ${ui.q || ui.openNow || ui.nearMe ? '' : inboxBlock(t)}
    <div id="sv-results">${savedResults(t)}</div>
    ${stale && !(cfg && cfg.demo) ? `<div style="text-align:center;margin-top:18px"><button class="linkbtn" data-act="refreshAll">Update ${stale} older place${stale === 1 ? '' : 's'} with Google’s place types</button></div>` : ''}`;
}

function savedResults(t) {
  const its = scopedTop(t);
  const searching = !!(ui.q || ui.openNow || ui.nearMe);
  if (searching) {
    let list = its.filter(i => i.kind !== 'fixed' && (!ui.q || matchesQuery(i, ui.q)));
    const rows = list.map(i => ({ i, open: openNow(i, t.timezone), dist: ui.pos && hasCoords(i) ? meters(ui.pos, i) : null }));
    let shown = rows, unknown = [], closed = 0;
    if (ui.openNow) {
      shown = rows.filter(r => r.open === true);
      unknown = rows.filter(r => r.open === null);
      closed = rows.filter(r => r.open === false).length;
    }
    const sort = arr => arr.sort((a, b) => ui.nearMe && ui.pos ? (a.dist ?? 1e12) - (b.dist ?? 1e12) : prioRank(a.i) - prioRank(b.i) || a.i.title.localeCompare(b.i.title));
    const card = r => itemCard(r.i, true, [
      r.dist != null ? fmtDist(r.dist) : '',
      r.open === true ? '<span style="color:var(--idea);font-weight:600">Open now</span>' : r.open === false ? '<span class="warn">Closed now</span>' : '',
    ].filter(Boolean).join(' · '));
    let html = sort(shown).map(card).join('');
    if (!shown.length) html = `<div class="empty" style="padding:24px 10px">${ui.openNow ? 'Nothing you’ve saved is open right now' : 'No saved places match'}${ui.q ? ` “${esc(ui.q)}”` : ''}.</div>`;
    if (unknown.length) html += `<div class="section-title">Hours unknown <span class="count">${unknown.length}</span></div>` + sort(unknown).map(card).join('');
    if (closed) html += `<div class="hint" style="text-align:center;margin-top:12px">${closed} closed right now, hidden.</div>`;
    return html;
  }

  const f = ui.filter;
  const show = k => f === 'all' || f === k;
  let body = '';
  if (show('fixed')) {
    const fixed = its.filter(i => i.kind === 'fixed').sort((a, b) => (a.day || '9').localeCompare(b.day || '9') || (a.start_time || '').localeCompare(b.start_time || ''));
    if (fixed.length) body += `<div class="section-title">Fixed <span class="count">${fixed.length}</span></div>` + fixed.map(i => itemCard(i, false)).join('');
  }
  if (show('place')) {
    const loose = its.filter(i => i.kind === 'place' && !i.day);
    const groups = {};
    loose.forEach(i => (groups[i.category || 'Other'] ||= []).push(i));
    const names = Object.keys(groups).sort((a, b) => (a === 'Other') - (b === 'Other') || groups[b].length - groups[a].length || a.localeCompare(b));
    if (loose.length) body += `<div class="section-title">No day yet <span class="count">${loose.length}</span></div>` +
      names.map(n => `<details class="group" open><summary>${esc(n)} <span class="count">${groups[n].length}</span></summary>${groups[n].sort((a, b) => prioRank(a) - prioRank(b) || a.title.localeCompare(b.title)).map(i => itemCard(i, false)).join('')}</details>`).join('');
    const dated = its.filter(i => i.kind === 'place' && i.day).sort((a, b) => a.day.localeCompare(b.day) || seqOf(a) - seqOf(b));
    if (dated.length) body += `<div class="section-title">On a day <span class="count">${dated.length}</span></div>` + dated.map(i => itemCard(i, true)).join('');
  }
  if (show('idea')) {
    const ideas = its.filter(i => i.kind === 'idea').sort((a, b) => prioRank(a) - prioRank(b));
    if (ideas.length) body += `<div class="section-title">Ideas <span class="count">${ideas.length}</span></div>` + ideas.map(i => itemCard(i, true)).join('');
  }
  return body || `<div class="empty"><div class="big">Nothing here yet</div>Tap + to paste a Google Maps link, add a booking, or jot down an idea.</div>`;
}

/* ---------- Log (travelogue) ---------- */

function currentLogDay(t) {

}

/** Everything the poster draws: per-day tracks, stops, stays, places saved but not visited, and the numbers. */
/** A frame cuts the trip: the whole thing, one stay's nights, one area, or a run of dates. */
function frameTest(t, frame) {

function recapData(t, frame) {
  const logs = db.log.filter(l => l.trip_id === t.id);

  const days = lived ? logDays(t) : tripDays(t);
  const ft = frameTest(t, frame);
  const pt = (o, extra) => Object.assign({ lat: +o.lat, lng: +o.lng, title: o.title || '', city: o.city || '', region: o.region || '', country: o.country || '' }, extra);

        const it = l.item_id ? itemById(l.item_id) : null;

      });

        if (isTour(e.i)) childrenOf(e.i.id).filter(hasCoords).forEach(c => seq.push(pt(c, { mode: 'tour', tour: true })));
      });

    (lived ? i.status !== 'done' && !logs.some(l => l.item_id === i.id) : !i.day)).map(i => pt(i)).filter(ft.inArea);

    if (!k) return;
    const a = tr.pts[k - 1];
    const mode = b.mode || guessMode(a, b);
    const pl = routeCache[routeKey({ from: [a.lat, a.lng], to: [b.lat, b.lng], mode })];
    let m = 0;
    if (pl) { const p = decodePolyline(pl); for (let j = 1; j < p.length; j++) m += meters({ lat: p[j - 1][0], lng: p[j - 1][1] }, { lat: p[j][0], lng: p[j][1] }); }

}

/** The trip's areas: stops grouped when within ~30 km of each other (a day trip stays one area), named by their most common city or region. */
function recapAreas(t) {
  const pts = recapData(t).allPts;
  const groups = [];
  pts.forEach(p => {
    const hits = groups.filter(g => g.some(q => meters(p, q) < 30000));
    if (!hits.length) groups.push([p]);
    else { hits[0].push(p); hits.slice(1).forEach(g => { hits[0].push(...g); groups.splice(groups.indexOf(g), 1); }); }
  });
  if (groups.length < 2) return [];
  return groups.map(g => {
    const c = g.reduce((a, p) => ({ lat: a.lat + p.lat / g.length, lng: a.lng + p.lng / g.length }), { lat: 0, lng: 0 });
    const r = Math.max(...g.map(p => meters(c, p))) / 1000 + 3;
    const tally = k => { const c = {}; g.forEach(p => { if (p[k]) c[p[k]] = (c[p[k]] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]; };
    const name = tally('city') || tally('region');
    return { name: name ? name[0] : 'Around ' + g[0].title, lat: c.lat, lng: c.lng, r: Math.round(r * 10) / 10, n: g.length };
  }).sort((a, b) => b.n - a.n);
}

/** The densest area (the city you spent the most time in) — used for "zoom in" and the locator inset. */
function recapCluster(stops) {

  let best = null, bestN = 0;
  stops.forEach(a => { const n = stops.filter(b => meters(a, b) < 2500).length; if (n > bestN) { bestN = n; best = a; } });
  const inside = stops.filter(s => meters(best, s) < 6000);
  if (inside.length === stops.length || inside.length < 3) return null;
  return inside;
}
function geoBounds(list) {
  const b = { s: 90, n: -90, w: 180, e: -180 };
  list.forEach(p => { b.s = Math.min(b.s, p.lat); b.n = Math.max(b.n, p.lat); b.w = Math.min(b.w, p.lng); b.e = Math.max(b.e, p.lng); });

}
function projector(b, rect, pad = 0.08) {

  f.inv = (x, y) => ({ lng: ((x - rect.x - rect.w / 2) / sc + cx) / k, lat: cy - (y - rect.y - rect.h / 2) / sc });

function dms(v, pos, neg) {

  return `${d}°${String(m === 60 ? 59 : m).padStart(2, '0')}′ ${v >= 0 ? pos : neg}`;
}
function longRange(a, b) {

  if (!e || a === b) return `${MONTH_LONG[s.getMonth()]} ${s.getDate()}, ${s.getFullYear()}`;
  const sameY = s.getFullYear() === e.getFullYear();
  return `${MONTH_LONG[s.getMonth()]} ${s.getDate()}${sameY ? '' : ', ' + s.getFullYear()} – ${s.getMonth() === e.getMonth() && sameY ? '' : MONTH_LONG[e.getMonth()] + ' '}${e.getDate()}, ${e.getFullYear()}`;

function listWords(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
const numWord = n => ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'][n] || String(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/** Liner notes: plain first-person sentences instead of stat tiles. */
/* ---- Credits: names, not numbers. Each one is only offered when the data behind it is solid. ---- */
const CREDITS = [
  ['fav', 'Favorite discovery', true], ['back', 'Went back to', true], ['often', 'Most often', true],
  ['ends', 'First and last', true], ['linger', 'Lingered longest', true], ['offscript', 'Off script', true],
  ['walk', 'Longest walk', true], ['hood', 'Home away from home', true], ['brought', 'Brought home', true],
  ['early', 'Earliest morning', false], ['late', 'Latest night', false], ['letdown', 'Didn’t live up to it', false],
];
function pluralCat(c) {
  const w = String(c).trim().toLowerCase().split(' '), last = w.pop();

const minsOf = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };

const dayName = d => { const x = parseDate(d); return `${DOW_LONG[x.getDay()]}, ${MON[x.getMonth()]} ${x.getDate()}`; };

/** Every credit the data can honestly support, with its value. */
function recapCredits(t, data, prefs, extras) {
  const out = {};
  const S = data.stops, tops = S.filter(s => s.top !== false);
  if (data.lived) {
    // Favorite discovery: a loved place found along the way (one with a note first), or the one Tyler picked
    // Went back to: the same place on more than one visit
    const visits = {};
    S.forEach(s => { (visits[s.key] ||= { key: s.key, title: s.title, n: 0 }).n++; });
    const back = Object.values(visits).filter(v => v.n > 1).sort((a, b) => b.n - a.n)[0];
    const finds = [...new Map(S.filter(s => s.found).map(s => [s.key, s])).values()];
    const favs = finds.filter(s => s.mark).sort((a, b) => (!!b.note - !!a.note) || ((back && a.key === back.key) - (back && b.key === back.key)));
    const fav = (prefs.fav && finds.find(s => s.key === prefs.fav)) || favs[0];
    if (fav) out.fav = { value: fav.title, choices: finds, chosen: fav.key };
    if (back) out.back = { value: `${back.title}, ${back.n === 2 ? 'twice' : numWord(back.n) + ' times'}` };
    // Most often: the kind of place
    const cats = {};
    S.forEach(s => { if (s.category && !/^(stay|flight|tour|place)$/i.test(s.category)) cats[s.category.toLowerCase()] = (cats[s.category.toLowerCase()] || 0) + 1; });
    const top = Object.entries(cats).sort((a, b) => b[1] - a[1])[0];
    if (top && top[1] > 1) out.often = { value: `${pluralCat(top[0])}, ${top[1]}` };
    // First and last
    if (tops.length > 1) out.ends = { value: `${tops[0].title} → ${tops[tops.length - 1].title}` };

}

function initRecap(tripId) {
  const t = tripById(tripId); if (!t) return;
  const canvas = $('#poster'); if (!canvas) return;

  let data = recapData(t, p.frame);

    else if (kind === 'dates') setFrame({ kind: 'dates', from: t.start || data.days[0], to: t.end || data.days[data.days.length - 1], name: '' });
